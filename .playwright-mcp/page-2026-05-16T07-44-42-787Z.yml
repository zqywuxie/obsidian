              - generic [ref=e143]:
                - heading "Abstract" [level=2] [ref=e144]
                - paragraph [ref=e145]:
                  - text: UCell is an R package for evaluating gene signatures in single-cell datasets. UCell signature scores, based on the Mann-Whitney U statistic, are robust to dataset size and heterogeneity, and their calculation demands less computing time and memory than other available methods, enabling the processing of large datasets in a few minutes even on machines with limited computing power. UCell can be applied to any single-cell data matrix, and includes functions to directly interact with Seurat objects. The UCell package and documentation are available on GitHub at
                  - link "https://github.com/carmonalab/UCell" [ref=e146] [cursor=pointer]:
                    - /url: https://github.com/carmonalab/UCell
                  - text: .
              - generic [ref=e149]:
                - heading "SIGN UP FOR Computational and Structural Biotechnology Journal eTOC ALERTS!" [level=4] [ref=e150]
