                - paragraph [ref=e250]:
                  - text: We note that the U statistic is closely related to the area-under-the-curve (AUC) statistic for ROC curves
                  - link "[8]" [ref=e251] [cursor=pointer]:
                    - /url: "#b0040"
                  - text: ", therefore we expect UCell scores to correlate with methods based on AUC scores such as AUCell"
                  - link "[6]" [ref=e252] [cursor=pointer]:
                    - /url: "#b0030"
                  - text: . Internally, UCell uses the frank function from the data.table package
                  - link "[9]" [ref=e253] [cursor=pointer]:
                    - /url: "#b0045"
                  - text: for efficient ranks computations. Large datasets are automatically split into batches of reduced size, which can be processed serially (minimizing memory usage) or in parallel through the future package
                  - link "[10]" [ref=e254] [cursor=pointer]:
                    - /url: "#b0050"
                  - text: (minimizing execution time) depending on the available computational resources.
              - generic [ref=e255]:
                - heading "3. Results" [level=2] [ref=e256]
                - paragraph [ref=e257]:
                  - text: UCell is an R package for the evaluation of gene signature enrichment designed for scRNA-seq data. Given a gene expression matrix or Seurat object, and a list of gene sets, UCell calculates signature scores for each cell, for each gene set. In the following illustrative example, we applied UCell to a single-cell multimodal dataset of human blood T cells
                  - link "[11]" [ref=e258] [cursor=pointer]:
                    - /url: "#b0055"
                  - text: ", which were annotated by the authors using both gene (scRNA-seq) and cell surface marker expression (CITE-seq) ("
                  - link "Fig. 1" [ref=e259] [cursor=pointer]:
                    - /url: "#f0005"
                  - text: A). Provided a set of T cell subtype-specific genes (
                  - link "Table 1" [ref=e260] [cursor=pointer]:
                    - /url: "#t0005"
                  - text: ), UCell helps interpreting clusters in terms of signature enrichment in low-dimensional spaces such as the UMAP (
                  - link "Fig. 1" [ref=e261] [cursor=pointer]:
                    - /url: "#f0005"
                  - text: B). Importantly, UCell scores are based on the relative ranking of genes for individual cells, therefore they are robust to dataset composition. Evaluating a CD8 T cell signature on the full dataset or on CD8 T cells only, results in identical score distributions for CD8 T cells in the two settings (
                  - link "Fig. 1" [ref=e262] [cursor=pointer]:
                    - /url: "#f0005"
                  - text: C). Conversely, AddModuleScore from Seurat normalizes its scores against the average expression of a control set of genes across the whole dataset, and is therefore dependent on dataset composition. CD8 T cells analyzed in isolation or in the context of the full T cell dataset are assigned highly different AddModuleScore scores, with median ~1 in the full dataset and median ~0 for the CD8 T cell subset (
                  - link "Fig. 1" [ref=e263] [cursor=pointer]:
                    - /url: "#f0005"
                  - text: D). Another widely-used method for single-cell signature scoring, AUCell
                  - link "[6]" [ref=e264] [cursor=pointer]:
                    - /url: "#b0030"
                  - text: ", is also based on relative rankings and therefore has the same desirable property as UCell of reporting consistent scores regardless of dataset composition. Compared to AUCell, UCell is about three times faster ("
                  - link "Fig. 1" [ref=e265] [cursor=pointer]:
                    - /url: "#f0005"
                  - text: E) and uses significantly less memory (
                  - link "Fig. 1" [ref=e266] [cursor=pointer]:
                    - /url: "#f0005"
                  - text: F). For example, AUCell requires over 64 GB of RAM to process 100,000 single-cells, while UCell uses only 5.5 GB of peak memory (
                  - link "Fig. 1" [ref=e267] [cursor=pointer]:
                    - /url: "#f0005"
                  - text: F), making it suitable even for machines with limited computing power.
                - figure [ref=e269]:
                  - img [ref=e270]
                  - generic [ref=e271]:
                    - text: Fig. 1. Evaluating T cell signatures using UCell. A) UMAP representation of T subsets from the single-cell dataset by Hao et al.
                    - link "[11]" [ref=e272] [cursor=pointer]:
                      - /url: "#b0055"
                    - text: . B) UCell score distribution in UMAP space for five gene signatures (listed in
                    - link "Table 1" [ref=e273] [cursor=pointer]:
                      - /url: "#t0005"
                    - text: ) evaluated using UCell. C-D) Comparison of UCell score (C) and Seurat’s AddModuleScore (D) distributions for a two-gene CD8 T cell signature (CD8A, CD8B), evaluated on the complete T cell dataset (black outlines), or on the subset of CD8 T cells only (red outlines); UCell scores for CD8 T cell have the same distribution in the complete or subset dataset, while AddModuleScores are highly dependent on dataset composition. E-F) Running time (E) and peak memory (F) for UCell and AUCell (which produces similar results) on datasets of different sizes show that UCell is about three times faster and requires up to ten times less memory on large (>10
                    - superscript [ref=e274]: "4"
                    - text: ) single-cell datasets. (For interpretation of the references to colour in this figure legend, the reader is referred to the web version of this article.)
