              - generic [ref=e159]:
                - heading "1. Introduction" [level=2] [ref=e160]
                - paragraph [ref=e161]:
                  - text: In single-cell RNA-seq analysis, gene signature (or “module”) scoring constitutes a simple yet powerful approach to evaluate the strength of biological signals, typically associated to a specific cell type or biological process, in a transcriptome. Thousands of gene sets have been derived by measuring transcriptional differences between different biological states or cell phenotypes, and are collected in public databases such as MSigDB
                  - link "[1]" [ref=e162] [cursor=pointer]:
                    - /url: "#b0005"
                  - text: . More recently, large-scale efforts to construct single-cell atlases
                  - link "[2,3]" [ref=e163] [cursor=pointer]:
                    - /url: "#b0010"
                  - text: are providing specific gene sets that can be useful to discriminate between cell types. For example, Han et al. have used single-cell RNA sequencing to quantify cell type heterogeneity in different tissues and to define gene signatures for >100 human and murine cell types
                  - link "[3]" [ref=e164] [cursor=pointer]:
                    - /url: "#b0015"
                  - text: . Given such a gene set, signature scoring aims at quantifying the activity of the genes in the set, with the goal to characterize cell types, states, active biological processes or responses to environmental cues. The Seurat R package
                  - link "[4]" [ref=e165] [cursor=pointer]:
                    - /url: "#b0020"
                  - text: is one of the most comprehensive and widely used frameworks for scRNA-seq data analysis. Seurat provides a computationally efficient gene signature scoring function, named AddModuleScore, originally proposed by Tirosh et al.
                  - link "[5]" [ref=e166] [cursor=pointer]:
                    - /url: "#b0025"
                  - text: . However, because genes are binned based on their average expression across the whole dataset for normalization purposes, the method generates inconsistent results for the same cell depending on the composition of the dataset. Inspired by the AUCell algorithm implemented in SCENIC
                  - link "[6]" [ref=e167] [cursor=pointer]:
                    - /url: "#b0030"
                  - text: ", we propose UCell, a gene signature scoring method based on the Mann-Whitney U statistic. UCell scores depend only on the relative gene expression in individual cells and are therefore not affected by dataset composition. We provide a time- and memory-efficient implementation of the algorithm that can be seamlessly incorporated into Seurat workflows."
