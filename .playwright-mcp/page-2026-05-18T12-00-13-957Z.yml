                - heading "Extended Data Fig. 8 PopV accurately performs labeling of cell types across different brain regions and highlights region-specific neurons." [level=3] [ref=e853]:
                  - link "Extended Data Fig. 8 PopV accurately performs labeling of cell types across different brain regions and highlights region-specific neurons." [ref=e854] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3/figures/11
                - paragraph [ref=e856]: a, UMAP embedding after scANVI integration of reference nuclei (motor cortex, M1G) and query nuclei (medial temporal gyrus, MTG) labeled with consensus score, brain region (ROI), popV prediction and original annotation (supercluster term). b, Confusion matrix for the cell types predicted by popV and their respective manual annotations highlights the agreement between both annotations. Displayed is the ratio of predicted cell types with popV for each ground truth cell type. c, Mean agreement score per cell type shows that confused cell types also exhibit a lower agreement score and can be detected based on their score. d, Differentially expressed genes for cluster ID for upper-layer intratelencephalic neurons. Highlighted are cluster IDs 135 and 138, which are over-represented in the MTG over the M1G. These clusters show an overexpression of FOXP2 and TSHZ2 and are very similar to each other.
