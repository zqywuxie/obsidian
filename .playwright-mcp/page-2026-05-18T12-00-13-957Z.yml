                      - text: Full size image
                      - img [ref=e331]
                  - paragraph [ref=e334]: a, UMAP embedding after scANVI integration of reference cells (TS) and query cells (thymus cells across different age groups) labeled by popV prediction and original annotation. b, PopV prediction score overlaid on the UMAP plot. The prediction score is low for thymocytes and higher for most other cell types. c, The prediction accuracy of the popV prediction highlights the low accuracy in developing thymocytes. d, The prediction accuracy of the popV prediction in adult thymus cells in the query shows high accuracy except for CD8 T cells. e, Left, PopV accuracy and consensus score are well correlated in all thymus cells with high accuracy for predictions with a consensus score of 7 and 8. Right, All methods show a low accuracy on fetal cells. f, Left, PopV accuracy and consensus score are also well correlated when subsetting to cells from adult donors. Right, PopV shows the highest accuracy when subsetting to adult cells; most methods show similarly high accuracy.
              - paragraph [ref=e335]:
                - text: We identified two other cell populations that are underrepresented in Tabula Sapiens compared to the query dataset, which are cortical thymic epithelial cells (also associated with involution
                - superscript [ref=e336]:
                  - link "Reference 23" [ref=e337] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR23
                    - text: "23"
                - text: ) and plasmacytoid dendritic cells. Similarly to our previous examples, we find that the consensus score associated with cortical epithelial cells is indeed low, with a variety of annotations assigned to these cells by the different algorithms, including fibroblasts and medullary epithelial cells (Supplementary Fig.
                - link "10" [ref=e338] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). The low consensus score suggests that manual curation of this group of cells is needed. In this case, the manual assignment of the correct out-of-reference label is relatively straightforward using PSMB11, an established marker of cortical thymic epithelial cells that is not expressed in any cell-type in the Tabula Sapiens reference.
              - paragraph [ref=e339]: For plasmacytoid dendritic cells, all algorithms except Scanorama + kNN predicted that those cells are B cells or plasma cells. Scanorama+ kNN predicted that those cells are dendritic cells. Even OnClass, which can predict cells not present in the reference dataset, predicted those cells as antibody-secreting cells or lymphocytes of B lineage, with not a single cell correctly predicted as a plasmacytoid dendritic cell. However, these query cells expressed high levels of CLEC4C and IL3RA and were therefore correctly labeled as plasmacytoid dendritic cells. As two-thirds of plasmacytoid dendritic cells have a score of 5 or lower, manual identification of these cells is possible, and the user can identify those confidently wrongly annotated cells using these marker genes.
              - paragraph [ref=e340]: The only cell fraction that had a high consensus score but low accuracy is a group of cells labeled as endothelial cells by popV, while annotated as lymphocytes in the original (hidden) annotation of the query dataset. However, these cells express CAVIN2, TFPI, which fits well with an annotation as endothelial cells. We found that their gene expression aligns well with lymphatic endothelial cells. Therefore, it suggests a wrong annotation in the query dataset and a correct prediction by popV.
              - paragraph [ref=e341]: Overall, this demonstrates that the consensus score yields an interpretable metric for prediction accuracy and that it helps handle cases of discrepancies between the query and reference dataset.
              - paragraph [ref=e342]:
                - text: Creating consensus cell-type labels across different sequencing technologies is important with the advent of large integration efforts. We applied popV to this scenario by transferring labels from the Lung Cell Atlas (Fig.
                - link "2" [ref=e343] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig2
                - text: ) to two lung datasets, one sequenced using Drop-seq technology and the other using nuclei sequencing
                - superscript [ref=e344]:
                  - link "Reference 24" [ref=e345] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR24
                    - text: "24"
                  - text: ","
                  - link "Reference 25" [ref=e346] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR25
                    - text: "25"
                - text: . We find an accurate transfer of labels for both datasets (Extended Data Fig.
                - link "7" [ref=e347] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig10
                - text: ). The popV consensus score again provides a metric that was better correlated with accuracy compared to the intrinsic certainty metrics of the underlying algorithms (Supplementary Figs.
                - link "11" [ref=e348] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: –
                - link "14" [ref=e349] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). Thus, it allows detecting cells that require manual scrutiny in these more challenging scenarios.
              - paragraph [ref=e350]:
                - text: PopV relies on using a Cell Ontology to aggregate votes across the ontology. For some reference datasets, cells are not annotated according to an existing Cell Ontology. We therefore tested the impact when no matching ontology is provided. For this case, we disable the use of OnClass, which requires an ontology (
                - link "Supplementary Note" [ref=e351] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: and Extended Data Fig.
                - link "8" [ref=e352] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig11
                - text: ). We find popV to perform well in this scenario. Additionally, this dataset allowed us to study the effect of different cell-type granularities on cell-type prediction. The prediction score highlights high granularity annotations as less confidently transferred and thereby requiring more manual scrutiny to perform annotation at this very fine level.
              - paragraph [ref=e353]:
                - text: Finally, we performed ablation studies to test whether algorithms can be removed from popV while maintaining accurate and well-interpretable results (Extended Data Fig.
                - link "9" [ref=e354] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig12
                - text: ). After dropping three of the eight algorithms, we found that the accuracy remains stable in the tested cases. However, we find a decrease in the ability to distinguish predictions with low accuracy. We, therefore, conclude that the number of algorithms is essential to be able to highlight low-confidence predictions.
          - generic [ref=e356]:
            - heading "Discussion" [level=2] [ref=e357]
            - generic [ref=e358]:
              - paragraph [ref=e359]: We have developed popV, an ensemble method for cell type annotation, to yield an interpretable certainty quantification for the task of cell type annotation. We have demonstrated throughout this manuscript that in various scenarios with different sequencing technologies, various cell type resolutions and various overlaps of reference and query datasets, popV yields a confidence score that is well correlated with the actual accuracy of cell type transfer. We demonstrated that the prediction score can predict cell types that are specific to the query dataset (middle temporal gyrus (MTG)-specific neurons), incorrectly annotated in the reference (CD4 T cell subsets in Tabula Sapiens) or in the query dataset (lymphatic endothelial cells in the thymus) or cell types that are not annotated in the reference dataset while present in both datasets (lung intermediate capillary endothelial cells in Tabula Sapiens).
              - paragraph [ref=e360]: PopV is implemented as an easy-to-install, open-source Python tool. The codebase is designed so that adding additional cell type classification algorithms is straightforward, thereby allowing researchers to mitigate the risk of choosing a single algorithm (that is, circumvent the no ‘one size fits all’ problem). We expect future annotation tools to be developed and popV to be used as a tool to handle various biases in these tools and to help quantify certainty in automatic prediction. As an example, upon user request, we included Harmony + kNN, which was not part of the initial release and therefore not used throughout the manuscript, as a classification model and found popV’s flexible framework to be straightforward in implementing new predictors.
              - paragraph [ref=e361]:
                - text: PopV’s performance is limited by the performance of the underlying predictors. We showed throughout the manuscript that overall popV performed equally well as the single-best method in terms of accuracy. However, the aim of popV is not to improve the accuracy of cell-type annotation over the single predictors but to yield a metric of certainty that is easy to interpret and well-calibrated. In fact, we found that algorithm-intrinsic certainties tend to be poorly correlated with the accuracy of cell-type annotation. While single methods provide similar calibration as popV, no other method provides throughout all case studies similar performance. Other methods therefore provide no reliable calibration. This is also reflected in a recent study that highlights the low calibration of conventional tools for cell-type transfer
                - superscript [ref=e362]:
                  - link "Reference 26" [ref=e363] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR26
                    - text: "26"
                - text: . Conversely, we demonstrated that the popV consensus score is highly associated with accuracy and that it helps identify cases where manual involvement is required. A future focus in the development of cell-type annotation tools will be on providing better internal certainty measurements. Including these algorithms in popV will provide even more interpretable results for label transfer, as, for example, in the case of several algorithms having low internal certainty but agreeing on the most probable label. Label transfer enables harmonizing cell-type annotations across different datasets and streamlines data analysis. However, we recommend validating the transferred labels by checking the expression of canonical marker genes because cell-type label transfer can fail. For example, for plasmacytoid dendritic cells in the thymus dataset, for which the corresponding cell type was missing from the reference dataset, these cells were incorrectly annotated as B cells.
              - paragraph [ref=e364]: We included eight different algorithms in popV and developed popV in a way that allows the inclusion of new algorithms in a straightforward manner. We performed ablation studies and found that removing algorithms led to less interpretable consensus scores and made distinguishing low-confidence predictions harder. In the future, these metrics will allow us to scrutinize, including additional algorithms or remove existing ones. Across the case studies here and in applications to other datasets, we find an accuracy greater than 95% for scores of seven and eight out of eight predictors, while we recommend manually scrutinizing predictions with a consensus score of six out of eight and less. We highlighted that the good calibration in popV is dependent on a diverse set of predictors. These predictors have different biases (integration methods with kNN classifier versus supervised classifier in gene expression space). PopV is a flexible framework that can easily be extended to new classifiers. To make popV a valuable resource for the community, we provide a Google Colab notebook with pretrained models for every tissue in the final Tabula Sapiens publication.
          - generic [ref=e366]:
            - heading "Methods" [level=2] [ref=e367]
            - generic [ref=e368]:
              - paragraph [ref=e369]:
                - text: PopV is a Python package available via the Python Package Index. Further details on popV, the source code and a model tutorial are available at
                - link "https://github.com/YosefLab/popV" [ref=e370] [cursor=pointer]:
                  - /url: https://github.com/YosefLab/popV
                - text: . This research complies with all applicable ethical regulations. No primary data were generated. All software versions were used as described in our reproducibility GitHub repository (
                - link "https://github.com/YosefLab/popv-reproducibility" [ref=e371] [cursor=pointer]:
                  - /url: https://github.com/YosefLab/popv-reproducibility
                - text: ). Specifically, popV (v0.2.2), AnnData (v0.8.0), BBKNN (v1.5.1), Celltypist (v1.6.0), Harmony-Pytorch (v0.1.7), Onclass (v1.3), Scanorama (v1.7.3), Scanpy (v1.9.3), scikit-learn (v0.24.2) and scvi-tools (v1.0.3) were used.
              - heading "Datasets" [level=3] [ref=e372]
              - heading "Tabula Sapiens" [level=4] [ref=e373]
              - paragraph [ref=e374]:
                - text: Tabula Sapiens was used throughout the manuscript as the reference dataset. It was downloaded from CELLxGENE (
                - link "https://cellxgene.cziscience.com/collections/e5f58829-1a66-40b5-a624-9046778e74f5" [ref=e375] [cursor=pointer]:
                  - /url: https://cellxgene.cziscience.com/collections/e5f58829-1a66-40b5-a624-9046778e74f5
                - text: ). The expression data were set to the raw object of the h5ad object, which contains count data for all cells and genes. This yields 483,152 cells and 58,559 genes. We filter every cell type that has less than ten cells in a respective tissue as the kNN used in popV cannot predict cells with less than eight examples (15 nearest neighbors by default; Supplementary Table
                - link "1" [ref=e376] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). We confirmed that all cell types are present in the recent version of the Cell Ontology downloaded from
                - link "https://github.com/obophenotype/cell-ontology/tree/v2023-02-19" [ref=e377] [cursor=pointer]:
                  - /url: https://github.com/obophenotype/cell-ontology/tree/v2023-02-19
                - text: . Furthermore, we validated that the cell type annotation was not donor-dependent in Tabula Sapiens. Tabula Sapiens was annotated on a per-donor basis, and for early donors, cell type labels have different names for the same cell type compared to later donors. To reduce the effect of this inconsistency, we excluded several samples (Supplementary Table
                - link "2" [ref=e378] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). Additionally, we found a strong batch effect between some 10× samples. After contacting the original authors, we found that the 10× chemistry was the reason for this and created a new metadata column containing the correct assay. The corrected assay can be accessed through
                - link "https://doi.org/10.5281/zenodo.7587774" [ref=e379] [cursor=pointer]:
                  - /url: https://doi.org/10.5281/zenodo.7587774
                - text: . All models were trained seperately for each tissue using a batch covariate of concatenated donor and assay (Supplementary Tables
                - link "3" [ref=e380] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: and
                - link "4" [ref=e381] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ).
              - heading "Lung Cell Atlas" [level=4] [ref=e382]
              - paragraph [ref=e383]:
                - text: Data were downloaded from CELLxGENE (
                - link "https://cellxgene.cziscience.com/collections/5d445965-6f1a-4b68-ba3a-b8f765155d3a" [ref=e384] [cursor=pointer]:
                  - /url: https://cellxgene.cziscience.com/collections/5d445965-6f1a-4b68-ba3a-b8f765155d3a
                - text: ). We relabeled the cell types to attain conformity with the Cell Ontology (Supplementary Table
                - link "6" [ref=e385] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). Additionally, we filtered all blood samples collected for the construction of the Lung Cell Atlas. We created a concatenated column of sample ID and assay and used this concatenated metadata as the query_batch_key in popV (Supplementary Table
                - link "5" [ref=e386] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). Throughout this manuscript, the query dataset label was not used as input to scANVI because the general application of popV is intended for an unlabeled query dataset. The Lung Cell Atlas contains 75,071 cells in total, and 39 unique cell types were used as Cell Ontology labels of 59 unique cell types in the original Lung Cell Atlas.
              - heading "Brain dataset" [level=4] [ref=e387]
              - paragraph [ref=e388]:
                - text: Data were downloaded from CELLxGENE (
                - link "https://cellxgene.cziscience.com/collections/283d65eb-dd53-496d-adb7-7570c7caa443" [ref=e389] [cursor=pointer]:
                  - /url: https://cellxgene.cziscience.com/collections/283d65eb-dd53-496d-adb7-7570c7caa443
                - text: ). We downloaded the dissection of cerebral cortex (Cx)–precentral gyrus (PrCG)–primary motor cortex-M1C and the dissection of Cx-middle temporal gyrus (MTG) as the two cortical regions with the largest number of cells (Supplementary Table
                - link "7" [ref=e390] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). Original cell type labels were used for this dataset, and we used, respectively, cluster_id and supercluster_term as the cell type key. We removed cells labeled with the supercluster terms splatter as well as miscellaneous, as these likely contain low-quality cells where manual annotation was failing. For all downstream metrics, we removed cell types with less than ten cells in each cell type label, as we found those to be reflective of nuclei from distinct brain regions (medium spiny neuron, hippocampal dentate gyrus, hippocampal CA1–3 and amygdala excitatory). We decided against using labels that conform to the Cell Ontology, as all neurons in the original data set were labeled with the same Cell Ontology term neuron, which does not reflect the heterogeneity of these cells. The cell-type labels termed subcluster_id were the finest level of annotation. However, we found little evidence for these labels in the transcriptome of nuclei and excluded those from the analysis.
              - heading "Thymus dataset" [level=4] [ref=e391]
              - paragraph [ref=e392]:
                - text: Data were downloaded from
                - link "https://cellxgene.cziscience.com/collections/de13e3e2-23b6-40ed-a413-e9e12d7d3910" [ref=e393] [cursor=pointer]:
                  - /url: https://cellxgene.cziscience.com/collections/de13e3e2-23b6-40ed-a413-e9e12d7d3910
                - text: and were analyzed using the same CELLxGENE access link. We labeled cell types to achieve granularity comparable to the reference dataset (Supplementary Table
                - link "9" [ref=e394] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). For subset analysis, fetal samples were filtered to every development stage containing a week number (for example, 4th week) as a substring, and adult samples were filtered to the human early adulthood stage. We use the donor ID and assay as the query_batch_key in popV (Supplementary Table
                - link "8" [ref=e395] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). The thymus dataset contains 255,901 cells in total, and 28 unique cell types were used as Cell Ontologies of 31 unique cell types in the original thymus dataset. All cells in this dataset were labeled according to the Cell Ontology. However, we decided to summarize all CD4
                - superscript [ref=e396]: +
                - text: ", as well as all CD8"
                - superscript [ref=e397]: +
                - text: T cells, into a common cell type to make the annotation granularity comparable between reference and query datasets (Supplementary Fig.
                - link "7" [ref=e398] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). We additionally summarized all B cells in the query and reference dataset to be annotated as B cells, as the label of B cells in Tabula Sapiens showed strong donor inconsistencies and summarized all endothelial cells to be labeled as endothelial cells to harmonize the granularity of cell type labels.
              - heading "Nucleus sequencing and Drop-seq dataset" [level=4] [ref=e399]
              - paragraph [ref=e400]:
                - text: Data were downloaded from the extended set of the Human Lung Cell Atlas (
                - link "https://cellxgene.cziscience.com/e/9f222629-9e39-47d0-b83f-e08d610c7479.cxg/" [ref=e401] [cursor=pointer]:
                  - /url: https://cellxgene.cziscience.com/e/9f222629-9e39-47d0-b83f-e08d610c7479.cxg/
                - text: ). For nuclei sequencing, we selected the study_id Sun_2020, and for Drop-seq, we selected the study_id Schiller_2020. We used donor_id as the query_batch_key and used no query_labels_key. The models were trained from scratch using 4,000 highly variable genes computed on the reference cells after subsetting to common genes in the query and reference datasets, respectively. Cell types provided in original_ann_nonharmonized were used as ground truth labels based on the manual labels in the original manuscripts
                - superscript [ref=e402]:
                  - link "Reference 24" [ref=e403] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR24
                    - text: "24"
                  - text: ","
                  - link "Reference 25" [ref=e404] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR25
                    - text: "25"
                - text: . We relabeled the cell types to achieve granularity comparable to the reference dataset (Supplementary Tables
                - link "10" [ref=e405] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: and
                - link "11" [ref=e406] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ).
              - heading "Model parameters" [level=3] [ref=e407]
              - paragraph [ref=e408]:
                - text: We use eight different cell-type annotation algorithms, and in the following, we explain our parameters for those annotation algorithms as well as the data preprocessing pipeline that we use for popV. For UMAP embedding, we used scanpy default parameters except for a min_dist of 0.3. For the kNN classifier, we use uniform weights and n_neighbors equal to 15 in sklearn.neighbors.KNeighborsClassifier. The classifier is first trained on all reference cell labels and is then applied to all query cells in prediction mode. To increase the performance of this classifier, we use a sklearn pipeline and PyNNDescent for neighbor computation
                - superscript [ref=e409]:
                  - link "Reference 27" [ref=e410] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR27
                    - text: "27"
                - text: . All default parameters for the underlying methods can be changed using a dictionary method_kwargs upon calling popv.annotate_data.
              - paragraph [ref=e411]:
                - text: Several algorithms in popV use a graphics processing unit (GPU) to accelerate training. We highly recommend using popV with a GPU. All experiments highlighted here were performed on a workstation with 128 GB of RAM, an Intel Core i9-12900KF desktop CPU and an NVIDIA 3090 GPU. All case studies performed throughout the manuscript were computed on this workstation, and cell-type prediction took less than an hour per dataset. We have applied popV to a dataset of roughly 2 million cells, which takes less than 12 h. We recommend disabling kNN on Scanorama for large datasets, as it does not scale well with a large number of experimental batches
                - superscript [ref=e412]:
                  - link "Reference 28" [ref=e413] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR28
                    - text: "28"
                - text: .
              - heading "Preprocessing" [level=4] [ref=e414]
              - paragraph [ref=e415]:
                - text: Every dataset was preprocessed using the Process_Query function in popV. The input parameters of Process_Query are explained in the popV documentation. If using a pretrained model folder, both reference and query datasets are subsets of the same genes. It is validated that both datasets contain raw counts. The cell type labels in the reference dataset are subsampled to 300 labeled cells by default to reduce the runtime of the underlying methods. The intersection of genes between the query dataset and the reference dataset is taken, and both datasets are concatenated. We remove all batches in the query and the reference dataset that contain less than nine cells in total, as otherwise BBKNN is failing and no further filtering was performed. Highly variable genes are computed using seurat_v3 flavor in scanpy
                - superscript [ref=e416]:
                  - link "Reference 29" [ref=e417] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR29
                    - text: "29"
                - text: ", and by default, 4,000 genes are selected. Count data are stored, and additionally counts are normalized to 10K counts. The log1p function is applied for methods that require normalized data and are stored in a separate layer. For the computation of principal components, the count data are scaled to unit variance. These principal components are used for Spanorama and BBKNN. All keys used to set up the model are stored in the uns field of the anndata object"
                - superscript [ref=e418]:
                  - link "Reference 30" [ref=e419] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR30
                    - text: "30"
                - text: .
              - paragraph [ref=e420]: "PopV has the following three different modes:"
              - list [ref=e421]:
                - listitem [ref=e422]:
                  - generic [ref=e423]: "1."
                  - paragraph [ref=e424]: retrain—it trains all methods from scratch and stores the classifier to reuse them on other datasets. This hugely benefits from a GPU to train the scVI and scANVI algorithms as well as the OnClass algorithm.
                - listitem [ref=e425]:
                  - generic [ref=e426]: "2."
                  - paragraph [ref=e427]:
                    - text: inference—it uses pretrained methods to classify query and reference cells; computes a joint UMAP embedding of query and reference cells and by default uses all eight methods; and trains scVI and scANVI models for 20 epochs using scArches query embedding
                    - superscript [ref=e428]:
                      - link "Reference 19" [ref=e429] [cursor=pointer]:
                        - /url: /articles/s41588-024-01993-3#ref-CR19
                        - text: "19"
                    - text: .
                - listitem [ref=e430]:
                  - generic [ref=e431]: "3."
                  - paragraph [ref=e432]: fast—it uses pretrained methods to classify only query cells; computes a UMAP embedding of query cells if enabled; skips Scanorama and BBKNN data integration as those recompute an embedding instead of projecting cells into an existing embedding; and trains scVI and scANVI models for 1 epoch using scArches query embedding.
              - heading "BBKNN" [level=4] [ref=e433]
              - paragraph [ref=e434]:
                - text: Batch-balanced kNN is a data integration method. To integrate the datasets, BBKNN takes the nearest neighbors from each batch to construct a balanced neighborhood graph. This nearest-neighbor graph can then be used as a batch-corrected graph embedding of the data
                - superscript [ref=e435]:
                  - link "Reference 13" [ref=e436] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR13
                    - text: "13"
                - text: . The default settings for popV and those used throughout the manuscript are 50 principal components, 8 neighbors_within_batch and the angular metric. We found that the angular metric outperforms a standard Euclidean metric in our use case. We use the implementation of BBKNN in scanpy.external.pp.bbknn. The batch-balanced nearest neighbors are used as a precomputed metric in sklearn.neighbors.KNeighborsClassifier and used as input for UMAP dimensionality reduction.
              - heading "Spanorama" [level=4] [ref=e437]
              - paragraph [ref=e438]: Scanorama is a data integration method. It searches for the mutual nearest neighbors across datasets and uses panoramic stitching. Cells are then integrated in PCA space using those mutual neighbors. By default in popV and throughout the manuscript, 50 principal components are used. We compute a new joint embedding of the query and the reference dataset using scanorama.integrate_scanpy function. This joint embedding is used for the kNN classification and UMAP embedding.
              - heading "scVI" [level=4] [ref=e439]
              - paragraph [ref=e440]: "ScVI is a variational auto-encoder that incorporates batch keys as latent variables and provides data integration in its latent space. We use the following nondefault parameters for scVI: dropout_rate = 0.05, n_layers = 3, n_latent = 20, gene_likelihood = nb, encode_covariates = True and use_layer_norm = both. The reason for these nonstandard parameters is to facilitate the integration of a query dataset using scArches. For the training parameters, we use by default scVI with n_epochs_kl_warmup = 20 epochs. We compute the joint latent representation of query and reference data, and this joint embedding is used for the kNN classification and UMAP embedding."
              - heading "scANVI" [level=4] [ref=e441]
              - paragraph [ref=e442]: In addition to scVI, a classifier is trained during the training of the auto-encoder on the positions in latent space to classify cells into the provided reference cell type labels. We continue training based on the trained scVI model to reduce the overall training time. For the classifier in scANVI, we use n_layers = 3 and dropout_rate = 0.1. Subsampled labels are used as discussed above. We use as training parameters batch_size = 512 and n_samples_per_label = 20 to stabilize the training of the classifier. Subsequently, the built-in classifier is used to predict cell type labels in the query dataset.
              - heading "RF" [level=4] [ref=e443]
              - paragraph [ref=e444]: RF uses an ensemble of classification trees together with random feature subsetting to regularize the classification trees. The final prediction is the majority vote across the tree ensemble. We use normalized counts (see above) as input for RF and sklearn.ensemble.RandomForestClassifier as the classifier. We use nondefault parameters as max_features = 200 and class_weight = balanced_subsample as we found the best performance using this parameter combination. For training the classifier, subsampled cell type labels are used as described above, as this improves prediction speed.
              - heading "SVM" [level=4] [ref=e445]
              - paragraph [ref=e446]: SVMs find the hyperplane that best separates the data. We use sklearn.svm.LinearSVC as the classifier. We use nondefault parameters as C = 1, max_iter = 5,000 and class_weight = balanced as we found the best performance using this combination of parameters. For training the classifier, subsampled cell type labels are used as described above for RF, as this improves prediction speed. To allow computation of prediction probabilities, we use sklearn.calibration.CalibratedClassifierCV.
              - heading "Celltypist" [level=4] [ref=e447]
              - paragraph [ref=e448]: Celltypist uses a logistic regression framework. We use nondefault parameters check_expression = False and max_iter = 500 to allow for faster model training. During celltypist.annotate, we use majority_voting = True except in fast mode where we set it to False. As intrinsic probabilities, we use predictions.probability_matrix as the majority voting purity and not the initial logistic regression probabilities. This is similar to the probabilities used in the Celltypist tutorials.
              - heading "OnClass" [level=4] [ref=e449]
              - paragraph [ref=e450]:
                - text: OnClass first computes an embedding of the Cell Ontology using natural language processing (NLP) on the cell type names and then applies random walks. This can be embedded using singular value decomposition
                - superscript [ref=e451]:
                  - link "Reference 31" [ref=e452] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR31
                    - text: "31"
                - text: . Then a bipartite neural network was optimized to allow classification of the reference cells. The network is then applied to unannotated cells. By design, this allows the classification of unseen cell types in the Cell Ontology term-based low-dimensional embedding. We downloaded the Open Biological and Biomedical Ontology Foundry (OBO) Ontology files in version releases/2023-01-09. To allow fast retraining of sentence embedding, we use sentencetransformer.SentenceTransformer(‘all-mpnet-base-v2’) as the NLP model. This is a newer NLP model than in the original OnClass publication but allows in our hands for faster convergence. We encode all descriptions or cell-type labels in the OBO file. We provide notebooks for retraining with newer releases of ontology files or different species. We provide several ontology files in our GitHub repository; these are cl.obo, which is the downloaded file from
                - link "https://github.com/obophenotype/cell-ontology" [ref=e453] [cursor=pointer]:
                  - /url: https://github.com/obophenotype/cell-ontology
                - text: . Cl.ontology is a file containing only the is_a cell type relationships from the cl.obo file, and cl.ontology.nlp.emb contains the embeddings of the cl.obo file. As count data, we use normalized data (see above) and disable the options to recompute this normalization in OnClass. OnClass provides the option to use batch integration using Scanorama. We disabled this option to not bias the prediction based on the performance of Scanorama. We found no sign of a strong batch effect in cell-type prediction. For OnClass, we provide two different cell-type labels. OnClass_seen is the prediction of all cells limited to the cell types in the reference dataset, while OnClass_prediction contains for each cell type the final output of the OnClass model. OnClass currently only outputs predictions after step 2 for 10% of the cells, although it computes those on all cells. We found this procedure wasteful and implemented our own version that outputs labels after step 2 on all cells.
              - heading "Harmony" [level=4] [ref=e454]
              - paragraph [ref=e455]:
                - text: Harmony was not used throughout the manuscript. However, we found it to scale better to large-scale datasets (more than a million cells and 50 batches) than Scanorama. Harmony uses soft K-means clustering and shifts the centroids of those K-means clusters to allow batch correction
                - superscript [ref=e456]:
                  - link "Reference 17" [ref=e457] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR17
                    - text: "17"
                - text: . We used 50 principal components as default input to Harmony. We used an efficient GPU-enabled version of Harmony (
                - link "https://github.com/lilab-bcb/harmony-pytorch" [ref=e458] [cursor=pointer]:
                  - /url: https://github.com/lilab-bcb/harmony-pytorch
                - text: ). We computed a new joint embedding of the query and the reference dataset using harmony.harmonize function. This joint embedding is used for the kNN classification and the UMAP embedding.
              - heading "Seurat label transfer" [level=4] [ref=e459]
              - paragraph [ref=e460]:
                - text: Seurat uses canonical component analysis and nearest-neighbor matching to first integrate the reference dataset and then map the query dataset to this integrated dataset
                - superscript [ref=e461]:
                  - link "Reference 21" [ref=e462] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR21
                    - text: "21"
                - text: . Seurat is not part of popV, as copying a data frame to R can be a time-consuming step for large data. However, we compared the performance of popV with Seurat for the Lung Cell Atlas. We computed 2,000 genes using FindVariableFeatures with vst transformation in Seurat. We used FindIntegrationAnchors using 30 CCA components. Subsequently, we scaled the corrected counts and calculated 30 principal components. Those components were used in FindTransferAnchors, and afterward, TransferData was called to transfer the labels from the reference dataset to the query dataset.
              - heading "Consensus voting" [level=4] [ref=e463]
              - paragraph [ref=e464]:
                - text: As described in the manuscript, we tried majority voting as well as Cell Ontology-based aggregation of OnClass results (Extended Data Fig.
                - link "1" [ref=e465] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig4
                - text: ). We found the Cell-Ontology-based aggregation to outperform majority voting (Supplementary Fig.
                - link "1" [ref=e466] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). For this voting strategy, we take the majority vote (counting all predictions) for all predictors except OnClass. For OnClass prediction, we use the predicted cell type and, in addition, every cell type along the path from this cell type to the root node of the Cell Ontology graph and increase the score of those ancestors by 1. We take as consensus score the score at each cell type level node and take as popV prediction the cell type node with the highest score. For majority voting, we use the prediction in OnClass_seen and count the predictors who agree on a certain cell type node. The node with the majority of votes is used as the majority-voted cell type label. If there is a tie between two nodes in the number of votes, we use the cell type label that is further down the Cell Ontology tree, meaning the more granular cell type. If there is still disagreement, we use the cell type that is later in the alphabet to have a deterministic mapping and not rely on the order of cell types in the prediction matrix.
              - heading "Evaluation metrics" [level=3] [ref=e467]
              - paragraph [ref=e468]: All code for creating evaluation plots is available in the popV package as a _reproducibility module. We will discuss those metrics here. For displaying the translations of cell type terms, we use alluvial plots that highlight the corresponding cell types before and after translation to a Cell Ontology conform term.
              - heading "Accuracy metrics" [level=4] [ref=e469]
              - paragraph [ref=e470]: If no Cell Ontology graph is available, we use F1 metrics to quantify accuracy. The micro-F1 accuracy computes the number of exact matches across the whole dataset and is a global metric, whereas the macro-F1 score computes a per-cell-type accuracy and averages this across all cell types. The macro-F1 accuracy therefore better represents the performance across rare cell types. We found agreement between both metrics in their evaluation of performance, but the macro-F1 accuracy is more sensitive as rare cell types are harder to predict.
              - paragraph [ref=e471]: If a Cell Ontology is available, we reasoned that the performance of a predictor is preferable if it predicts a closely related cell type. We therefore computed different matching scores. We computed an exact match similar to the F1 score as cell types that are correctly predicted. Parent match means that the predicted term is a node that is one step closer to the root of the Cell Ontology graph, while child match means that the predicted term is one step further away from the root. Sibling match means that the cell type is two steps away from the correct cell and has the same depth as the original cell type in the Cell Ontology tree. We also experimented with more fine-grained metrics quantifying the distance in the Cell Ontology tree between two cell types. However, after manually checking the corresponding cell types, we found that the nearest matches were the correct metric to evaluate classification, as cell types that are further apart tend to be distinct cell-types.
              - heading "Confusion matrix" [level=4] [ref=e472]
              - paragraph [ref=e473]: We use scikit-learn.metric.confusion_matrix and normalize those entries. We compute these matrices between all algorithms and the ground-truth label but also between the different algorithms and the consensus label.
              - heading "Differential expression analysis" [level=4] [ref=e474]
              - paragraph [ref=e475]: We use scanpy.tl.rank_genes_groups with default parameters to yield differentially expressed genes and scanpy.pl.rank_genes_groups_dotplot to plot those results.
              - heading "Precision–recall curves" [level=4] [ref=e476]
              - paragraph [ref=e477]: We are evaluating whether a decision boundary exists to distinguish between inaccurate predictions and accurate predictions. To this end, whether a prediction is an exact match is used as the label, and the prediction certainty is used as the class probability. Precision–recall curves are computed based on these two values. The area under the precision–recall curve is computed using sklearn.metrics.average_precision_score and the F1 score at the decision boundary using sklearn.metrics.f1_score. To calculate the best decision boundary, we compute the point with the highest F1 score. As some probabilities are discrete, like the popV consensus score, we include all cells at the decision boundary as positive cells. We provide the ratio of cells equal to or above the boundary, the accuracy of those cells and the boundary value in the respective plots.
              - heading "Ablation experiment" [level=4] [ref=e478]
              - paragraph [ref=e479]: We are evaluating whether removing predictors leads to a reduction in accuracy or calibration for popV. We study this for the thymus case study as well as the scRNA to snRNA label transfer case study. We first remove OnClass from the popV algorithms. After removing, simple majority voting and the popV consensus voting yield the same results. Afterward, we remove all pairs of the seven remaining predictors and compute the majority voting result of these five predictors as well as the consensus score. We compute the weighted F1 score and the area under the precision–recall curve for each set of five predictors. In the title of these plots, we present the value in the original popV algorithm, while in each field of the resulting heatmaps, we present the difference in the respective score between the full popV algorithm and the set of five predictors.
              - heading "Comparison to majority voting of SVM classifiers" [level=4] [ref=e480]
              - paragraph [ref=e481]:
                - text: We are evaluating whether majority voting after predicting cell types with a set of SVM classifiers is similar in performance to popV. For this comparison, we use the implementation of SVM in cuML and set up a multiclass classifier using scikit-learn’s multiclass.OneVsRestClassifier. We train eight different SVM algorithms that differ in their kernel (sigmoid, polynomial, linear and radial basis function) and the respective cost parameters (0.1 and 1.0). We otherwise used the default hyperparameters in cuML. After predicting the labels for every cell in the Lung Cell Atlas case study, we perform majority voting between the predictions of the underlying SVM predictors and subset the resulting dataset to all query cells. We compute the Hamming similarity by computing 1 − HammingDistance and display the results as the upper triangle comparing all pairs of algorithms against each other. All other metrics in Extended Data Fig.
                - link "4" [ref=e482] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig7
                - text: are described in other parts of the
                - link "Methods" [ref=e483] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Sec7
                - text: and are applied here similarly to the results of both algorithms. We do not display the results of OnClass in Extended Data Fig.
                - link "4e" [ref=e484] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig7
                - text: to reduce the amount of colors in the resulting plot.
              - heading "Statistics and reproducibility" [level=3] [ref=e485]
              - paragraph [ref=e486]:
                - text: No statistical method was used to predetermine the sample size. No data were excluded from the analyses except as highlighted in the
                - link "Methods" [ref=e487] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Sec7
                - text: . The experiments were not randomized, and the investigators were not blinded to allocation during experiments and outcome assessment.
              - heading "Reporting summary" [level=3] [ref=e488]
              - paragraph [ref=e489]:
                - text: Further information on research design is available in the
                - link "Nature Portfolio Reporting Summary" [ref=e490] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM2
                - text: linked to this article.
        - generic [ref=e491]:
