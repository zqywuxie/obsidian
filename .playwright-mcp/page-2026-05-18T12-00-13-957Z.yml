        - generic [ref=e169]:
          - generic [ref=e171]:
            - heading "Main" [level=2] [ref=e172]
            - generic [ref=e173]:
              - paragraph [ref=e174]:
                - text: Cell-type annotation is a crucial task in analyzing single-cell RNA sequencing (scRNA-seq) data. The quality of the annotations has a direct impact on downstream analyses such as the comparison of cell type composition as well as the analysis performed on a per-cell-type basis
                - superscript [ref=e175]:
                  - link "Reference 1" [ref=e176] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR1
                    - text: "1"
                - text: . Manual annotation is highly time-consuming and requires biological context-specific and sequencing technology-specific domain knowledge. Thus, as scRNA-seq becomes an increasingly standard lab technique, there is a growing need to generate automated annotations. We propose here the use of a collection of cell-type prediction models to provide not only automated annotations but also well-calibrated measures of uncertainty. This enables the user to streamline the annotation process.
              - paragraph [ref=e177]:
                - text: Automated cell type annotations encounter several challenges
                - superscript [ref=e178]:
                  - link "Reference 2" [ref=e179] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR2
                    - text: "2"
                - text: . There is no gold standard ground truth for cell type annotation within a specific dataset. Biology is complex, and when cell states vary continuously, delineations between cell types are imprecise, and even human experts may disagree on the exact phenotype of a specific cell. Therefore, it is essential that annotation methods highlight areas of uncertainty that require expert knowledge input. The continuous nature of cell states
                - superscript [ref=e180]:
                  - link "Reference 3" [ref=e181] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR3
                    - text: "3"
                - text: ", along with stochasticity in the sequencing process, as well as the domain knowledge of the person manually annotating the dataset, can lead to cells being annotated at varying levels of specificity even within the same dataset. Across multiple datasets, factors, like identification of new cell subtypes or redefinition of marker genes, lead to discrepancies in cell type identification. There are a plethora of automated cell-type annotation methods"
                - superscript [ref=e182]:
                  - link "Reference 4" [ref=e183] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR4
                    - text: "4"
                - text: . However, differences in cell type granularity, experiment-specific nuisance factors and technology-dependent sparsity of gene expression lead to no clear ‘best method’ for automatic annotation. Based on these factors, we propose that it is crucial for automatic cell-type annotation pipelines
                - superscript [ref=e184]:
                  - link "Reference 5" [ref=e185] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR5
                    - text: "5"
                - text: to highlight areas of uncertainty that may require manual scrutiny, balance the specificity of predictions with accuracy and be easily accessible and usable.
              - paragraph [ref=e186]:
                - text: To address these challenges, we developed popular Vote (popV), a flexible and scalable automated cell-type annotation framework that takes in an unannotated query dataset from a scRNA-seq experiment, transfers labels from an annotated reference dataset and generates predictions with a predictability score indicating the confidence of the prediction. We pose here that various prediction methods will disagree in their prediction if an annotation is not accurate, whereas they will tend to agree if the predicted cell type is the correct one. We named our method popV because instead of relying on the predictions of a single classifier, popV takes a consensus approach and incorporates the predictions from eight automated annotation methods. PopV also takes into account annotations at different levels of granularity by aggregating results over the Cell Ontology
                - superscript [ref=e187]:
                  - link "Reference 6" [ref=e188] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR6
                    - text: "6"
                - text: ", an expert-curated formalization of cell types in a hierarchical structure with a standardized vocabulary."
              - paragraph [ref=e189]:
                - text: PopV is available as an easy-to-install, open-source Python package and is designed to be a flexible framework for incorporating future cell-type classification methods. We provide a notebook that allows the prediction of new datasets and provides pretrained models for 20 different organs based on the Tabula Sapiens dataset
                - superscript [ref=e190]:
                  - link "Reference 7" [ref=e191] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR7
                    - text: "7"
                - text: .
          - generic [ref=e193]:
            - heading "Results" [level=2] [ref=e194]
            - generic [ref=e195]:
              - heading "Overview of popV" [level=3] [ref=e196]
              - paragraph [ref=e197]:
                - text: PopV takes a consensus of experts’ approach to the task of automated cell type annotation. The input is an unannotated query dataset together with an annotated reference dataset (Fig.
                - link "1a" [ref=e198] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig1
                - text: "). Both datasets are expected to contain raw count data and demonstrate that popV can be applied to unique molecular identifier as well as non-unique molecular identifier-based technologies. PopV then runs the following eight different annotation methods: random forest (RF)"
                - superscript [ref=e199]:
                  - link "Reference 8" [ref=e200] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR8
                    - text: "8"
                - text: ", support vector machine (SVM)"
                - superscript [ref=e201]:
                  - link "Reference 8" [ref=e202] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR8
                    - text: "8"
                - text: ", scANVI"
                - superscript [ref=e203]:
                  - link "Reference 9" [ref=e204] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR9
                    - text: "9"
                - text: ", OnClass"
                - superscript [ref=e205]:
                  - link "Reference 10" [ref=e206] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR10
                    - text: "10"
                - text: ", Celltypist"
                - superscript [ref=e207]:
                  - link "Reference 11" [ref=e208] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR11
                    - text: "11"
                - text: and k-nearest neighbors (kNN) after batch correction with three single-cell harmonization methods—scVI
                - superscript [ref=e209]:
                  - link "Reference 12" [ref=e210] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR12
                    - text: "12"
                - text: ", BBKNN"
                - superscript [ref=e211]:
                  - link "Reference 13" [ref=e212] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR13
                    - text: "13"
                - text: and Scanorama
                - superscript [ref=e213]:
                  - link "Reference 14" [ref=e214] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR14
                    - text: "14"
                - text: (Fig.
                - link "1" [ref=e215] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig1
                - text: ). The eight prediction algorithms were chosen because they were shown to have good prediction accuracy
                - superscript [ref=e216]:
                  - link "Reference 15" [ref=e217] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR15
                    - text: "15"
                - text: and/or good harmonization performances
                - superscript [ref=e218]:
                  - link "Reference 16" [ref=e219] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR16
                    - text: "16"
                - text: . These methods encompass supervised methods that are trained only on labeled data (RF, SVM, OnClass, Celltypist and kNN) after applying unsupervised harmonization methods that are agnostic to label information during training (BBKNN, Scanorama and scVI) and a semi-supervised method trained with both labeled and unlabeled data (scANVI). However, we emphasize that popV offers an intuitive application interface (API) for the rapid inclusion of additional annotation methods. We demonstrate this capability through a code snippet for adding a new classifier (kNN after batch correction with Harmony
                - superscript [ref=e220]:
                  - link "Reference 17" [ref=e221] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR17
                    - text: "17"
                - text: ) in the
                - link "Methods" [ref=e222] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Sec7
                - text: .
              - 'figure "Fig. 1: Framework of popV for automatic cell type annotation." [ref=e224]':
                - generic [ref=e226]: "Fig. 1: Framework of popV for automatic cell type annotation."
                - generic [ref=e227]:
                  - generic [ref=e228]:
                    - 'img "Fig. 1: Framework of popV for automatic cell type annotation." [ref=e230]'
                    - generic [ref=e231]: The alternative text for this image may have been generated using AI.
                    - link "Full size image figure 1" [ref=e233] [cursor=pointer]:
                      - /url: /articles/s41588-024-01993-3/figures/1
                      - text: Full size image
                      - img [ref=e234]
                  - paragraph [ref=e237]: PopV takes an unannotated query dataset and an annotated reference dataset as input. Each expert algorithm predicts the label on the query dataset to yield a cell-type annotation. The certainty of the respective label transfer can be quantified by scoring the agreement of those methods. The workflow yields a sample report to provide the user with insights into the annotated labels.
              - paragraph [ref=e238]:
                - text: After applying each of these methods separately, popV proceeds to aggregate the resulting predictions for two purposes (Extended Data Fig.
                - link "1" [ref=e239] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig4
                - text: ). The first is to designate a single ‘consensus’ annotation for every query cell. The second purpose is to quantify our certainty in this prediction. We estimate the consensus annotation using a simple majority vote procedure, counting for each annotation label the number of algorithms that support it. In this procedure, all algorithms get a single ‘vote’, except for OnClass, which received several votes. The reason for that is that OnClass is the only method in our collection of methods that is capable of predicting cell types that do not exist in the reference dataset. It does so through a two-step process—first selecting an annotation out of the collection of labels in the reference dataset and then propagating it to identify a potentially more refined label in the Cell Ontology (even if this label is absent from the reference). To account for these ‘out of sample’ cell type annotations, we consider every label that is on the path from the root of the ontology down to the OnClass-predicted label as a predicted label (Extended Data Fig.
                - link "1" [ref=e240] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig4
                - text: ). We then perform majority voting with OnClass having multiple ‘votes’ at different levels of hierarchy. We have attempted using a simple majority vote with the ‘within sample’ annotation from the first stage of OnClass and with no propagation along the Cell Ontology. In most of our analyses, we found our first strategy to outperform the simple strategy (Supplementary Fig.
                - link "1" [ref=e241] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ).
              - paragraph [ref=e242]: A potentially useful property of many of the algorithms included in popV is an ‘algorithm-intrinsic’ estimation of prediction certainty. This could, in principle, be leveraged to compute a weighted consensus. However, we found that the certainties are calibrated differently for the different methods, which makes this approach futile as it will weigh more on the predictions of classifiers with higher estimated certainties.
              - paragraph [ref=e243]:
                - text: After calculating the consensus score, popV generates a sample report that includes prediction summaries as well as integrated views of the query and reference datasets. For the latter, it displays Uniform Manifold Approximation and Projections (UMAPs) for the joint visualization of the reference and query datasets for the four methods that perform data integration (Fig.
                - link "1" [ref=e244] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig1
                - text: ), as well as a bar plot comparing cell type frequencies in the reference and query dataset to highlight the differential abundance of various cell types. One set of summaries in the report is confusion matrices between the consensus predictions and each individual method to indicate which cell types were confused with another cell type for any particular method. The report also includes a per-cell-type display of the consensus score (that is, the number of agreeing methods—between 1 and 8) to highlight which cell types are overall difficult to predict. Complementing this ‘algorithm-extrinsic’ estimation of certainty, we also output the intrinsic uncertainty (that is, classifier score) of each of the eight methods (these scores are defined in the
                - link "Methods" [ref=e245] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Sec7
                - text: ). We emphasize that intrinsic and extrinsic uncertainty are two complementary measurements essential to quantifying the performance of a set of cell annotation tools.
              - paragraph [ref=e246]:
                - text: To allow for fast annotation of new query datasets, we provide pretrained models for all 20 organs present in Tabula Sapiens
                - superscript [ref=e247]:
                  - link "Reference 18" [ref=e248] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR18
                    - text: "18"
                - text: . Pretraining is possible for all methods except Scanorama and BBKNN, which compute a joint embedding of reference and query datasets and make pretraining infeasible. For scVI and scANVI, we provide pretrained embeddings of the reference dataset and map the query dataset to this embedding using scArches
                - superscript [ref=e249]:
                  - link "Reference 19" [ref=e250] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR19
                    - text: "19"
                - text: ". PopV has the following three different modes of cell type prediction: in retrain mode, all classifiers are trained from scratch, which requires an hour for 100k cells in a Google Colab session; in inference mode, models previously trained for the reference dataset are used where applicable, which requires 30 min for 100k cells; in fast mode, only pretrained models are used and only cell types in the query dataset are predicted, which requires 5 min for 100k query cells. PopV is available as an open-source Python project and includes an online Google Colab notebook with free computing resources. The codebase enables the addition of new reference datasets (in addition to Tabula Sapiens) through a simple API and can be invoked from the same notebook environment. We recommend that in any newly added reference datasets, the annotations should be consistent with Cell Ontology, either by matching terms in the ontology or by hierarchically assigning new terms to existing terms in the ontology. To this end, we provide scripts to add custom cell type labels to the Cell Ontology before processing by popV (where it is used for running OnClass and calculating our consensus scores)."
              - heading "PopV prediction score discriminates high- and low-quality annotations" [level=3] [ref=e251]
              - paragraph [ref=e252]:
                - text: We evaluated the performance of cell-type annotation using popV with a Human Lung Cell Atlas as the query dataset
                - superscript [ref=e253]:
                  - link "Reference 20" [ref=e254] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR20
                    - text: "20"
                - text: and the lung tissue of Tabula Sapiens as a reference dataset. The Lung Cell Atlas is carefully annotated to a high level of granularity. It contains a wide variety of cell types across immune cells, epithelial cells, endothelial cells and stromal cells and is therefore well suited for studying tissues with diverse labels. To make the labels comparable across both datasets, we translated the Lung Cell Atlas labels to the corresponding terms in the Cell Ontology (Supplementary Fig.
                - link "2" [ref=e255] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ).
              - paragraph [ref=e256]:
                - text: PopV achieves high accuracy on the Lung Cell Atlas. We visualize the popV predictions against the manual annotations in the Lung Cell Atlas and see a strong agreement between the prediction and the original annotation, as well as a good integration between the query and the reference cells (Fig.
                - link "2a" [ref=e257] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig2
                - text: ). We decided here to use scANVI integration as it showed the highest performance in scIB metrics, which measure data integration and biological conservation
                - superscript [ref=e258]:
                  - link "Reference 16" [ref=e259] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR16
                    - text: "16"
                - text: (Extended Data Fig.
                - link "2a" [ref=e260] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig5
                - text: ). To evaluate the quality of our predictions, we compute accuracy terms based on the Cell Ontology tree (
                - link "Methods" [ref=e261] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Sec7
                - text: ). An exact match, as the name implies, means that the predicted cell type is exactly the same as the manual annotation. Furthermore, intuitively, a prediction algorithm that predicts one cell type as another similar cell type performs better than a prediction algorithm that predicts the cell is of an unrelated type. The parent match, child match and sibling match take this into account and measure if the predicted cell type is the parent, child or sibling in the Cell Ontology tree compared to the ground truth annotation. This measure is especially useful if a cell type label exists only in the query and not in the reference dataset. Every prediction that did not match any of these relationships was classified as no match. PopV overall achieves high accuracy for most cell types (Fig.
                - link "2b" [ref=e262] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig2
                - text: and Extended Data Fig.
                - link "2c" [ref=e263] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig5
                - text: ). Except for scANVI and OnClass, all methods have comparable performance in this dataset. Furthermore, we compared the performance of popV with the label transfer provided in Seurat, which is another popular tool for cell type annotation transfer
                - superscript [ref=e264]:
                  - link "Reference 21" [ref=e265] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR21
                    - text: "21"
                - text: ", and found that Seurat performs worse than most methods used in popV. We also included OnClass predictions after step one (OnClass_seen), where OnClass only predicts cell types that were present in the reference dataset, and found this to perform similarly to the good-performing annotation tools, so that the lower performance of OnClass here is solely due to the prediction of unseen cell types. Overall, popV performed best for the number of exact matches and was comparable in the number of cells with no match, highlighting that the popV prediction is more accurate than any of the single methods. For a better insight into the prediction, we display bar plots in the report for popV, highlighting the abundance of cell types in query and reference datasets, as well as prediction accuracy (Extended Data Fig."
                - link "2" [ref=e266] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig5
                - text: ), and display confusion of cell types using alluvial plots (Supplementary Fig.
                - link "3" [ref=e267] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ).
