          - generic [ref=e806]:
            - heading "Extended data" [level=2] [ref=e807]
            - generic [ref=e809]:
              - generic [ref=e810]:
                - heading "Extended Data Fig. 1 Comparison of majority voting and popV prediction score." [level=3] [ref=e811]:
                  - link "Extended Data Fig. 1 Comparison of majority voting and popV prediction score." [ref=e812] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3/figures/4
                - paragraph [ref=e814]:
                  - text: A single cell is annotated by eight different algorithms. OnClass uses a two-step annotation procedure, in which the second can predict cell types that are not part of the reference dataset (here CD4+ CD25
                  - superscript [ref=e815]: +
                  - text: T
                  - subscript [ref=e816]: reg
                  - text: cell). For simple majority voting, we use the prediction of OnClass at step 1, where it is bound to the cell types observed in the reference dataset (OnClass_seen) and count the predictions of each algorithm. For popV scoring, we propagate the prediction of OnClass along the Cell Ontology graph (shortest path to the root node). Every cell along the path from the root term to the predicted term receives a score of 1, and majority voting is performed for these propagated votes. In the case here, using majority voting, we would classify the cell as a CD8
                  - superscript [ref=e817]: +
                  - text: T cell with a score of 4, while using the popV consensus score, we would classify the cell as a CD4
                  - superscript [ref=e818]: +
                  - text: T cell with a score of 4.
              - generic [ref=e819]:
                - heading "Extended Data Fig. 2 scANVI shows the highest integration of query cells, and popV shows low confidence for lowly abundant cell types." [level=3] [ref=e820]:
                  - link "Extended Data Fig. 2 scANVI shows the highest integration of query cells, and popV shows low confidence for lowly abundant cell types." [ref=e821] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3/figures/5
                - paragraph [ref=e823]: a, ScIB metrics comparing integration scores after integrating query and reference dataset showed the best integration using scANVI and improvement over uncorrected data. Labels from the original Lung Cell Atlas paper were used to compute cell type-dependent scores, and scores were computed only on query cells. b, Displayed is the number of each predicted cell type in query cells and the accuracy for each annotated cell type. c, Absolute accuracy corresponds to exact match, while neighbor-only accuracy corresponds to all adjacent cell types (all accuracy terms except no match). Cells that were rarely predicted (smooth muscle cells and blood vessel endothelial cells showed the lowest accuracy). Most cell types have an accuracy greater than 0.9.
              - generic [ref=e824]:
                - heading "Extended Data Fig. 3 Analysis of T cell sub-clustering in Lung Cell Atlas and Tabula Sapiens." [level=3] [ref=e825]:
                  - link "Extended Data Fig. 3 Analysis of T cell sub-clustering in Lung Cell Atlas and Tabula Sapiens." [ref=e826] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3/figures/6
                - paragraph [ref=e828]: a, UMAP of cells from the reference dataset labeled with Tabula Sapiens cell type labels highlights the overlap of these labels in integrated space without a clear distinction between CD4 and CD8 T cells. Differential expression analysis identifies surfactant protein genes as markers for annotated effector T cells, which is likely due to ambient counts and no strong marker gene expression in CD4 T cells. b, UMAP of cells from the query dataset labeled with cell type labels from the Lung Cell Atlas shows a clear distinction between different cell types. Differentially expressed genes for those cell types align well with the respective literature. c, Canonical marker genes for various subtypes show a clear split between T cells and NK cells, as well as CD8 and CD4 T cells. GZMA but not GZMB is also expressed in CD4 T cells.
              - generic [ref=e829]:
                - heading "Extended Data Fig. 4 Comparison of popV against majority voting of multiple SVM classifiers." [level=3] [ref=e830]:
                  - link "Extended Data Fig. 4 Comparison of popV against majority voting of multiple SVM classifiers." [ref=e831] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3/figures/7
                - paragraph [ref=e833]:
                  - text: All plots are displayed for query cells of the lung cell query dataset. We compare popV against majority voting after SVM, for which different kernels (radial basis function, polynomial, linear and sigmoid) and the cost were varied (0.1 and 1.0). a, UMAP-highlighting cells with a consensus score of 4 or less (low consensus). We compare popV here with the majority vote of eight distinct SVM classifiers, which differ in their choice of the kernel and c parameters. b, Accuracy versus consensus score (left) and majority voting score (right) for both consensus algorithms colored by ontology accuracy terms (
                  - link "Methods" [ref=e834] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#Sec7
                  - text: ). c, Hamming distance between the underlying classifiers of popV and SVM majority voting. d, Precision–recall curves for both algorithms. We used all exact match as the label for the metric calculation. In the legend, area under the precision–recall curve is given (AUPRC). In addition, the F1 score at best decision boundary is given, along with the confidence level at the decision boundary as well as the ratio of cells annotated above this threshold. popV shows the higher AUPRC and F1 scores at the decision boundary. e, Focus on T cells and NK cells (circle in a). UMAP of the consensus voting as well as underlying classifiers. Top, PopV classifiers are displayed. The main disagreement is between CD8 and CD4 T cells. Middle, Majority voting after SVM shows disagreement between NK and CD8
                  - superscript [ref=e835]: +
                  - text: T cells. Bottom right, Original annotation of query cells shows agreement for NK cells and no clear separation between different T cell labels.
              - generic [ref=e836]:
                - heading "Extended Data Fig. 5 Calibration of certainty and accuracy for all methods evaluated on all query cells from the thymus." [level=3] [ref=e837]:
                  - link "Extended Data Fig. 5 Calibration of certainty and accuracy for all methods evaluated on all query cells from the thymus." [ref=e838] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3/figures/8
                - paragraph [ref=e840]: Displayed is the accuracy for bins of internal classification certainty. X-axis labels highlight the number of cells in each bin. PopV, OnClass_seen and random forest show the strongest correlation between exact match and certainty. PopV shows the highest number of high-confidence predictions. Several methods show a high number of incorrect results for predictions with confidence above >87.5%. The coloring of the bars is calculated for the prediction of the respective algorithm, standardized to a height of one per confidence level.
              - generic [ref=e841]:
                - heading "Extended Data Fig. 6 Precision–recall curves for all classifiers evaluated on all query cells from the thymus." [level=3] [ref=e842]:
                  - link "Extended Data Fig. 6 Precision–recall curves for all classifiers evaluated on all query cells from the thymus." [ref=e843] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3/figures/9
                - paragraph [ref=e845]: Precision–recall curves are evaluated for all query cells. We used all exact match as the label for the metric calculation. In the legend, area under the precision–recall curve is given (AUPRC). F1 score at best decision boundary is given, along with the confidence level at the decision boundary as well as the ratio of cells annotated above this threshold. PopV shows the highest AUPRC and F1 score at the decision boundary. The decision boundary corresponds to a consensus score of 7 and above.
              - generic [ref=e846]:
                - heading "Extended Data Fig. 7 Predictions of cell-type labels across different technologies." [level=3] [ref=e847]:
