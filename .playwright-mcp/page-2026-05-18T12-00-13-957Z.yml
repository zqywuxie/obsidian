                      - img [ref=e279]
                  - paragraph [ref=e282]:
                    - text: a, UMAP embedding after scANVI integration of TS reference cells, LCA query cells labeled with the ground-truth label and LCA query cells labeled with predicted label. b, Ontology accuracy (
                    - link "Methods" [ref=e283] [cursor=pointer]:
                      - /url: /articles/s41588-024-01993-3#Sec7
                    - text: ) for the various methods computed on the query cells. c, Ontology accuracy for the prediction scores in popV. d, Highlighted cells with a consensus score of 4 or less (low consensus). e, Zoomed-in view of endothelial cells in the LCA with popV-predicted labels and ground-truth labels displayed. The zoomed-in picture is rotated by 90° to allow readability of all labels. Alveolar capillary type 2 endothelial cell is the Cell Ontology term for capillary aerocytes. The LCA annotated additional cell types between capillary aerocytes and capillary endothelial cells. TS, Tabula Sapiens; LCA, Lung Cell Atlas.
              - paragraph [ref=e284]:
                - text: When checking the popV prediction scores, we found that the accuracy of the prediction is highly correlated with the prediction score (Fig.
                - link "2c" [ref=e285] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig2
                - text: ). For scores of 6 and higher, we found that more than 90% of the annotations were exact matches with the ground truth. For scores of 8, which is a perfect agreement between all methods, 98% of the predictions were exact matches. For scores of 3 and lower, the prediction accuracy was lower than 50%, highlighting that the popV consensus score is a valuable metric to reflect the classification accuracy and points to groups of cells that should be further (and manually) scrutinized.
              - paragraph [ref=e286]:
                - text: When considering cells that were assigned with a low consensus score, we found three possible reasons that may explain the disagreement between the different methods (Fig.
                - link "2d" [ref=e287] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig2
                - text: ). The first is that the distinction between certain cell subsets with different labels is unclear. This often arises in cases of a continuum of cell states with no clear decision boundary in transcriptome space. In such cases, the boundaries determined by different algorithms may vary (because they depend on different objectives or techniques), leading to low consistency. It is, however, exactly those cases that merit closer (and often manual) inspection and—if needed—assignment of multiple optional labels. As an example, we found several areas of low consensus score in the various lung endothelial cells (Fig.
                - link "2e" [ref=e288] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig2
                - text: ). Most endothelial cells with a low consensus score arise between capillary endothelial cells and alveolar capillary type 2 endothelial cells. In this region, the various algorithms disagree on the correct boundary, but all algorithms predict those cells with either of those labels. We found that alveolar capillary type 2 endothelial cells express EDNRB and HPGD, and capillary endothelial cells express FCN3 and IL7R. Cells between both cell types are double positive in both markers, while they do not show any specific marker gene. Therefore, we conclude that neither the term capillary endothelial cell nor the term alveolar capillary type 2 endothelial cell is adequate to describe these cells, but their phenotype is between both cell types. Thus, it is a region that requires manual scrutiny to determine the correct label of those cells. In fact, such scrutiny was applied in the original annotation of the Lung Cell Atlas—annotations not provided to popV—which labeled these cells as capillary intermediates 1 and 2. Therefore, this example demonstrates that a low consensus score can help identify areas that require a refined label, possibly extending the vocabulary available in the reference atlas.
              - paragraph [ref=e289]:
                - text: The second reason for a low consensus score in this case study occurs when the query dataset contains subsets of cells that are absent from the reference atlas. As an example, while the Lung Cell Atlas (which we use as the query) includes a subset of endothelial cells that were originally labeled bronchial vessel 2, this subset (and its respective label) seems to be absent from our reference atlas. Indeed, when checking marker genes for these cells, their expression was high in PLVAP and low in the vein endothelial marker ACKR1 (Supplementary Fig.
                - link "4" [ref=e290] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ), which can be interpreted as an intermediate stage between capillary endothelial cells (negative for both markers) and lung microvascular endothelial cells (positive for both markers). This combination of marker gene expression was not observed in Tabula Sapiens and therefore marks a cell type not present in the reference dataset.
              - paragraph [ref=e291]:
                - text: The third possible reason we find for the low consensus is inaccuracy in the reference annotation. As an example, we found a subset of T cells with a low consensus score (Extended Data Fig.
                - link "3" [ref=e292] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig6
                - text: ). All cells of this group in the query dataset were originally labeled (by the authors of the Lung Cell Atlas) as effector CD4
                - superscript [ref=e293]: +
                - text: αβ T cells, while similar cells originating from the Tabula Sapiens reference were labeled as a mixture of CD4 and CD8 T cells. Consequently, most algorithms in popV labeled this low consensus group as a mix of CD4 and CD8 T cells with different decision boundaries. Manually following up on this low-scoring group, we checked the marker gene CD8A and found a clear decision boundary that distinguishes the CD4
                - superscript [ref=e294]: +
                - text: (T
                - subscript [ref=e295]: H
                - text: ) and CD8
                - superscript [ref=e296]: +
                - text: (cytotoxic) subsets in a manner consistent with the (hidden) query annotation. Despite this clear delineation, we found that many CD8
                - superscript [ref=e297]: −
                - text: cells are labeled in the reference atlas as CD8
                - superscript [ref=e298]: +
                - text: T cells. A low consensus score in this group of cells helped to identify wrongly annotated cells in the reference dataset, and we highlight that manual scrutiny can clean up these wrong labels.
              - paragraph [ref=e299]:
                - text: PopV uses a diverse set of underlying classifiers. The heuristic is that including methods with varying bias allows us to detect uncertain predictions. We studied whether distinct classifiers are essential by comparing popV against majority voting between eight different SVM algorithms with different kernels and cost parameters. We find the popV consensus score to better correlate with accuracy than this simplified algorithm (Extended Data Fig.
                - link "4a,b,d" [ref=e300] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig7
                - text: ). Indeed, we find higher diversity in the predicted cell-type labels in the predictors underlying popV and find no pair of predictors with a Hamming similarity above 0.9 (Extended Data Fig.
                - link "4c" [ref=e301] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig7
                - text: ). While popV highlighted problems with annotating different subsets of T cells, majority voting after SVM shows high uncertainty for cells predicted to be natural killer (NK) cells. However, for these cells, we found marker gene expression that aligns with those cells being NK cells highlighting an accurate prediction by popV. Taking together, using a diverse set of algorithms enables popV to highlight cell types with wrongly predicted labels, while a more simplified algorithm using only predictors based on SVM does not provide a calibrated classifier.
              - paragraph [ref=e302]: We have demonstrated here that the consensus score can highlight regions that require manual scrutiny and that reannotation in those regions can be performed using marker gene expression. This leads to new delineation of cell types not discovered in the reference dataset, detection of query-specific cell types and correction of the cell type label of wrongly assigned reference cell type labels.
              - heading "PopV provides useful label transfer in case of drastic differences in cellular composition" [level=3] [ref=e303]
              - paragraph [ref=e304]:
                - text: After highlighting that popV is capable of detecting query-specific cells and that the consensus score is capable of highlighting these cells, we studied whether this can also be achieved when we have very different query and reference datasets. To this end, we studied the annotation of thymus cells using Tabula Sapiens as a reference dataset and a second study, which profiled thymi from different age groups (fetal, childhood, adolescence and adulthood) as query
                - superscript [ref=e305]:
                  - link "Reference 22" [ref=e306] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#ref-CR22
                    - text: "22"
                - text: (Supplementary Fig.
                - link "5" [ref=e307] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). In particular, the thymus undergoes involution with age, and the adult thymus, which we use here as reference, does not accurately represent the structure and function of the thymus in younger individuals. In particular, we anticipate that the reference sample will not provide ample representation of the developing T cell population, which is prevalent in our query data.
              - paragraph [ref=e308]:
                - text: UMAP embedding of the two harmonized datasets clearly highlights the subsets of query cells that are represented in the reference dataset, while as expected by the age of the donors in the Tabula Sapiens project, the compartments of thymocytes and developing T cells are almost absent from the reference dataset (Fig.
                - link "3a" [ref=e309] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig3
                - text: and Supplementary Fig.
                - link "6" [ref=e310] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). Indeed, we find a high consensus score and accuracy in regions well represented in the reference dataset, while the consensus score for query-specific cell types is lower (Fig.
                - link "3b,c" [ref=e311] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig3
                - text: ). We find a high prediction accuracy for query cells from the adult thymus that are similar to the cells from the reference dataset (Fig.
                - link "3d" [ref=e312] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig3
                - text: and Supplementary Fig.
                - link "7" [ref=e313] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). Reassuringly, popV assigned low consensus scores to the majority of cells from compartments that are absent in adult humans, highlighting them for manual annotation (Fig.
                - link "3e" [ref=e314] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig3
                - text: and Extended Data Fig.
                - link "5" [ref=e315] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig8
                - text: ), while for cells isolated from an adult thymus, we overall find very high accuracy across all algorithms and a high consensus score with popV outperforming the single methods in accuracy (Fig.
                - link "3f" [ref=e316] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig3
                - text: and Supplementary Fig.
                - link "8" [ref=e317] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ). We found for the underlying algorithms that their internal certainties do not correlate well with the accuracy and find a lower area under the precision–recall curve for these algorithms compared to popV (Extended Data Fig.
                - link "6" [ref=e318] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#Fig9
                - text: and Supplementary Fig.
                - link "9" [ref=e319] [cursor=pointer]:
                  - /url: /articles/s41588-024-01993-3#MOESM1
                - text: ).
              - 'figure "Fig. 3: PopV identifies thymocytes as query-specific cell types and yields highly interpretable consensus scores." [ref=e321]':
                - generic [ref=e323]: "Fig. 3: PopV identifies thymocytes as query-specific cell types and yields highly interpretable consensus scores."
                - generic [ref=e324]:
                  - generic [ref=e325]:
                    - 'img "Fig. 3: PopV identifies thymocytes as query-specific cell types and yields highly interpretable consensus scores." [ref=e327]'
