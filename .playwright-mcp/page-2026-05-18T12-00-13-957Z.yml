                    - /url: /articles/s41588-024-01993-3/figures/10
                - paragraph [ref=e850]:
                  - text: Confusion matrix of cell-type labels for (a) nucleus as well as (b) Drop-seq query cells using cells sequenced with 10× from Fig.
                  - link "2" [ref=e851] [cursor=pointer]:
                    - /url: /articles/s41588-024-01993-3#Fig2
                  - text: as the reference dataset. Matrix is column normalized on the respective y-axis; the predicted label from popV is given, and on the x-axis, the original label is provided. Displayed is the ratio of predicted cell types with popV for each ground truth cell type.
