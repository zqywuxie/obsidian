                    - link "https://biorender.com/xsxyek1" [ref=e430] [cursor=pointer]:
                      - /url: https://BioRender.com/xsxyek1
                    - text: "(2026). b, LOO TCR cross-validation performance across all TCRs, assessed by PR curves for peptide-binding prediction. c–f, Correlation between PRP divergence (mean JS distance) and various metrics: edit distance (c), TCRdist (d), model AP in held-out prediction (e) and Mahalanobis distance to train (f). For all panels, Spearman ρ and two-sided P values are reported. In f, Mahalanobis distance in the model’s learned embedding space correlates with experimental PRP divergence, providing a quantitative ‘confidence score’ for predictions on new TCRs. TCRs shown in g (135.1, 135.3, 4.1, 26.1 and 4.4) are highlighted in red in c–f. g, Motif prediction performance for five representative held-out TCRs. Top, true peptide-binding motifs. Red stars indicate peptide positions fixed during library construction. Bottom, Δbits (predicted − true) at each peptide position. Mahalanobis distance values used in f are labeled after each TCR name."
              - paragraph [ref=e431]:
                - text: We found that standard TCR sequence similarity metrics (for example, CDR3 edit distance and TCRDist) failed to predict functional divergence (mean JS distance of PRPs to training set) (Fig.
                - link "6c,d" [ref=e432] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig6
                - text: ). Conversely, AUPRC strongly anticorrelated with the actual functional distance (PRP divergence) between the held-out TCR and the training set (Spearman ρ ≈ −0.78, P < 0.001; Fig.
                - link "6e" [ref=e433] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig6
                - text: ). This establishes that relatedness in peptide recognition patterns, not sequence similarity, is the primary determinant of predictive transferability to new TCRs.
              - paragraph [ref=e434]:
                - text: We then asked whether the model itself could provide an intrinsic estimate of its reliability for unseen TCRs. To this end, we used the Mahalanobis distance as a multivariate measure of how far a new TCR lies from the cloud of training TCRs in the learned joint TCR–peptide embedding space. This metric, which we interpret as a model-estimated degree of out-of-distribution behavior, correlated significantly with experimentally measured functional distance (PRP divergence) (Spearman ρ ≈ 0.59, P ≈ 0.02; Fig.
                - link "6f" [ref=e435] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig6
                - text: ). Thus, unlike sequence-based heuristics, our model provides a quantitative, peptide-recognition-aware measure of its own reliability for novel TCRs. This intrinsic uncertainty offers a principled framework to assess prediction reliability and strategically guide experimental profiling of peptide recognition toward functionally distinct TCRs where model confidence is low.
              - paragraph [ref=e436]:
                - text: The utility of this metric is demonstrated by the model’s motif predictions (Fig.
                - link "6g" [ref=e437] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig6
                - text: and Extended Data Fig.
                - link "7" [ref=e438] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig13
                - text: ). For held-out TCRs with high Mahalanobis distance, predicted motifs deviate noticeably from the true motifs, whereas, for TCRs with low Mahalanobis distance, the model generates motifs nearly identical to the true motif. In other words, when the embedding places a new TCR close to familiar training receptors, motif and activation predictions are more accurate. This demonstrates that our model’s confidence score is directly linked to its capacity for biologically meaningful generalization, making it a reliable tool to guide future TCR profiling.
          - generic [ref=e440]:
            - heading "Discussion" [level=2] [ref=e441]
            - generic [ref=e442]:
              - paragraph [ref=e443]: This work presents an integrated experimental–computational platform for profiling and predicting TCR recognition, centered on empirically determined PRPs. By combining high-throughput peptide-MHC yeast display with fine-tuned pLMs, we link sequence to function at high resolution. The resulting PRP data resource and predictive models provide a functionally grounded approach for mapping TCR specificity, discovering disease-associated antigens and defining the principles that govern predictive generalization within a constrained TCR family.
              - paragraph [ref=e444]:
                - text: A cornerstone of our findings is the high-resolution, empirical demonstration that TCRs can be organized into clusters based on their PRPs. While convergent evolution of TCR specificity is a known phenomenon, our platform provides quantitative detail, revealing distinct peptide recognition neighborhoods even among TCRs restricted by a single MHC allele (HLA-B*27:05). Our framework shares conceptual parallels with prior models describing how TCR motifs vary systematically across epitope space
                - superscript [ref=e445]:
                  - link "Reference 29" [ref=e446] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR29
                    - text: "29"
                - text: ", reinforcing the broader machine learning intuition that TCR–peptide relationships can be productively viewed through mapping of recognition landscapes. In parallel, our paired α + β modeling and α-chain swap experiments show that, within this TCR family, CDR3α primarily fine-tunes recognition and modulates response magnitude rather than redefining core peptide specificity, which is dominated by the β-chain. However, these findings should not be interpreted to mean that α-chains are dispensable for TCR specificity more broadly. Our β-chain-based predictions hold only conditional on the presence of a structurally compatible α-chain that permits productive pMHC engagement. Together, these observations provide a framework for extending PRP-based profiling to more diverse α–β combinations in future work. The resulting PRP-defined classification offers a biologically meaningful complement to sequence-based grouping methods such as GLIPH and TCRdist and highlights the value of applying advanced machine learning to dense peptide-binding data to capture the nuanced grammar of TCR–pMHC interactions."
              - paragraph [ref=e447]: Importantly, this framework extends beyond binding to predict functional T cell activation by peptides from the human proteome, even though the models were trained on binding-enriched yeast display data rather than direct functional measurements. We then validated predictions against T cell activation readouts, thereby beginning to bridge the gap between binding and function. In this setting, PRP-informed pLMs demonstrated strong performance in discriminating activating from nonactivating peptides, notably surpassing metrics from existing structural modeling approaches (for example, AlphaFold3 and tFold-TCR’s ipTM) in this specific predictive task. This finding does not diminish the fundamental importance of structure in molecular recognition. Rather, it suggests that our pLMs, by learning from vast peptide-binding datasets, implicitly capture complex features, potentially reflecting subtle energetic contributions, conformational dynamics or kinetic parameters not fully encapsulated by static structural compatibility metrics alone, which are essential determinants of cellular activation thresholds. The successful identification of novel candidate autoantigens for AS, most notably PSG5 expressed in iris tissue, highlights the immediate translational power of this approach for uncovering disease-associated ligands. This specific finding provides a compelling, testable hypothesis for a molecular link between HLA-B*27 and a key extraarticular manifestation of AS.
              - paragraph [ref=e448]: Our study also clarifies how predictions generalize to novel TCRs within this disease-associated restricted system. We find that predictive accuracy is better explained by functional distance (PRP divergence) to the training set rather than by sequence similarity alone. This shifts the emphasis, in this context, from sequence proximity to functional relatedness when assessing where models are likely to perform well. To this end, we introduce a model-intrinsic uncertainty metric, the Mahalanobis distance within the learned TCR–peptide embedding space, as a quantitative, peptide-recognition-aware estimate of prediction reliability for novel TCRs. This metric substantially outperformed sequence similarity in forecasting generalization difficulty (correlation with PRP divergence). It provides a principled strategy to gauge confidence in predictions for unseen receptors, thereby enabling the efficient prioritization of experimental efforts toward TCRs with distinct peptide recognition patterns and informative regions of the vast TCR universe. The ability to further refine predictions through joint modeling within peptide-recognition-defined TCR neighborhoods, as shown with the 19.2 variants, suggests an iterative path toward resolving even fine-specificity differences, guided by this understanding of relatedness in peptide binding.
              - paragraph [ref=e449]:
                - text: Our results should not be interpreted as contradicting sequence-based molecular mimicry at the peptide level, which has been convincingly demonstrated in prior work
                - superscript [ref=e450]:
                  - link "Reference 24" [ref=e451] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR24
                    - text: "24"
                - text: . Instead, they extend this framework by showing that even highly similar TCRs can diverge in their PRPs, underscoring that mimicry and cross-reactivity cannot always be inferred from TCR sequence similarity alone, particularly within dense, disease-associated clonotype families.
              - paragraph [ref=e452]: We also recognize important limitations of our current implementation. This study focuses on a highly related family of HLA-B*27:05-restricted, disease-associated TCRs. While repertoire-scale sequence-based clustering methods such as GLIPH or TCRdist excel at global repertoire organization, they are inherently limited in resolution within dense, high-similarity clonotype families. In this context, PRPs provide fine-grained functional distinctions that sequence alone cannot resolve. Additionally, our β-centric modeling applies specifically to this clonotypically constrained family in which α–β pairing has already been subject to strong biological selection; generalization to diverse α–β pairings will require expanded profiling. From a technical perspective, the yeast display peptide libraries used here incorporated fixed anchor residues (arginine at P2 and proline at P8) to balance diversity with biological relevance and relied on standard stabilizing substitutions in HLA-B27:05 (Y84A, L5M, H114Y, A153D and C67S) to enhance folding and surface display. These design choices improve selection efficiency and data quality but restrict the accessible peptide space and may subtly influence peptide binding and orientation. All candidate antigens identified in this setting were, therefore, validated in the context of WT HLA-B27:05 using independent biochemical, structural and cellular assays.
              - paragraph [ref=e453]: Despite these constraints, the integrated platform presented here represents a generalizable engine for discovery. The principles of defining specificity through deep PRPs and leveraging these data with advanced machine learning can be applied to diverse MHC alleles, to the study of immune repertoires in cancer and infectious disease and to other immune receptor systems. The ability of our models to predict activating peptides while providing an intrinsic confidence score can guide the rational design of TCR-based immunotherapies, helping to engineer receptors with tailored specificities and enhanced safety profiles.
              - paragraph [ref=e454]: In conclusion, we establish a peptide-recognition-centric framework for defining and predicting TCR specificity. This integrated platform and its associated data resources are poised to accelerate our fundamental understanding of adaptive immunity and serve as a resource for the broader immunology and biotechnology communities.
