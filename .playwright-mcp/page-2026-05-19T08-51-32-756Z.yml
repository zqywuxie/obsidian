                    - text: "37"
                - text: . Crystallographic software was installed and maintained by SBGrid
                - superscript [ref=e581]:
                  - link "Reference 38" [ref=e582] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR38
                    - text: "38"
                - text: . Data collection and refinement statistics are provided in Supplementary Table
