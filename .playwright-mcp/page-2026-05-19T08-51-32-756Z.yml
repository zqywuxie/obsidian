              - paragraph [ref=e233]:
                - text: We applied this framework to a panel of 16 HLA-B*27:05-restricted TCRs implicated in AS and AAU, using this defined cohort as a reductionist model system for high-resolution mapping. This approach generated deep peptide recognition datasets, counting specific interactions for thousands of unique peptide ligands (~10
                - superscript [ref=e234]: "9"
                - text: peptides screened per TCR; Fig.
                - link "1a" [ref=e235] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig1
                - text: and Extended Data Fig.
                - link "2" [ref=e236] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig8
                - text: ). These dense, quantitative PRPs provide a detailed view of each TCR’s intrinsic peptide recognition preferences.
              - paragraph [ref=e237]:
                - text: We reasoned that these rich interaction data could enable pLMs to learn generalizable rules of recognition. Accordingly, we developed a computational framework centered on pLMs, fine-tuned on these interaction datasets, to learn the complex sequence-dependent relationships governing TCR–pMHC binding (Fig.
                - link "1b" [ref=e238] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig1
                - text: ). For the HLA-B*27:05 system studied here, we focused the models on the CDR3β loop, which prior structural analyses identified as the dominant mediator of peptide contact in this system
                - superscript [ref=e239]:
                  - link "Reference 24" [ref=e240] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR24
                    - text: "24"
