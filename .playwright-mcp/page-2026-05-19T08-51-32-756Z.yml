                    - text: "28"
                - text: . To test this, we used a rigorous leave-one-out (LOO) TCR cross-validation strategy across our full TCR panel (training on n − 1 TCRs, testing on the held-out TCR; Fig.
                - link "6b" [ref=e410] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig6
                - text: ", Supplementary Fig."
                - link "1c" [ref=e411] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: and
                - link "Methods" [ref=e412] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Sec10
                - text: ).
