              - paragraph [ref=e307]:
                - text: To assess whether incorporating α-chain information could improve performance, we trained paired α + β models and compared them with β-only counterparts across the full TCR panel. Inclusion of α-chain sequences did not significantly enhance predictive accuracy (median AUPRC, 0.85 versus 0.86; P = 0.39, Wilcoxon test; Extended Data Fig.
                - link "5a,b" [ref=e308] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig11
                - text: ), indicating that α-derived features provided minimal additional predictive value in this β-dominated system. Consistent with these computational findings, α-chain swap activation assays showed that substituting α-chains (8.4a, 19.2a and 135.4a, all sharing AJ28) onto a common β-chain (19.2b) led to only minor quantitative differences in CD69 induction, with overall activation patterns closely tracking the β identity (Extended Data Fig.
                - link "5c,d" [ref=e309] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig11
                - text: ). Together, these results confirm that, within this clonotypically constrained HLA-B*27:05-restricted family, conditional on a compatible α-chain, β-chain-encoded determinants are sufficient to capture the dominant features of peptide specificity, while α-chain variation primarily fine-tunes recognition rather than redefining it.
              - paragraph [ref=e310]:
                - text: To probe the models’ learned representations, gradient-based saliency methods identified peptide residues most influential for binding in TCRs 8.4, 19.2 and 4.3 (Fig.
                - link "3c" [ref=e311] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig3
                - text: ). Similarly, the shuffling of amino acids at each position confirmed the critical hotspots necessary for accurate binding prediction (Supplementary Fig.
                - link "2" [ref=e312] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ). These in silico interaction hotspots faithfully recapitulated experimentally derived binding motifs and aligned with known structurally important contact residues (for example, P4, P5 and P8) across a range of different TCRs. This alignment with experimental data demonstrates that the pLMs accurately infer key determinants of TCR–pMHC interactions, including the influence of sequence position and amino acid variation on binding specificity.
              - paragraph [ref=e313]:
                - text: To assess whether our models could generalize beyond the random synthetic peptide library and identify potential autoantigens in AS and AAU, we predicted the binding of >200,000 HLA-B*27:05-restricted 9-mer peptides from the human proteome (Fig.
                - link "3d" [ref=e314] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig3
                - text: and
                - link "Methods" [ref=e315] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Sec10
                - text: ). Our PRP-informed pLMs estimated peptide-binding probabilities for each TCR in the panel, identifying a subset of human peptides predicted to be highly cross-reactive, eliciting strong binding predictions for multiple TCRs. Ranking peptides by predicted cross-reactivity (Fig.
                - link "3e" [ref=e316] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig3
                - text: ) revealed 15 candidates with considerable sequence diversity predicted to bind >33% of the TCRs. These findings indicate that our PRP-informed pLMs can identify potential immunodominant autoantigens and predict self-antigen cross-reactivity with the human proteome, warranting direct experimental validation of their capacity to induce T cell activation.
              - heading "PRP-informed models predict T cell activation by human proteome peptides" [level=3] [ref=e317]
              - paragraph [ref=e318]:
                - text: While binding is a prerequisite, T cell activation is the physiologically critical readout for TCR–pMHC interactions. Therefore, we tested whether our pLM binding predictions could identify activating human peptides. Using the top 15 cross-reactive human peptides predicted by our models, we performed T cell activation assays (CD69 upregulation) with TCR-transduced SKW-3 cells (Fig.
                - link "4a" [ref=e319] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig4
                - text: ", Supplementary Fig."
                - link "3" [ref=e320] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: and Supplementary Table
                - link "1" [ref=e321] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ). Notably, despite being trained solely on peptide-binding data (the PRPs), our pLMs effectively discriminated between activating and nonactivating peptides (Fig.
                - link "4b,c" [ref=e322] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig4
                - text: and Supplementary Fig.
                - link "4" [ref=e323] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ). Our PRP-informed models significantly outperformed existing structural modeling metrics (that is, AlphaFold3 and tFold-TCR ipTM) in predicting activation (Fig.
                - link "4d" [ref=e324] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig4
                - text: and Supplementary Fig.
                - link "5" [ref=e325] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ; AUROC P = 0.029, AUPRC P = 0.005, Wilcoxon signed-rank test). We posit that pLMs (and likely other sequence-based methods) that leverage PRPs may implicitly capture context-dependent patterns, including peptide conformational dynamics, which are often lost in static structural predictions, providing a more nuanced understanding of peptide binding and TCR engagement.
