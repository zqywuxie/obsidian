                - text: .
              - paragraph [ref=e371]:
                - text: A crystal structure of the PSG5–HLA-B27:05–TCR 19.2 complex (Fig.
                - link "4g" [ref=e372] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig4
                - text: and Supplementary Fig.
                - link "8" [ref=e373] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ) revealed that PSG5 and YEIH peptides engage the TCR using highly similar binding patterns, with conserved docking geometry and contact residues. This structural similarity aligns with our machine learning models, which identified PSG5 as a highly cross-reactive peptide capable of activating multiple disease-associated TCRs.
              - heading "Predictive generalization within a TCR neighborhood is enhanced by joint modeling" [level=3] [ref=e374]
              - paragraph [ref=e375]: The identification of compelling candidate autoantigens such as PSG5, predicted by individual models trained on broad PRPs, and their recognition by multiple TCRs suggests that these TCRs may leverage shared or similar underlying principles for peptide interaction, which our models implicitly capture. To further understand the robustness of these predictions and delineate how our models might generalize TCR specificity, we next sought to systematically investigate the impact of TCR sequence variation on peptide recognition and model performance.
              - paragraph [ref=e376]:
                - text: To dissect how TCR β-chain diversity influences knowledge transfer to new TCRs, we first constructed a ‘TCR neighborhood’ by engineering the 19.2 TCR with 1–3 amino acid substitutions in its CDR3β region, while maintaining the original α-chain (Supplementary Fig.
                - link "9" [ref=e377] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ). Peptide-binding profiling revealed that these engineered TCRs exhibited highly similar binding specificities, confirming their status as a functional neighborhood (Fig.
                - link "5a" [ref=e378] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig5
                - text: ). Consequently, a pLM trained solely on wild-type (WT) 19.2 PRP data generalized effectively to the individual 19.2 mutants, with performance metrics for binding prediction differing by ~0.05 on average (AUPRC) when evaluated on their respective recognized peptides (Fig.
                - link "5b" [ref=e379] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig5
                - text: and Supplementary Fig.
                - link "1b" [ref=e380] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ). This generalizability indicates that these related TCRs indeed share core interaction principles.
