                    - text: "36"
                - text: . Simulated annealing omit electron density maps are presented in Supplementary Fig.
                - link "8" [ref=e578] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: . Structural analyses were carried out with programs from the CCP4 package (version 7.0)
                - superscript [ref=e579]:
