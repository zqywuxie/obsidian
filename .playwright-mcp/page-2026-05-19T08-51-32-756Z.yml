                - superscript [ref=e364]: +
                - text: healthy controls (Fig.
                - link "4f" [ref=e365] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig4
                - text: ). As an internal control, SRY (HLA-B27-restricted flu peptide) tetramer staining revealed no significant difference in flu-specific CD8
                - superscript [ref=e366]: +
                - text: T cell frequencies between individuals with HLA-B27
                - superscript [ref=e367]: +
                - text: axSpA/AAU and controls, supporting the disease specificity of the PSG5 response. Furthermore, no sex-based differences were observed in PSG5-specific T cell frequencies, excluding the possibility that the response simply reflects physiological PSG5 exposure in female individuals (Extended Data Fig.
                - link "6" [ref=e368] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig12
                - text: )
