              - paragraph [ref=e552]:
                - text: The HLA-B*27:05 heavy chain and human β2m were expressed in E. coli as inclusion bodies. The respective genes were cloned into the pET26b vector and transformed into E. coli BL21(DE3) competent cells. A single colony was picked and cultured overnight in 10 ml of LB medium supplemented with 50 µg ml
                - superscript [ref=e553]: −1
                - text: kanamycin at 37 °C with shaking at 250 rpm for 12–16 h. The overnight culture was then inoculated into 1 L of LB medium containing 50 µg ml
                - superscript [ref=e554]: −1
                - text: kanamycin and incubated at 37 °C, 300 rpm until the optical density at 600 nm (OD
                - subscript [ref=e555]: "600"
                - text: ) reached 0.5–0.7.
              - paragraph [ref=e556]:
                - text: Protein expression was induced by adding IPTG to a final concentration of 1 mM, followed by continued shaking at 37 °C for an additional 3 h. Bacterial cultures were harvested by centrifugation at 6,000g for 15 min at 4 °C. Pelleted cells were resuspended in 50 ml of lysis buffer (50 mM Tris-HCl pH 8.0, 100 mM NaCl, 10 mM DTT, 1% Triton X-100, 5 mM MgCl
                - subscript [ref=e557]: "2"
                - text: and 0.2 mM PMSF) and lysed by sonication using a 2 min on–off cycle, repeated three times.
              - paragraph [ref=e558]: The lysate was centrifuged at 10,000g for 15 min at 4 °C. Subsequently, the pellet was resuspended in 50 ml of wash buffer (50 mM Tris-HCl pH 8.0, 100 mM NaCl, 0.5% Triton X-100, 1 mM EDTA, 1 mM DTT and 0.2 mM PMSF) and subjected to the same sonication cycle (2 min on, 2 min off, repeated four times), followed by centrifugation at 10,000g for 15 min. This wash step was repeated once more with wash buffer.
              - paragraph [ref=e559]: The inclusion body pellet was solubilized in 25 ml of solubilization buffer containing 8 M urea, 20 mM Tris-HCl pH 8.0, 0.5 mM EDTA and 1 mM DTT. Insoluble debris was removed by centrifugation at 60,000g for 30 min at 4 °C and the clarified supernatant was collected. Solubilized protein was aliquoted and stored at −80 °C until use in refolding experiments.
              - heading "Refolding of pMHC" [level=3] [ref=e560]
              - paragraph [ref=e561]: The refolding buffer was prepared with 100 mM Tris-HCl pH 8.0, 400 mM arginine, 0.5 mM oxidized glutathione, 5 mM reduced glutathione and 2 mM EDTA. Peptide (20 mg) was dissolved in DMSO and added to 1 L of refolding buffer.
              - paragraph [ref=e562]: For each liter of refolding buffer, 20 mg of HLA-B*27:05 heavy chain inclusion body and 20 mg of human β2m inclusion body were premixed and added dropwise into the refolding buffer under gentle stirring. The refolding mixture was transferred into dialysis tubing (Spectrum Labs) and dialyzed against 10 L of 20 mM Tris-HCl pH 8.0, with buffer changes every 12 h for a total of four exchanges.
              - paragraph [ref=e563]: Following dialysis, refolded pMHC complexes were filtered through a 0.22-µm membrane, concentrated to ~1 ml and subjected to ion-exchange chromatography using a Mono Q column (GE Healthcare). Final quality assessment was performed by size-exclusion chromatography on a Superdex 200 Increase column (GE Healthcare) using an ÄKTA purifier system.
              - heading "Crystallization of AS TCR–pHLA-B*27:05 complexes" [level=3] [ref=e564]
              - paragraph [ref=e565]:
                - text: AS TCRs expressed in GnTI
                - superscript [ref=e566]: −
                - text: "Expi293 cells (Thermo Fisher, A39240) were treated with Endo H, 3C protease and carboxypeptidases A and B at 4 °C for 24 h to remove N-linked glycans and C-terminal leucine zipper tags. The reaction mixture of TCR and refolded pMHC was subsequently purified by size-exclusion chromatography using a Superdex 200 column (GE Healthcare). Protein complexes were crystallized by sitting-drop vapor diffusion: AS19.2–YEIH–HLA-B*27:05 was at 10 mg ml"
                - superscript [ref=e567]: −1
                - text: using 0.2 M sodium malonate pH 6.4, 17% PEG 3350 and AS19.2–PSG5–HLA-B*27:05 at 17 mg ml
                - superscript [ref=e568]: −1
                - text: with 0.2 M sodium formate and 20% PEG 3350. Crystals were cryoprotected with addition of 30% glycerol and flash-cooled in liquid nitrogen for data collection.
              - heading "Structure determination and refinement" [level=3] [ref=e569]
              - paragraph [ref=e570]:
                - text: Diffraction data were collected at Stanford Synchrotron Radiation Lightsource (SSRL) beamline 12-2. Intensities were processed using XDS
                - superscript [ref=e571]:
                  - link "Reference 34" [ref=e572] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR34
                    - text: "34"
                - text: . The YEIH structure was determined by molecular replacement using the PHASER (version 2.5.5) program with components of PDB
                - link "7N2R" [ref=e573] [cursor=pointer]:
                  - /url: https://doi.org/10.2210/pdb7N2R/pdb
                - text: as the search models and the PSG5 structure used the rebuilt TCR 19.2 chains from the YEIH structure with HLA chains from PDB
                - link "7N2R" [ref=e574] [cursor=pointer]:
                  - /url: https://doi.org/10.2210/pdb7N2R/pdb
                - text: . Model building was performed manually in Coot (version 0.9.6), and structure refinement was conducted using the PHENIX (version 2.5.5) software suite
                - superscript [ref=e575]:
                  - link "Reference 35" [ref=e576] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR35
                    - text: "35"
                  - text: ","
                  - link "Reference 36" [ref=e577] [cursor=pointer]:
