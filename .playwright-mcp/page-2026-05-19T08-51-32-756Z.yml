                    - /url: /articles/s41587-026-03128-x#ref-CR24
                    - text: "24"
                - text: . In all complexes, the CDR3β loop arches over the center of the HLA-B27:05-bound peptide and accounts for most peptide backbone and side-chain contacts, whereas CDR3α is positioned more peripherally. CDR1α does contact the peptide but adopts a highly conserved configuration across TCRs (Fig.
                - link "2b" [ref=e275] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig2
                - text: ). In this architecture, variability in CDR3α is, therefore, most consistent with neutral drift around a fixed germline scaffold, while sequence differences in CDR3β are directly translated into altered peptide contacts. This β-dominated binding geometry provides the mechanistic rationale for focusing our modeling on CDR3β in this disease-linked TCR family.
              - paragraph [ref=e276]:
                - text: Analysis of the experimental binding landscapes for this panel revealed substantial differences in the breadth of peptide recognition, with the number of unique peptide ligands identified per TCR ranging from hundreds to over 6,000 (Fig.
                - link "2c" [ref=e277] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig2
                - text: ). To systematically compare TCRs on the basis of their recognition patterns, we calculated the pairwise Jensen–Shannon (JS) divergence between the peptide enrichment probability distributions derived from the yeast display data (Extended Data Fig.
                - link "3a" [ref=e278] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig9
                - text: ). This functional distance metric (reflecting PRP divergence) revealed distinct clusters of TCRs sharing similar ligand preferences. Indeed, this clustering based on peptide recognition was largely independent of sequence similarity, as measured by CDR3β edit distance (Extended Data Fig.
                - link "3b" [ref=e279] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig9
                - text: ).
              - paragraph [ref=e280]:
                - text: Visualization using multidimensional scaling (MDS) projected the TCRs into a peptide recognition space where proximity directly reflects shared peptide specificity, clearly delineating these recognition-based clusters and outliers (Fig.
                - link "2d" [ref=e281] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig2
                - text: ", left). For instance, TCRs 135.1, 135.3 and 135.8 formed a tight peptide recognition cluster despite sequence differences, while sequence-similar TCRs sometimes exhibited disparate binding profiles. Correspondingly, sequence logo analysis of enriched peptides for each TCR identified distinct binding motifs (Extended Data Fig."
                - link "2" [ref=e282] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig8
                - text: ). While some TCRs shared related motifs (for example, 28.1 and 135.4 both strongly favoring a central MLL motif at positions 4–6), others displayed unique preferences (for example, 9.1 with a unique preference for arginine at P6), consistent with their positions in the MDS map of peptide recognition space (Fig.
                - link "2d" [ref=e283] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig2
                - text: ", right). Across dimensionality reduction methods (uniform manifold approximation and projection (UMAP), t-distributed stochastic neighbor embedding (t-SNE) and principal component analysis (PCA)), the same subsets of TCRs consistently clustered together, mirroring their JS distance relationships and underscoring the robustness of the recognition space representation (Extended Data Fig."
                - link "3c,d" [ref=e284] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig9
                - text: ). These results empirically demonstrate that comprehensive PRPs provide a more robust and biologically relevant measure of TCR relatedness than CDR3β sequence similarity alone, directly revealing convergent recognition patterns among sequence-dissimilar receptors.
              - heading "PRP-informed pLM accurately predict peptide-binding specificity" [level=3] [ref=e285]
              - paragraph [ref=e286]:
                - text: To translate the rich PRP datasets into a predictive tool, we fine-tuned pLMs for each TCR to learn its specific sequence–function map (Fig.
                - link "3a" [ref=e287] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig3
                - text: ). These models accurately discriminated binding from nonbinding peptides in held-out test sets from the yeast display experiments, achieving high performance across the diverse TCR panel (area under the receiver operating characteristic curve (AUROC) > 0.95, area under the precision–recall curve (AUPRC) > 0.66; Fig.
                - link "3b" [ref=e288] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig3
                - text: and Supplementary Fig.
                - link "1a" [ref=e289] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ). This confirms that fine-tuned pLMs effectively capture the complex specificity rules encoded within the PRPs (Extended Data Fig.
                - link "4" [ref=e290] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig10
                - text: ).
