                  - paragraph [ref=e427]:
                    - text: a, Conceptual schematic of TCR and peptide recognition space. Screened TCRs occupy a defined region of this space, while new TCRs may lie nearby or further away. Functional distance is defined by divergence in predicted PRPs. Mahalanobis distance provides a model-intrinsic estimate of how far a new TCR lies from the training distribution (‘out-of-distribution’ status). Representative PRPs are shown for screened and nearby TCRs from this study and for a functionally distant TCR based on previously published peptide recognition data
                    - superscript [ref=e428]:
                      - link "Reference 26" [ref=e429] [cursor=pointer]:
