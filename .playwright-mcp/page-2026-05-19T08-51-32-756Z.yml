                - text: for PSG5.
              - heading "Motif analysis and sequence logos" [level=3] [ref=e588]
              - paragraph [ref=e589]:
                - text: Positive binder peptides for each TCR were used to generate motif using MoDec (version 1.2)
                - superscript [ref=e590]:
                  - link "Reference 39" [ref=e591] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR39
                    - text: "39"
                - text: where the best motif was selected across five runs allowing for a single motif with the background amino acid frequencies drawn from the human proteome.
              - paragraph [ref=e592]: JS distances were calculated using Scipy (scipy.spatial.distance.jensenshannon) by taking the sum of the distances for all putative TCR contact residues (positions 0, 2, 3, 5 and 6). MDS was then performed using sklearn (sklearn.manifold.MDS) with n_components = 2 using the computed JS distances.
              - heading "Machine learning architecture" [level=3] [ref=e593]
              - paragraph [ref=e594]: Our model architecture is centered on a single pretrained encoder ESM2 (650-million-parameter model), to encode and extract representations for both the CDR3 α/β and antigen peptide sequence to obtain sequence-wise representations. Each sequence was independently embedded using mean-pooled position-wise representations. Additionally, the position-wise embeddings concatenated with one-hot encoded sequence was further processed and passed through a six-layer transformer encoder. The output of the transformer encoder and mean-pooled position-wise representations were concatenated to form the final embeddings for each peptide and CDR3 α/β. For our β-chain models, a joint representation was then computed as the outer product between the CDR3 and peptide for the sequence-wise embeddings and position-wise representations (two channels). For our α/β-chain models, the outer product was computed for each CDR3 and peptide and concatenated in the channel dimension (four channels). Joint embeddings were then processed through a three-layer convolutional neural network, followed by a single-layer multilayer perceptron to predict binding probability. Binary cross-entropy loss was used for optimization. All model parameters, including the ESM2 encoder, were fine-tuned during training.
              - heading "Pretraining on VDJdb" [level=3] [ref=e595]
              - paragraph [ref=e596]:
                - text: "Before training on deep sequencing data, we pretrained the model on VDJdb. We extracted CDR3α/β–peptide pairs belonging to MHC class I. We used the cognate pairs provided as positives. Negative pairs were generated by uniformly sampling noncognate peptides from the VDJdb pool each epoch. An equal number of positive and negative examples were sampled each epoch. The data were split into training (95%) and validation (5%) sets. The model was trained using the Adam optimizer (learning rate: 1 × 10"
                - superscript [ref=e597]: −6
                - text: ) until convergence, with early stopping based on a validation patience of ten epochs.
              - heading "Training single-TCR models" [level=3] [ref=e598]
              - paragraph [ref=e599]: Fine-tuning was performed on each binarized TCR dataset using the pretrained VDJdb model. Each dataset was split into training (70%), validation (15%) and test (15%) sets. Training used the same hyperparameters as during pretraining. To address class imbalance, where negative samples greatly outnumber positives, we applied a weighted binary cross-entropy loss, with class weights set inversely proportional to the number of positive and negative examples in the training set. This ensured that each class contributed equally. Performance was evaluated on the held-out test set using the average precision (AP) and AUROC. For TCR 19.2, we additionally evaluated the model on its five mutant variants (C1–C5) to assess generalization to mutant CDR3β variants.
              - heading "Training joint and LOO TCR models" [level=3] [ref=e600]
              - paragraph [ref=e601]:
                - text: We fine-tuned the VDJdb-pretrained model on a concatenated dataset comprising all 16 individual TCR datasets. The same 70:15:15 train–validation–test split was used to enable fair comparison to individual TCR models. For the joint 19.2 model (Fig.
                - link "5d" [ref=e602] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig5
                - text: ), we combined the WT and five mutant (C1–C5) datasets in training. To assess generalizability, we trained 16 LOO models, each using data from 15 TCRs and evaluating on the held-out TCR. As TCRs 28.1 and 135.7 share the same CDR3β, both were excluded whenever either was held out to prevent data leakage. Consequently, although 16 LOO models were trained, only 15 were unique. Training hyperparameters were identical to those used in prior experiments.
              - heading "Generating human proteome 9-mer peptide library and nominating peptides for activation study" [level=3] [ref=e603]
              - paragraph [ref=e604]:
                - text: We used NetMHCpan-4.1 and the UniProt human reference proteome (
                - link "UP000005640" [ref=e605] [cursor=pointer]:
                  - /url: https://www.uniprot.org/proteomes/UP000005640
                - text: ) to predict all 9-mer peptides with HLA-B*27:05-binding potential. Peptides with percentage rank < 2 (weak binders) and percentage rank < 0.5 (strong binders) were subselected, yielding 293,467 unique peptides. On the basis of prior knowledge that the tested TCRs exhibit a strong preference for proline at P8 of the peptide, we further filtered the dataset to include only peptides containing proline at P8, yielding 12,357 unique peptides. To nominate peptides for functional testing, we applied each single-TCR model to score this peptide library. For each TCR, peptides with predicted binding scores > 0.95 were selected. We then subselected peptides predicted to bind at least five TCRs. Ranking each of the subselected peptides by the number of TCRs predicted to bind, the top 15 peptides were selected. The maximum number of TCRs that a single peptide was predicted to bind was 12. For model performance evaluation and benchmarking against other models (AUROC and AP), we excluded TCRs 4.1, 4.4 and 135.7, as none of the selected peptides activated these TCRs. To benchmark against peptide to MHC affinity-based prediction, we selected the top 20 peptides from the human proteome with the highest predicted affinity for HLA-B*27:05 using NetMHCpan-4.1. These peptides were experimentally tested for T cell activation to serve as high-affinity nonactivating controls.
              - heading "Calculating TCR distances" [level=3] [ref=e606]
              - paragraph [ref=e607]:
                - text: To assess relatedness between TCRs and TCR neighborhoods in the LOO setting, we computed several distance metrics. The JS distance was computed position-wise between amino acid distributions derived from peptide enrichment profiles obtained through yeast-display screening and averaged across non-excluded peptide positions. For each included position i, amino acid distributions p
                - subscript [ref=e608]: i
                - text: and q
                - subscript [ref=e609]: i
                - text: ", representing the peptide-binding motifs of two TCRs being compared, were compared using the following definitions:"
              - generic [ref=e611]: "$$\\begin{array}{rcl}d_{\\mathrm{JS}}\\left(p,q\\right)&=&\\frac{1}{\\left|I\\right|}\\mathop{\\sum }\\limits_{i\\in I}\\sqrt{\\frac{D_{\\mathrm{KL}}\\left(p_i\\parallel m_i\\right)+D_{\\mathrm{KL}}\\left(q_i\\parallel m_i\\right)}{2}},\\quad m_i=\\frac{1}{2}\\left(p_i+q_i\\right),\\\\ D_{\\mathrm{KL}}\\left(p_i\\parallel m_i\\right)&=&\\mathop{\\sum }\\limits_{a\\in\\mathcal{A}}p_i\\left(a\\right)\\log\\frac{p_i\\left(a\\right)}{m_i\\left(a\\right)},\\quad I=\\left\\{1,\\ldots,L\\right\\}\\setminus\\left\\{2,8,9\\right\\}\\end{array}$$"
              - paragraph [ref=e612]:
                - text: Here, D
                - subscript [ref=e613]: KL
                - text: "denotes the Kullback-Leibler divergence, \\(\\mathcal{A}\\) denotes the amino acid alphabet and I denotes the set of included peptide positions. Positions P2, P8 and P9 were excluded from distance calculations because P2 corresponds to a canonical MHC anchor position, while P8 and P9 were fixed in subsets of peptide libraries during library construction, resulting in limited amino acid variability at those positions among positive binders. This motif-based JS distance was used as the ground-truth measure of similarity between TCRs. Edit distance was computed using CDR3β amino acid sequences only. TCRdist3 was computed using TCRβ-chain information only, including the CDR3β sequence together with the corresponding V- and J-gene annotations, to ensure a fair comparison with our TCRβ-centric model. Mahalanobis distance was calculated as"
              - generic [ref=e615]: "$$d_{\\mathrm{Mah}}\\left(x,\\mu\\right)=\\sqrt{\\left(x-\\mu\\right)^T S^{-1}\\left(x-\\mu\\right)}$$"
              - paragraph [ref=e616]:
                - text: where x denotes the sequence-level representations of the held-out CDR3β sequence after the ESM module, μ denotes the mean vector of training-set sequence-level representations after the ESM module and S
                - superscript [ref=e617]: −1
                - text: denotes the Moore-Penrose pseudoinverse covariance matrix computed from the training-set sequence-level representations.
              - paragraph [ref=e618]: Because TCRs 28.1 and 135.7 share identical CDR3β sequences, each TCR was excluded from the other’s distance calculations to maintain consistency with the LOO training procedure.
              - heading "AlphaFold3 and tFold-TCR predictions" [level=3] [ref=e619]
              - paragraph [ref=e620]: To benchmark against existing complex structure-prediction algorithms, we evaluated both AlphaFold3 (a general multimolecular structure predictor) and tFold-TCR (an algorithm specifically trained for TCR–pMHC complex modeling). For each peptide in our activation study, we supplied the full sequences for each component of the TCR–pMHC complex as input to each method using default inference settings. Both AlphaFold3 and tFold generate interface confidence metrics intended to reflect the reliability of predicted intermolecular contacts. We extracted the ipTM score from each model and used this score as the structure-based predictor of TCR activation.
              - heading "Reporting summary" [level=3] [ref=e621]
