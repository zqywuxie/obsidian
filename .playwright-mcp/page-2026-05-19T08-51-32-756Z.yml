            - heading "Main" [level=2] [ref=e165]
            - generic [ref=e166]:
              - paragraph [ref=e167]:
                - text: T cell receptors (TCRs) recognize a composite surface composed of antigenic peptide and major histocompatibility complex (pMHC) molecules
                - superscript [ref=e168]:
                  - link "Reference 1" [ref=e169] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR1
                    - text: "1"
                - text: . Interrogation of pMHC complexes by the TCR underpins adaptive immunity, orchestrating responses to pathogens, cancer and autoimmunity
                - superscript [ref=e170]:
                  - link "Reference 2" [ref=e171] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR2
                    - text: "2"
                  - text: ","
                  - link "Reference 3" [ref=e172] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR3
                    - text: "3"
                - text: . However, the structural complexity of the TCR–pMHC interface presents both challenges and opportunities for biotechnological intervention
                - superscript [ref=e173]:
                  - link "Reference 4" [ref=e174] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR4
                    - text: "4"
                - text: . A fundamental paradox of TCR recognition is that TCRs with little to no sequence similarity can bind the same pMHC, while nearly identical TCRs can exhibit distinct specificities
                - superscript [ref=e175]:
                  - link "Reference 5" [ref=e176] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR5
                    - text: "5"
                  - text: ","
                  - link "Reference 6" [ref=e177] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR6
                    - text: "6"
                - text: . Consequently, sequence-based clustering methods such as GLIPH and TCRdist capture broad statistical trends in epitope specificity
                - superscript [ref=e178]:
                  - link "Reference 5" [ref=e179] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR5
                    - text: "5"
                  - text: ","
                  - link "Reference 7" [ref=e180] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR7
                    - text: "7"
                - text: . However, they are limited in resolving fine-grained specificity among closely related TCRs.
              - paragraph [ref=e181]:
                - text: Current approaches to bridge this sequence–function gap face notable limitations
                - superscript [ref=e182]:
                  - link "8" [ref=e183] [cursor=pointer]:
                    - /url: "#ref-CR8"
                  - text: ","
                  - link "9" [ref=e184] [cursor=pointer]:
                    - /url: "#ref-CR9"
                  - text: ","
                  - link "Reference 10" [ref=e185] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR10
                    - text: "10"
                - text: . While high-throughput experimental techniques such as yeast or mammalian display can map peptide interactions at scale, leveraging these large datasets effectively to build predictive models remains challenging
                - superscript [ref=e186]:
                  - link "11" [ref=e187] [cursor=pointer]:
                    - /url: "#ref-CR11"
                  - text: ","
                  - link "12" [ref=e188] [cursor=pointer]:
                    - /url: "#ref-CR12"
                  - text: ","
                  - link "13" [ref=e189] [cursor=pointer]:
                    - /url: "#ref-CR13"
                  - text: ","
                  - link "14" [ref=e190] [cursor=pointer]:
                    - /url: "#ref-CR14"
                  - text: ","
                  - link "15" [ref=e191] [cursor=pointer]:
                    - /url: "#ref-CR15"
                  - text: ","
                  - link "Reference 16" [ref=e192] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR16
                    - text: "16"
                - text: . For example, computational approaches, whether based on TCR sequence similarity heuristics or structural modeling as exemplified by AlphaFold3 (ref.
                - superscript [ref=e193]:
                  - link "Reference 17" [ref=e194] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR17
                    - text: "17"
                - text: ), a general structure-prediction model, and tFold-TCR
                - superscript [ref=e195]:
                  - link "Reference 18" [ref=e196] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR18
                    - text: "18"
                - text: ", a specific TCR–pMHC structure-prediction model, both of which use the interface predicted template modeling score (ipTM) to rank interactions, often struggle to reliably predict de novo TCR binding with high accuracy, particularly when confronted with unseen epitopes and diverse TCR backgrounds"
                - superscript [ref=e197]:
                  - link "19" [ref=e198] [cursor=pointer]:
                    - /url: "#ref-CR19"
                  - text: ","
                  - link "20" [ref=e199] [cursor=pointer]:
                    - /url: "#ref-CR20"
                  - text: ","
                  - link "21" [ref=e200] [cursor=pointer]:
                    - /url: "#ref-CR21"
                  - text: ","
                  - link "22" [ref=e201] [cursor=pointer]:
                    - /url: "#ref-CR22"
                  - text: ","
                  - link "Reference 23" [ref=e202] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR23
                    - text: "23"
                - text: . Furthermore, synthetic peptide libraries used in display platforms frequently lack direct relevance to the native proteome of interest. This predictive shortfall hinders progress in critical areas, such as the efficient identification of elusive autoantigens driving HLA-associated autoimmune diseases, such as ankylosing spondylitis (AS) and acute anterior uveitis (AAU), two overlapping syndromes linked to HLA-B*27.
              - paragraph [ref=e203]:
                - text: Here, we address these challenges with an integrated experimental–computational platform that generates deep peptide recognition profiles (PRPs) for TCRs whose recognition of pMHC has been visualized at high resolution. Our approach couples high-throughput yeast display, screening individual TCRs against millions of peptides, with protein language models (pLMs) fine-tuned on the resulting empirical binding data. The extreme focus of CDR3β on peptide recognition in this TCR family
                - superscript [ref=e204]:
                  - link "Reference 24" [ref=e205] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR24
                    - text: "24"
                - text: ", as determined from high resolution crystal structures, enables us to map and rationalize structure–activity relationships with an unusual degree of granularity. This PRP data resource reveals that disease-associated TCRs cluster by shared ligand recognition, complementing but extending beyond sequence-based grouping approaches. Critically, pLMs trained on these PRPs predict functional T cell activation with much greater accuracy than existing structural modeling approaches. This predictive power directly enabled the identification of novel candidate autoantigens for AS and AAU, including a peptide derived from PSG5, which we validated in individual-specific T cells. Lastly, we establish the principles governing model generalization, demonstrating that predictive accuracy for a new TCR is determined by its functional distance, not sequence similarity, to the training set and we introduce a model-intrinsic metric to quantify this confidence."
              - paragraph [ref=e206]: Together, this work highlights how integrating deep profiling with machine learning can ‘zoom in’ on narrow, disease-associated TCR families, revealing specificity rules not accessible by sequence-based methods alone. This platform and its associated resources provide a complementary path toward antigen discovery, deepen our understanding of immune specificity and guide the development of next-generation engineered immunotherapies.
          - generic [ref=e208]:
            - heading "Results" [level=2] [ref=e209]
            - generic [ref=e210]:
              - heading "An integrated platform maps TCR–peptide recognition landscapes" [level=3] [ref=e211]
              - paragraph [ref=e212]:
                - text: To resolve the complex relationship between TCR sequence and peptide antigen specificity, we developed an integrated experimental–computational platform that empirically maps the peptide recognition landscape of individual TCRs (Fig.
                - link "1" [ref=e213] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig1
                - text: ). The experimental framework uses high-throughput yeast surface display coupled with next-generation deep sequencing to quantitatively measure the binding interactions between a specific TCR and vast, randomized peptide libraries presented on the MHC (Extended Data Fig.
                - link "1" [ref=e214] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig7
                - text: ). To generate high-resolution data for machine learning, we designed the peptide libraries to maximize informative diversity within the canonical binding space of our target system, HLA-B*27:05. Building on prior observations that disease-associated TCRs strictly prefer proline at position 8 (P8), we fixed the anchor residues (arginine at P2, proline at P8) while leaving the central positions and P9 unconstrained. This design trade-off ensured library stability and deep coverage of the variable contact residues most critical for fine specificity.
