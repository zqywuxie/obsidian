              - paragraph [ref=e351]:
                - text: Across multiple TCRs, predicted binding scores correlated significantly with experimental T cell activation (Fig.
                - link "4c" [ref=e352] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig4
                - text: and Supplementary Fig.
                - link "6" [ref=e353] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ; Spearman ρ > 0.5, P < 0.05), including several novel candidate autoantigens. Notably, several peptides elicited stronger activation than a known HLA-B*27:05-restricted bacterial epitope (YEIH). A small subset of peptides, such as those derived from pregnancy-specific glycoprotein 5 (PSG5) and pre-mRNA processing factor 3 (PRPF3), activated the majority of tested TCRs (Fig.
                - link "4b" [ref=e354] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig4
                - text: ), supporting the hypothesis of immunodominant, highly cross-reactive autoantigens in AS and AAU.
              - paragraph [ref=e355]:
                - text: To further assess physiological relevance, we benchmarked our models against an independent set of human peptides selected solely on the basis of predicted HLA-B*27:05 binding. Specifically, we selected the top 20 strongest HLA-B*27:05-binding peptides predicted by NetMHCpan and experimentally tested their ability to activate the full panel of disease-related TCRs. None of these high-affinity self-peptides elicited measurable CD69 upregulation in any of the TCRs (Supplementary Fig.
                - link "7" [ref=e356] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ), confirming that strong MHC binding alone does not equate to TCR activation and highlighting the added value of PRP-informed models for capturing functionally relevant cross-reactivity.
              - paragraph [ref=e357]:
                - text: Among the novel activating peptides, one derived from PSG5 was notable because of its anatomic expression. Single-cell RNA-seq data revealed that PSG5 is expressed in human iris pigment epithelial cells (Fig.
                - link "4e" [ref=e358] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig4
                - text: )
                - superscript [ref=e359]:
                  - link "Reference 27" [ref=e360] [cursor=pointer]:
                    - /url: /articles/s41587-026-03128-x#ref-CR27
                    - text: "27"
                - text: . This expression pattern corresponds with the region of inflammation in AAU, the iris, which implicates PSG5 as a novel candidate autoantigen in AAU and potentially AS pathogenesis.
              - paragraph [ref=e361]:
                - text: Direct ex vivo staining with PSG5–HLA-B27:05 tetramers demonstrated a statistically significant increase in PSG5-specific CD8
                - superscript [ref=e362]: +
