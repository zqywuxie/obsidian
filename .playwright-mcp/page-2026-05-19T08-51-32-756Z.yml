                    - text: "25"
                - text: . This integrated platform enables the direct modeling of TCR specificity based on empirical peptide binding, allowing exploration of TCR relationships defined by shared ligand recognition patterns rather than TCR sequence similarity alone (Fig.
                - link "1c" [ref=e242] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig1
                - text: ).
              - heading "PRPs reveal functional clustering distinct from TCR sequence similarity" [level=3] [ref=e243]
              - paragraph [ref=e244]:
