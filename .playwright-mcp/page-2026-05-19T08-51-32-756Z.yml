              - paragraph [ref=e398]:
                - text: However, despite this high accuracy in predicting peptide binding, the models trained on individual TCRs showed limited ability to predict T cell activation on our cross-reactive peptide panel (average AUROC = 0.64, average AUPRC = 0.53). This prompted us to test whether integrating data from the entire neighborhood could yield a more robust model. We hypothesized that jointly training a single pLM on the combined PRPs of the 19.2 neighborhood would enhance predictive power for activation by capturing shared recognition principles (Fig.
                - link "5c" [ref=e399] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig5
                - text: "). Notably, we found that a model jointly trained on all 19.2 variants demonstrated significantly improved performance (AUROC: P = 0.03125; and AUPRC: P = 0.015625) in predicting peptide-induced T cell activation for TCRs within this neighborhood, compared to models trained on individual TCRs (Fig."
                - link "5d" [ref=e400] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig5
                - text: and Supplementary Fig.
                - link "10" [ref=e401] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ). This joint model yielded refined binding prediction scores for the tested human peptides, indicating that integrating peptide recognition data from closely related receptors enhances the identification of activating ligands by improving the resolution of fine-specificity determinants or providing a more robust consensus binding profile for the TCR neighborhood.
              - paragraph [ref=e402]:
                - text: Notably, several immunodominant human peptides previously identified (for example, derived from PRPF3, PSG5 and the YEIH epitope) consistently activated these 19.2 CDR3β mutants, despite the engineered perturbations (Fig.
                - link "5e" [ref=e403] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig5
                - text: and Supplementary Fig.
                - link "11" [ref=e404] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#MOESM1
                - text: ). This persistent recognition across related TCR variants further supports their potential pathological significance in AS. While these experiments illuminate generalization within a local TCR space defined by sequence similarity, they also underscore the need for metrics such as functional distance to predict performance when encountering entirely new, potentially divergent TCRs.
              - 'heading "Generalizing across TCRs: performance limits and the utility of model-intrinsic uncertainty" [level=3] [ref=e405]'
              - paragraph [ref=e406]:
                - text: Building on these findings, we next addressed the fundamental challenge of generalizing predictions to entirely novel TCRs not encountered during training. We hypothesized that the ‘functional distance’ between a new TCR and the existing training data, quantified by the divergence of their PRPs, would be the key determinant of predictive success, rather than simple sequence similarity (Fig.
                - link "6a" [ref=e407] [cursor=pointer]:
                  - /url: /articles/s41587-026-03128-x#Fig6
                - text: )
