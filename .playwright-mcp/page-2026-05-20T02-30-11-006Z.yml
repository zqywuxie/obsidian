                  - paragraph [ref=e323]:
                    - text: We identified significant sequence biases in the CDR3 loops of these
                    - emphasis [ref=e324]: HOBIT
                    - text: "-expressing clonotypes ("
                    - link "Table S2" [ref=e325] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Compared to the remainder of the dataset, they are significantly longer (
                    - emphasis [ref=e326]: P
                    - text: <10
                    - superscript [ref=e327]: −300
                    - text: ), more positively charged (
                    - emphasis [ref=e328]: P
                    - text: <10
                    - superscript [ref=e329]: −40
                    - text: ), higher in aromatic, hydrophobic, and bulky residues, particularly tryptophan (
                    - emphasis [ref=e330]: P
                    - text: <10
                    - superscript [ref=e331]: −60
                    - text: ), and higher in cysteine (>100-fold enriched in the CDR3β,
                    - emphasis [ref=e332]: P
                    - text: <10
                    - superscript [ref=e333]: −50
                    - text: ). These sequence characteristics are strikingly similar to features identified in a comparison of MHC-independent versus MHC-restricted TCR sequences from an experimental study of TCR repertoires in MHC-knockout mice
                    - superscript [ref=e334]:
                      - link "25" [ref=e335] [cursor=pointer]:
                        - /url: "#R25"
                    - text: . Similar trends were also seen in comparisons of simulated and observed TCR sequences from pre- versus post-selection repertoires
                    - superscript [ref=e336]:
                      - link "26" [ref=e337] [cursor=pointer]:
                        - /url: "#R26"
                      - text: –
                      - link "28" [ref=e338] [cursor=pointer]:
                        - /url: "#R28"
                    - text: ", and in CD8αα+ intraepithelial lymphocytes and their thymic precursors"
                    - superscript [ref=e339]:
                      - link "29" [ref=e340] [cursor=pointer]:
                        - /url: "#R29"
                      - text: ","
                      - link "30" [ref=e341] [cursor=pointer]:
                        - /url: "#R30"
                    - text: . Based on these trends, we hypothesize that this CoNGA-identified population represents a noncanonical, self-specific or MHC-independent T cell population. We developed a numerical score, the
                    - emphasis [ref=e342]: iMHC score
                    - text: (for ‘independent of pMHC’), that captures the defining CDR3 sequence features of this putative MHC-independent T cell repertoire (see
                    - link "Methods" [ref=e343] [cursor=pointer]:
                      - /url: "#S9"
                    - text: and
                    - link "Table S3" [ref=e344] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ).
                - generic [ref=e345]:
                  - heading "CoNGA identifies GEX/TCR correlation in thymic T cells" [level=3] [ref=e346]
                  - paragraph [ref=e347]:
                    - text: We next applied CoNGA to a recently published single-cell atlas of human thymic T cells
                    - superscript [ref=e348]:
                      - link "31" [ref=e349] [cursor=pointer]:
                        - /url: "#R31"
                    - text: . This dataset combines thymic tissue from embryonic and fetal stages and postnatal thymi from children and adults, totaling over 9,400 clonotypes with paired TCRα and TCRβ sequences. CoNGA identified a large number of significant hits in this dataset, primarily within the DP (double-positive), CD8 single positive (SP), CD4 SP, Treg, and CD8αα
                    - superscript [ref=e350]: +
                    - text: thymic populations (
                    - link "Fig. 3" [ref=e351] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ). In TCR sequence space, we see a concentration of hits in the TRAV41 cluster (this TRAV gene is enriched in DP cells), the TRAV1 and TRAV12 clusters (enriched in CD8 cells), and in the TRAV14 cluster (enriched in CD8αα cells) (
                    - link "Fig. 3" [ref=e352] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ). The CD8+ clusters identified by CoNGA also showed high CD8 sequence scores and high scores for a measure (‘alphadist’) of the genomic distance between the TRAV and TRAJ gene segments incorporated in a clonotype’s TCRα chain. The DP CoNGA clusters show low alphadist scores, preference for
                    - emphasis [ref=e353]: TRAV41
                    - text: and other TRAV genes at the 3’ end of the locus, longer CDR3 loops (CDR3 length has been shown to decrease during thymic selection
                    - superscript [ref=e354]:
                      - link "26" [ref=e355] [cursor=pointer]:
                        - /url: "#R26"
                    - text: ), and higher scores for the ‘rim’ and ‘disorder’ amino acid properties (and lower scores for ‘strength’), which may suggest more polar, less bulky, and less strongly interacting CDR3 regions with lower overall affinity for pMHC. Consistent with the findings of Park et al.
                    - superscript [ref=e356]:
                      - link "31" [ref=e357] [cursor=pointer]:
                        - /url: "#R31"
                    - text: ", both CD8αα clusters show low alphadist scores; however, CoNGA further identified high iMHC scores and longer CDR3 loops as TCR features of these clusters. Interestingly, the CD8αα(II) cluster (see green/orange disc in"
                    - link "Fig. 3" [ref=e358] [cursor=pointer]:
                      - /url: "#F3"
                    - text: lower left) expressed both
                    - emphasis [ref=e359]: ZNF683
                    - text: and
                    - emphasis [ref=e360]: IKZF2
                    - text: ", which together with TCR features similar to those of the"
                    - emphasis [ref=e361]: HOBIT
                    - text: + T cells in the blood identified above suggests a possible precursor relationship between these two populations that warrants further investigation.
