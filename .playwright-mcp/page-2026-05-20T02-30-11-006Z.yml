            - generic [ref=e112]:
              - generic [ref=e113]:
                - heading "Summary" [level=2] [ref=e114]: Summary
                - paragraph [ref=e115]: Links between T cell clonotypes, as defined by T cell receptor (TCR) sequences, and phenotype, as reflected in gene expression profiles, surface protein expression, and peptide:MHC binding, can reveal functional relationships beyond the features shared by clonally related cells. We present clonotype neighbor-graph analysis (CoNGA), a graph-theoretic approach that identifies unbiased correlations between gene expression profile and TCR sequence through statistical analysis of gene expression and TCR similarity graphs. Using CoNGA, we uncovered associations between TCR sequence and gene expression profiles that include a previously undescribed ‘natural lymphocyte’ population of human circulating CD8+ T cells and a set of TCR sequence determinants of differentiation in thymocytes. These examples show that CoNGA may help elucidate complex relationships between TCR sequence and T cell phenotype in large, heterogeneous single-cell datasets.
              - generic [ref=e116]:
                - heading "Main" [level=2] [ref=e117]: Main
                - paragraph [ref=e118]:
                  - text: Previous studies pairing gene expression and TCR sequence have focused on the TCR sequence as a unique ‘barcode’ by which to identify clonally related cells. This approach produced insights into the development and interrelatedness of different T cell subsets within the context of cancer
                  - superscript [ref=e119]:
                    - link "1" [ref=e120] [cursor=pointer]:
                      - /url: "#R1"
                    - text: –
                    - link "8" [ref=e121] [cursor=pointer]:
                      - /url: "#R8"
                  - text: ", infectious disease"
                  - superscript [ref=e122]:
                    - link "9" [ref=e123] [cursor=pointer]:
                      - /url: "#R9"
                  - text: ", and homeostasis"
                  - superscript [ref=e124]:
                    - link "10" [ref=e125] [cursor=pointer]:
                      - /url: "#R10"
                  - text: . This body of work demonstrates that T cell clones derived from a common clonal ancestor tend to express similar transcriptional profiles. However, the availability of large single-cell sequencing datasets provides a rich pool of data to uncover relationships between TCR sequence
                  - emphasis [ref=e126]: similarity
                  - text: and cellular phenotype. Researchers have mapped the TCR sequence properties of previously identified T cell subsets
                  - superscript [ref=e127]:
                    - link "11" [ref=e128] [cursor=pointer]:
                      - /url: "#R11"
                    - text: –
                    - link "13" [ref=e129] [cursor=pointer]:
                      - /url: "#R13"
                  - text: ", but systematic approaches that can identify previously unknown populations or subpopulations by correlating gene expression and TCR sequence have not been reported. Also lacking are methods for identifying correlations between TCR sequence and gene expression that do not extend to global similarity or associate with a defined cell population (e.g., correlations between specific TCR sequence properties and expressed genes that might span multiple cell subsets)."
                - paragraph [ref=e130]:
                  - text: In parallel to the developments in single-cell profiling, methods for quantifying TCR repertoire features and identifying patterns within them have matured, helping extend our understanding of T cell biology. Previously, we introduced TCRdist, a measure for assessing inter-TCR similarity capable of identifying closely related clonotypes based on shared sequence features
                  - superscript [ref=e131]:
                    - link "14" [ref=e132] [cursor=pointer]:
                      - /url: "#R14"
                  - text: . Based on this work and others
                  - superscript [ref=e133]:
                    - link "15" [ref=e134] [cursor=pointer]:
                      - /url: "#R15"
                    - text: ","
                    - link "16" [ref=e135] [cursor=pointer]:
                      - /url: "#R16"
                  - text: ", it is clear that T cells targeting the same pathogen-derived epitope utilize T cell receptors that share consistent, definable amino acid motifs. In addition to these conventional T cell responses, certain unconventional T cell populations, such as mucosalassociated invariant T (MAIT) cells and invariant natural killer T (iNKT) cells, are characterized by conserved TCR sequence features and gene expression profiles"
                  - superscript [ref=e136]:
                    - link "11" [ref=e137] [cursor=pointer]:
                      - /url: "#R11"
                    - text: ","
                    - link "12" [ref=e138] [cursor=pointer]:
                      - /url: "#R12"
                  - text: . Although the repertoires for a number of distinct T cell subsets with suitable markers for their enrichment have been described, it is likely that other subsets linked by TCR and GEX remain undiscovered. We hypothesized that by identifying correlations between “TCR neighborhoods’’, defined by shared sequence features, and gene expression, we could move beyond simply measuring gene expression variation within individual clonal families and potentially identify associations between T cell antigen-specificities and phenotypes.
                - paragraph [ref=e139]:
                  - text: To this end, we developed a graph theoretic approach for clonotype neighbor-graph analysis, CoNGA, that identifies correlations between gene expression profile and TCR sequence features through analysis of similarity graphs defined on the set of T cell clonotypes. Application of CoNGA to publicly available T cell datasets identified multiple examples of GEX/TCR correlation including MAIT, iNKT, and epitope-specific T cell populations; TCR sequence determinants of T cell fate during thymic development; a previously undescribed
                  - emphasis [ref=e140]: ZNF683+/IKZF2+
                  - text: (aka
                  - emphasis [ref=e141]: HOBIT
                  - text: +/
                  - emphasis [ref=e142]: HELIOS
                  - text: +) population of CD8+ T cells with long and biased CDR3 regions; and a striking correlation between expression of the gene
                  - emphasis [ref=e143]: EPHB6
                  - text: and usage of a specific human TCR V gene segment,
                  - emphasis [ref=e144]: TRBV30.
                  - text: Applying CoNGA to four datasets that included pMHC binding profiles derived from sequencing of cell-surface bound, DNAbarcoded pMHC multimers revealed strong correlations between pMHC binding and both TCR sequence and gene expression. Systematic approaches such as CoNGA will play a key role in deconvoluting multi-modal single-cell datasets as they continue to grow in size and complexity.
              - generic [ref=e145]:
                - heading "Results" [level=2] [ref=e146]: Results
                - generic [ref=e147]:
                  - heading "CoNGA graph-vs-graph analysis" [level=3] [ref=e148]
                  - paragraph [ref=e149]:
                    - text: In
                    - emphasis [ref=e150]: graph-vs-graph
                    - text: correlation analysis (
                    - link "Fig. 1a" [ref=e151] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ), CoNGA identifies statistically significant overlap between a gene expression similarity graph and a TCR sequence similarity graph. CoNGA similarity graphs are defined at the level of
                    - emphasis [ref=e152]: clonotypes
                    - text: rather than individual
                    - emphasis [ref=e153]: cells
                    - text: ", since cells within the same clonotype (cells inferred to be descended from a common clonal ancestor) will all share the same TCR sequence and tend to have similar gene expression profiles ("
                    - link "Fig. E1" [ref=e154] [cursor=pointer]:
                      - /url: "#F7"
                    - text: )
                    - superscript [ref=e155]:
                      - link "10" [ref=e156] [cursor=pointer]:
                        - /url: "#R10"
                      - text: ","
                      - link "17" [ref=e157] [cursor=pointer]:
                        - /url: "#R17"
                      - text: ","
                      - link "18" [ref=e158] [cursor=pointer]:
                        - /url: "#R18"
                    - text: . The goal is to identify T cell clonotypes whose neighbors in gene expression space overlap significantly with their neighbors in TCR sequence space. Here, we model the concept of a clonotype’s neighbors in gene expression or TCR space using the mathematical concept of a
                    - emphasis [ref=e159]: graph neighborhood
                    - text: ", defined as the set of vertices directly connected to that clonotype’s vertex in the corresponding similarity graph. Briefly, CoNGA considers each clonotype in turn, counts how many other clonotypes are connected to it by both a TCR-similarity edge and a gene expression-similarity edge, and assigns a significance score (the"
                    - emphasis [ref=e160]: CoNGA score
                    - text: ). The CoNGA score is the probability of observing an equal or larger overlap by chance, multiplied by the total number of clonotypes to limit the false discovery rate from multiple comparisons. CoNGA scores range from 0 to the number of clonotypes; scores close to 0 are significant, scores around 1 are borderline, and scores above 1 are expected to occur by chance (see
                    - link "Methods" [ref=e161] [cursor=pointer]:
                      - /url: "#S9"
                    - text: for additional detail). T cell clonotypes with CoNGA scores below a significance threshold (henceforth referred to as “CoNGA hits”) are grouped into “CoNGA clusters” defined by shared gene expression and TCR cluster assignments (
                    - link "Fig. 1a" [ref=e162] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ", right panel). CoNGA clusters of sufficient size are analyzed to identify shared features including differentially expressed genes (DEGs) and TCR sequence motifs."
                  - figure [ref=e163]:
                    - heading "Figure 1. CoNGA graph-vs-graph analysis." [level=4] [ref=e164]
                    - paragraph [ref=e165]:
                      - img "Figure 1." [ref=e166]
                    - link "Open in a new tab" [ref=e168] [cursor=pointer]:
                      - /url: figure/F1/
                    - paragraph [ref=e170]:
                      - strong [ref=e171]: (a)
                      - text: CoNGA identifies correlation between T cell gene expression (GEX) and TCR sequence by constructing a gene expression similarity graph and a TCR sequence similarity graph and looking for statistically significant overlap between them. Overlap is assessed on a per-clonotype basis by counting the number of edges that originate at each clonotype and are shared between the two graphs, or equivalently by measuring the overlap between each clonotype’s GEX graph neighbors and its TCR graph neighbors and assigning a score that reflects the likelihood of seeing equal or greater overlap by chance (the CoNGA score). Clonotypes with CoNGA scores below a threshold are grouped based on shared GEX and TCR cluster assignments into CoNGA clusters. Clonotypes within each CoNGA cluster carry their initial GEX and TCR cluster identities which are combined together and used as a group ID for the CoNGA cluster.
                      - strong [ref=e172]: (b-c)
                      - text: Application of CoNGA on a dataset of human CD8+ T cells (
                      - emphasis [ref=e173]: 10x_200k_donor2a
                      - text: ).
                      - strong [ref=e174]: (b)
                      - text: 2D UMAP projections of clonotypes in the dataset based on GEX similarity (left three panels) and TCR similarity (right three panels), colored from left to right by (I) GEX cluster assignment; (II) CoNGA score; (III) joint GEX:TCR cluster assignment for clonotypes with significant CoNGA scores, using a bicolored disk whose left half indicates GEX cluster and whose right half indicates TCR cluster; (IV) TCR cluster; (V) CoNGA score; (VI) GEX:TCR cluster assignments for CoNGA hits, as in (III).
                      - strong [ref=e175]: (c)
                      - text: "GEX and TCR sequence features of CoNGA hits in clusters with 5 or more hits are summarized by a series of logo-style visualizations, from left to right: cluster dendrogram based on graph connections; differentially expressed genes (DEGs), TCR sequence logos showing V and J gene usage and CDR3 sequences"
                      - superscript [ref=e176]:
                        - link "14" [ref=e177] [cursor=pointer]:
                          - /url: "#R14"
                      - text: ; biased TCR sequence scores (
                      - link "Table S4" [ref=e178] [cursor=pointer]:
                        - /url: "#SD1"
                      - text: ), with red indicating elevated scores and blue indicating decreased scores. DEG and TCRseq sequence logos are scaled by the adjusted
                      - emphasis [ref=e179]: P
                      - text: value of the associations, with full logo height requiring a top adjusted
                      - emphasis [ref=e180]: P
                      - text: value below 10
                      - superscript [ref=e181]: −6
                      - text: . DEGs with fold-change less than 2 are shown in gray.
                  - paragraph [ref=e182]:
                    - text: We applied CoNGA to a collection of publicly available T cell datasets (
                    - link "Table S1" [ref=e183] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ) with singlecell gene expression profile and paired TCRαβ sequencing in an unbiased search for T cell populations defined by covariation between TCR sequence and gene expression profile.
                    - link "Figure 1b" [ref=e184] [cursor=pointer]:
                      - /url: "#F1"
                    - text: –
                    - link "c" [ref=e185] [cursor=pointer]:
                      - /url: "#F1"
                    - text: illustrates the CoNGA graph-vs-graph analysis workflow applied to a dataset of human CD8+ T cells sorted from peripheral blood (
                    - emphasis [ref=e186]: 10x_200k_donor2a
                    - text: ;
                    - link "Table S1" [ref=e187] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). First, the UMAP algorithm
                    - superscript [ref=e188]:
                      - link "19" [ref=e189] [cursor=pointer]:
                        - /url: "#R19"
                    - text: is applied to the gene expression and TCR distance matrices of each dataset to generate two dimensional projections of the gene expression and TCR landscapes (
                    - link "Fig. 1b" [ref=e190] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ", panels I-III and IV-VI, respectively). Next, a graph-based clustering algorithm"
                    - superscript [ref=e191]:
                      - link "20" [ref=e192] [cursor=pointer]:
                        - /url: "#R20"
                      - text: ","
                      - link "21" [ref=e193] [cursor=pointer]:
                        - /url: "#R21"
                    - text: is applied to the gene expression matrix to partition the dataset into clusters of clonotypes with similar transcriptional profiles and to the TCR distance matrix to produce clusters of clonotypes with similar TCR sequences (
                    - link "Fig. 1b" [ref=e194] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ", panels I and IV). To visualize the relative location of the topscoring clonotypes in both the gene expression and TCR UMAP space, these projections are also colored by CoNGA score ("
                    - link "Fig. 1b" [ref=e195] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ", panels II and V). Lastly, the gene expression and TCR cluster assignments of CoNGA hits are shown in the 2D projections using bicolored disks whose left and right halves correspond to the gene expression and TCR cluster assignments, respectively ("
                    - link "Fig. 1a" [ref=e196] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ;
                    - link "Fig. 1b" [ref=e197] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ", panel III for gene expression and VI TCR landscapes;"
                    - link "Fig. S1" [ref=e198] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). These cluster assignments provide useful handles for identifying CoNGA hits because they contain information on both gene expression and TCR, allowing us to map between the distinct two-dimensional landscapes. For example, in
                    - link "Figure 1b" [ref=e199] [cursor=pointer]:
                      - /url: "#F1"
                    - text: at the top of the gene expression landscape is a group of CoNGA hits that all belong to gene expression (GEX) cluster 4 (light brown on the left half of the disk) and TCR cluster 5 (purple on the right half of the disk), or equivalently, (GEX:TCR) cluster pair
                    - emphasis [ref=e200]: (4:5)
                    - text: ; based on consistent GEX:TCR disk coloring, we can see that these correspond to the group of clonotypes in the TCR landscape also located near the top of the plot and that they are likely TRAV1 (from the TCR cluster identifier in
                    - link "Fig. 1b" [ref=e201] [cursor=pointer]:
                      - /url: "#F1"
                    - text: panel IV). Each (GEX:TCR) cluster pair containing a minimum number of CoNGA hits (here 5) is characterized by a row of CDR3 sequence-logo
                    - superscript [ref=e202]:
                      - link "22" [ref=e203] [cursor=pointer]:
                        - /url: "#R22"
                    - text: style visualizations that identify the distinguishing features of those CoNGA hits (
                    - link "Fig. 1c" [ref=e204] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ).
                  - paragraph [ref=e205]:
                    - text: Four CoNGA clusters of ≥5 clonotypes were identified in this dataset of human CD8 T cells (
                    - link "Fig. 1c" [ref=e206] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ; see
                    - link "Supplementary Data 1" [ref=e207] [cursor=pointer]:
                      - /url: "#SD5"
                    - text: for TCR sequence information on all CoNGA clusters). The two largest (GEX:TCR) clusters—
                    - emphasis [ref=e208]: (4:11)
                    - text: and
                    - emphasis [ref=e209]: (4:5)
                    - text: —show the invariant TCR chains and distinctive gene expression profiles of MAIT cells
                    - superscript [ref=e210]:
                      - link "23" [ref=e211] [cursor=pointer]:
                        - /url: "#R23"
                    - text: . Cluster
                    - emphasis [ref=e212]: (2:12)
                    - text: is characterized by a strong TCRβ sequence motif and high expression of cytotoxicity/activation markers including
                    - emphasis [ref=e213]: GNLY
                    - text: and
                    - emphasis [ref=e214]: CCL5
                    - text: . The TCR sequence motif for this cluster matches the consensus for the response to the immunodominant A*02:01-restricted Influenza M1
                    - subscript [ref=e215]: "58"
                    - text: epitope
                    - superscript [ref=e216]:
                      - link "14" [ref=e217] [cursor=pointer]:
                        - /url: "#R14"
                    - text: (GILGFVFTL). Further confirming this, the top DEG for this cluster (‘A02_GILG9’) is actually the read count for a DNA-barcoded A*02:01-M1
                    - subscript [ref=e218]: "58"
                    - text: multimer that was included in the experiment. Application of CoNGA to three additional human and mouse PBMC datasets identified MAIT and iNKT cell clusters as well as CD8+ T cell clusters with a naive phenotype and TCR sequence features that appear to bias thymic development toward the CD8 compartment (
                    - link "Figs. E2" [ref=e219] [cursor=pointer]:
                      - /url: "#F8"
                    - text: and
                    - link "E3" [ref=e220] [cursor=pointer]:
                      - /url: "#F9"
                    - text: ;
                    - link "Supplementary Note 1" [ref=e221] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ).
                - generic [ref=e222]:
                  - heading "CoNGA defines a HOBIT+/HELIOS+ T cell population" [level=3] [ref=e223]:
                    - text: CoNGA defines a
                    - emphasis [ref=e224]: HOBIT+
                    - text: /
                    - emphasis [ref=e225]: HELIOS+
                    - text: T cell population
                  - paragraph [ref=e226]:
                    - text: We next applied CoNGA to four large datasets of peripheral blood CD8+ T cells that were sorted for positive binding to at least one of 50 DNA-barcoded pMHC multimers (
                    - emphasis [ref=e227]: 10x_200k_donor1–4
                    - superscript [ref=e228]:
                      - link "24" [ref=e229] [cursor=pointer]:
                        - /url: "#R24"
                    - text: ). Our analysis of TCR:pMHC binding described below identifies a number of strong epitope-specific responses for many of the pMHC multimers in the panel. However, for several of the multimers we observed significant levels of non-specific binding (
                    - link "Fig. E4" [ref=e230] [cursor=pointer]:
                      - /url: "#F10"
                    - text: ), for example to MAIT cells; as a result, these datasets also include diverse T cells whose specificity extends beyond the pMHC multimer panel (
                    - link "Supplementary Note 2" [ref=e231] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). CoNGA detected a large number of significant GEX/TCR correlations across these datasets, identifying 62 CoNGA clusters containing ≥5 clonotypes (
                    - link "Figs. S2" [ref=e232] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: –
                    - link "5" [ref=e233] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ) and 42 clusters using the more stringent size threshold of 0.1% of the dataset.
                    - link "Figure 2a" [ref=e234] [cursor=pointer]:
                      - /url: "#F2"
                    - text: provides an overview of the largest CoNGA clusters in the
                    - emphasis [ref=e235]: 10x_200k_donor1
                    - text: dataset. Further examination allowed categorization of the CoNGA clusters depicted in
                    - link "Figure 2a" [ref=e236] [cursor=pointer]:
                      - /url: "#F2"
                    - text: "into three groups: (1) Flu M1"
                    - subscript [ref=e237]: "58"
                    - text: "-responding clonotypes; (2) MAIT cells; and (3) a population of clonotypes with a shared gene expression profile (GEX cluster 2), diverse TCR gene usage, and rather long CDR3 regions. These CoNGA clusters in GEX cluster 2 showed high expression of the transcription factors"
                    - emphasis [ref=e238]: ZNF683
                    - text: (aka
                    - emphasis [ref=e239]: HOBIT
                    - text: ) and
                    - emphasis [ref=e240]: IKZF2
                    - text: (aka
                    - emphasis [ref=e241]: HELIOS
                    - text: ), along with a number of other NK cell-associated receptors including
                    - emphasis [ref=e242]: KLRC2
                    - text: ","
                    - emphasis [ref=e243]: KLRC3
