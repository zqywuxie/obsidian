                - generic [ref=e488]:
                  - heading "TCR and GEX similarity among epitope-specific clonotypes" [level=3] [ref=e489]
                  - paragraph [ref=e490]:
                    - text: The use of pMHC-multimers conjugated to DNA barcodes as cell labeling reagents enables high-throughput interrogation of pMHC binding in parallel with other single-cell analyses. We applied CoNGA to investigate correlation between gene expression profiles, TCR sequences, and pMHC:TCR interactions in a large dataset of human T cells sorted for pMHC-multimer binding (
                    - emphasis [ref=e491]: 10x_200k_donor1–4
                    - text: ). To do this, we used the pMHC-binding information, stringently filtered and condensed to the level of clonotypes (see
                    - link "Methods" [ref=e492] [cursor=pointer]:
                      - /url: "#S9"
                    - text: ), to define a neighbor graph structure in which edges connect clonotypes that bind to the same pMHC (
                    - link "Fig. E8" [ref=e493] [cursor=pointer]:
                      - /url: "#F14"
                    - text: ","
                    - link "Supplementary Data 2" [ref=e494] [cursor=pointer]:
                      - /url: "#SD4"
                    - text: ). We then applied CoNGA graph-vs-graph analysis to look for statistically significant overlap between this pMHC-binding graph and the GEX and TCR similarity graphs defined above. We measured graph overlap, on a per-pMHC basis, as the enrichment of GEX (or TCR) similarity graph edges within the pMHC positive clonotypes (
                    - link "Fig. 6a" [ref=e495] [cursor=pointer]:
                      - /url: "#F6"
                    - text: –
                    - link "b" [ref=e496] [cursor=pointer]:
                      - /url: "#F6"
                    - text: ","
                    - link "Table S7" [ref=e497] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). From this analysis we can see, as expected, that nearly all the pMHC-positive clonotype subsets show greater than expected TCR sequence similarity. Interestingly, we also see that all pMHC-positive populations show greater than expected GEX similarity, with highly significant
                    - emphasis [ref=e498]: P
                    - text: values and large fold-enrichments for most pMHCs with a sufficient number of analyzed clonotypes. These results suggest that clonotypes positive for the same pMHC have more similar gene expression profiles than would be expected by chance.
                  - figure "(a-b) Each marker represents a population of pMHC-positive clonotypes in one of the four 10x_200k donors. Markers are labeled with the two-digit HLA allele and the first three amino acids of the peptide for the given pMHC (see Table S7 for details); colors indicate the source donor and symbols are sized based on the number of pMHC+ clonotypes found as indicated in the legend. Markers are positioned based on the rate of intra-subset GEX (a) or TCR (b) graph edges relative to random expectation (xaxis; >1 indicates enrichment while <1 indicates depletion) and corresponding 2-sided P value (y-axis). (c) Heatmap of scaled DEGs and surface-protein features across different pMHCpositive populations." [ref=e499]:
                    - heading "Figure 6. CoNGA identifies convergence of TCR sequence and gene expression profile within pMHC-positive clonotype subsets." [level=4] [ref=e500]
                    - paragraph [ref=e501]:
                      - img "Figure 6." [ref=e502]
                    - link "Open in a new tab" [ref=e504] [cursor=pointer]:
                      - /url: figure/F6/
                    - paragraph [ref=e506]:
                      - strong [ref=e507]: (a-b)
                      - text: Each marker represents a population of pMHC-positive clonotypes in one of the four
                      - emphasis [ref=e508]: 10x_200k
                      - text: donors. Markers are labeled with the two-digit HLA allele and the first three amino acids of the peptide for the given pMHC (see
                      - link "Table S7" [ref=e509] [cursor=pointer]:
                        - /url: "#SD1"
                      - text: for details); colors indicate the source donor and symbols are sized based on the number of pMHC+ clonotypes found as indicated in the legend. Markers are positioned based on the rate of intra-subset GEX
                      - strong [ref=e510]: (a)
                      - text: or TCR
                      - strong [ref=e511]: (b)
                      - text: graph edges relative to random expectation (xaxis; >1 indicates enrichment while <1 indicates depletion) and corresponding 2-sided
                      - emphasis [ref=e512]: P
                      - text: value (y-axis).
                      - strong [ref=e513]: (c)
                      - text: Heatmap of scaled DEGs and surface-protein features across different pMHCpositive populations.
                  - paragraph [ref=e514]:
                    - text: We performed all-against-all differential expression analyses to identify upregulated genes within each pMHC-positive subset (
                    - link "Fig. 6c" [ref=e515] [cursor=pointer]:
                      - /url: "#F6"
                    - text: ). Examination of the expression patterns in
                    - link "Figure 6c" [ref=e516] [cursor=pointer]:
                      - /url: "#F6"
                    - text: "reveals a number of trends: the naive MART1 responses cluster together at the right and show higher levels of CD45RA and lower levels of PD-1 and CD45RO; Flu M1"
                    - subscript [ref=e517]: "58"
                    - text: (A02_GIL_MP) responses cluster together based on shared expression of specific markers including
                    - emphasis [ref=e518]: GNLY, ITGB1
                    - text: ", and"
                    - emphasis [ref=e519]: IFITM2
                    - text: ; EBV-specific responses show what may be a partitioning based on whether the antigens are ‘early’ or ‘latent’ genes, with the latent-gene responses showing higher
                    - emphasis [ref=e520]: GZMK, JUNB,
                    - text: CD45RO, and lower CD45RA compared to the ‘early’-gene responses (
                    - link "Fig. E9" [ref=e521] [cursor=pointer]:
                      - /url: "#F15"
                    - text: ). Application of gene set variation analysis (GSVA) to better characterize the pMHC phenotypes showed an enrichment of genes associated with naive T cells for some epitopes (e.g., MART1 and B08_RAK in the B*08-negative donor 1) while others (e.g., BMLF1 and BZLF1 in Donor 2) had clear signatures of activation/memory (
                    - link "Fig. E9" [ref=e522] [cursor=pointer]:
                      - /url: "#F15"
                    - text: ).
              - generic [ref=e523]:
                - heading "Discussion" [level=2] [ref=e524]: Discussion
                - paragraph [ref=e525]:
                  - text: In this study, we have introduced and applied an analytical tool, clonotype neighbor graph analysis or “CoNGA”, which we demonstrate to be capable of uncovering T cell populations defined by shared TCR sequence and gene expression features within large single-cell datasets. Application of CoNGA’s graph-vs-graph analysis on a diverse collection of datasets identified distinct GEX profiles of epitope-specific T cells; bias in the repertoire selection of naive CD8+ and CD4+ T cell populations; multiple populations of thymic T cells with biased TCR repertoires; and a putative MHC-independent,
                  - emphasis [ref=e526]: HOBIT/HELIOS
                  - text: "-expressing CD8+ T cell subset detected both in the thymus and peripheral blood with distinctive CDR3 sequence features. CoNGA analysis applied to a graph defined by single-cell pMHC-binding data determined that T cell populations specific for different pMHCs show distinctive GEX profiles."
                - paragraph [ref=e527]:
                  - text: Further, while the identification of marker genes associated with cells clustered in GEX space is a routine part of single-cell analysis, there are currently no available methods for systematically identifying genes associated with TCR clusters or TCR sequence biases that define GEX clusters. CoNGA addresses this gap with its graph-vs-feature analysis, in which TCR-derived properties such as CDR3 amino acid composition or V gene usage are mapped onto the GEX landscape to detect neighborhoods with biased feature distributions; GEX-derived properties such as the expression levels of individual genes are similarly analyzed to detect biased regions of the TCR landscape. Applying this analysis revealed the long CDR3s of the
                  - emphasis [ref=e528]: HOBIT
                  - text: + population enriched for hydrophobic residues, and a previously uncharacterized and highly significant correlation between expression of the
                  - emphasis [ref=e529]: EPHB6
                  - text: gene and usage of the
                  - emphasis [ref=e530]: TRBV30
                  - text: gene segment. This analysis mode is not limited solely to TCR features but can also leverage any other labelled feature (e.g., pMHC, cell surface markers) that has been linked, quantified, and integrated into the dataset.
                - paragraph [ref=e531]:
                  - text: An important next step will be to validate these findings by applying CoNGA to other datasets with GEX and TCR (and perhaps pMHC binding) information, as they become available. It will also be relevant to experimentally characterize the T cell populations identified by CoNGA, which should be possible using flow cytometry and the marker genes highlighted by CoNGA clustering. Furthermore, matching CoNGA-identified TCR sequences against bulk TCR sequence datasets may provide additional clues to their functionality while also shedding light on the matched repertoire sequences (
                  - link "Fig. E3" [ref=e532] [cursor=pointer]:
                    - /url: "#F9"
                  - text: ).
                - paragraph [ref=e533]:
                  - text: Our analyses have a number of limitations that could be addressed in future work. First, a consequence of operating at the level of clonotypes rather than individual cells is that variation among the cells belonging to expanded clonotypes becomes obscured. It is also important to keep in mind that the results from CoNGA will depend critically on the distance measures used to define clonotype similarity and the frameworks chosen for detecting GEX/TCR correlation (
                  - link "Fig. S9" [ref=e534] [cursor=pointer]:
                    - /url: "#SD1"
                  - text: ). In our experience, successful application of CoNGA requires a relatively large number of unique clonotypes (at least several hundred), which, depending on the degree of clonal expansion, may require a substantially larger number of individual cells. Lastly, the generality of the biological observations we report here should be weighed against the small number of donors examined. Future studies on larger cohorts will be necessary to definitively assess some of our observations.
                - paragraph [ref=e535]:
                  - text: To our knowledge, no previous algorithm enables systematic detection of GEX:TCR correlation. There are many possible extensions of CoNGA to explore in future work. CoNGA is agnostic to the source of the clonotype graphs, and hence could be applied to graphs defined by new similarity measures (based on surface protein expression, for example), new T cell clustering approaches
                  - superscript [ref=e536]:
                    - link "39" [ref=e537] [cursor=pointer]:
                      - /url: "#R39"
                  - text: ", epigenetic rather than gene expression profiles, or new immunological and clinical phenotypes. CoNGA could also be applied to B cell clonotypes by incorporating a BCR sequence similarity score analogous to TCRdist. It may also be worthwhile to explore the use of more sophisticated graph-correlation algorithms developed in the computer science and machine learning communities as alternatives to the neighborhood-overlap and neighborhoodscore enrichment that we have applied here."
                - paragraph [ref=e538]:
                  - text: Our analyses have a number of broader biological implications that warrant further consideration. First, the observation of a diversity of gene expression profiles across the different epitope-specific T cell populations argues for a broad continuum of memory T cell phenotypes
                  - superscript [ref=e539]:
                    - link "40" [ref=e540] [cursor=pointer]:
                      - /url: "#R40"
                  - text: rather than a small number of discrete subsets. Indeed, the definition of memory phenotypes would seem to be significantly determined by the eliciting pathogen. This diversity also suggests that improved prediction of target pMHC epitopes for T cells might be possible by combining TCR sequence with information on GEX profile
                  - superscript [ref=e541]:
                    - link "41" [ref=e542] [cursor=pointer]:
                      - /url: "#R41"
                  - text: . The putative MHC-independent and naive T cell populations identified by CoNGA hint at developmental influences of TCR sequence on T cell fate that go beyond the well-characterized role of invariant and semiinvariant TCRs
                  - superscript [ref=e543]:
                    - link "42" [ref=e544] [cursor=pointer]:
                      - /url: "#R42"
                  - text: . We are optimistic that analytical approaches combined with high-throughput single-cell experiments will continue to illuminate aspects of adaptive immunology for years to come.
              - generic [ref=e545]:
                - heading "Methods" [level=2] [ref=e546]: Methods
                - generic [ref=e547]:
                  - heading "CoNGA algorithm" [level=3] [ref=e548]
                  - paragraph [ref=e549]:
                    - text: "CoNGA was developed to identify correlations between gene expression profile and TCR sequence in diverse T cell populations without prior knowledge of the precise nature of these correlations. We envisioned two broad categories of correlation: one based on"
                    - emphasis [ref=e550]: similarity
                    - text: ", in which cells similar with respect to gene expression profile are also similar with respect to TCR sequence, and one based on"
                    - emphasis [ref=e551]: features
                    - text: ", in which specific aspects of gene expression and of TCR sequence are correlated without global similarity of both properties. CoNGA"
                    - emphasis [ref=e552]: graph-vs-graph
                    - text: correlation was developed to detect the first category of correlation, using the mathematical concept of graph neighborhoods to formalize our intuitive notion of global similarity. In contrast,
                    - emphasis [ref=e553]: de novo
                    - text: discovery of feature-based correlations, without prior knowledge of the correlated features, is more challenging, as it requires enumeration and testing of all possible feature pairs. CoNGA
                    - emphasis [ref=e554]: graph-vs-feature
                    - text: analysis represents a compromise approach in which we assume that, at least on one side of the correlation, some degree of global similarity is present (this is the “graph-” side); we then enumerate possible features defined by the other property and test for graph neighborhoods with biased feature distributions. CoNGA similarity graphs are defined at the level of
                    - emphasis [ref=e555]: clonotypes
                    - text: rather than individual
                    - emphasis [ref=e556]: cells
                    - text: . In the TCR similarity graph, each clonotype is connected by edges to its K nearest-neighbor (KNN) clonotypes based on TCR similarity as assessed by the TCRdist measure
                    - superscript [ref=e557]:
                      - link "14" [ref=e558] [cursor=pointer]:
                        - /url: "#R14"
                    - text: ", which scores sequence similarity in the pMHC-contacting CDR loops of the TCRα and TCRβ chains (here, K is an adjustable parameter specified as a fraction of the total number of clonotypes). In the gene expression similarity graph, each clonotype is connected by edges to its KNN clonotypes based on similarity in gene expression profile. Expanded clonotypes are represented by the gene expression profile of a single representative cell with the smallest average gene expression distance to the rest of the clonal family."
                - generic [ref=e559]:
                  - heading "CoNGA software package" [level=3] [ref=e560]
                  - paragraph [ref=e561]:
                    - text: An open-source python3 package implementing CoNGA graph-vs-graph and graph-vs-feature analysis is available from the software repository GitHub (
                    - link "External, opens in a new tab. https://github.com/phbradley/conga" [ref=e562] [cursor=pointer]:
                      - /url: https://github.com/phbradley/conga
                    - text: ). The conga package is built on the scanpy
                    - superscript [ref=e563]:
                      - link "43" [ref=e564] [cursor=pointer]:
                        - /url: "#R43"
                    - text: python package (
                    - link "External, opens in a new tab. https://github.com/theislab/scanpy" [ref=e565] [cursor=pointer]:
                      - /url: https://github.com/theislab/scanpy
                    - text: ) for single-cell analysis and makes heavy use of scanpy’s AnnData object to store integrated gene expression and TCR sequence data. We are grateful to the authors of scanpy for creating such a robust and useful package. CoNGA includes an implementation of the TCRdist
                    - superscript [ref=e566]:
                      - link "14" [ref=e567] [cursor=pointer]:
                        - /url: "#R14"
                    - text: distance calculation and TCR logo construction routines. Finally, CoNGA depends on the standard python data science tools numpy, scipy, matplotlib, pandas, and scikit-learn for visualization, data manipulation, and statistical calculations.
                - generic [ref=e568]:
                  - heading "TCR analysis" [level=3] [ref=e569]
                  - paragraph [ref=e570]:
                    - text: VDJ sequence data in the filtered_contig_annotations.csv output file generated by 10X Genomics cellranger vdj are first parsed into paired clonotypes using the conga.tcrdist.make_10x_clones_file function. Here, by default, the 10X cellranger clonotype definitions are filtered to remove spurious chain sharing and merge split clonotypes (e.g., due to partial recovery of a second TCRα transcript). Next, to quantify and assess the similarity between TCR sequences in the dataset, a matrix of pairwise TCRdist distances between each unique paired TCR from this cleaned clonotype table is computed. Kernel principal components analysis (kPCA) as implemented in scikit-learn’s KernelPCA class is then used to extract the top 50 components of variation from this distance matrix. While the raw TCRdist values can be used directly in dimensionality reduction and clustering (available as an option in the pipeline), the kernel PCs are used by default as a more memory-efficient alternative as they can be directly incorporated into the standard single-cell workflows in place of the principal components extracted from the gene expression counts matrix. For generation of 2D landscape projections, CoNGA uses the UMAP algorithm for dimensionality reduction
                    - superscript [ref=e571]:
                      - link "19" [ref=e572] [cursor=pointer]:
                        - /url: "#R19"
                    - text: as implemented in scanpy.tl.umap. Clusters of clonotypes with similar T cell receptor sequences are identified with the Louvain
                    - superscript [ref=e573]:
                      - link "20" [ref=e574] [cursor=pointer]:
                        - /url: "#R20"
                      - text: ","
                      - link "21" [ref=e575] [cursor=pointer]:
                        - /url: "#R21"
                    - text: graph-based clustering algorithm (scanpy.tl.louvain). Both UMAP projection and clustering rely on a nearest neighbors calculation conducted with the scanpy.pp.neighbors routine with 10 neighbors and 50 principal components (the 50 kernel PCs computed from the distance matrix). To annotate the Louvain clusters in CoNGA visualizations, the most frequent V segment in each cluster is identified and appended to the cluster name if it is present in at least 50% of the clustered TCRs, uppercased if present in at least 75% of the TCRs (clusters are initially named with consecutive integers, starting at 0 with the largest cluster).
                - generic [ref=e576]:
                  - heading "TCR sequence features" [level=3] [ref=e577]
                  - paragraph [ref=e578]:
                    - text: For each clonotype, CoNGA calculates a set of TCR sequence-based scores for use in graphvs-feature analysis and for annotating graph-vs-graph clusters (
                    - link "Table S4" [ref=e579] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). First, a set of 28 different amino acid properties (
                    - link "Fig. S7" [ref=e580] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ","
                    - link "Table S4" [ref=e581] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ) are averaged over the central amino acids in the alpha and beta chain CDR3 loops (excluding the first 4 and last 4 residues of each CDR3, where the full CDR3 sequence is defined as beginning with the conserved cysteine and ending with, and inclusive of, the phenylalanine immediately before the GXG motif in the J region). These scores include a set compiled from original sources
                    - superscript [ref=e582]:
                      - link "44" [ref=e583] [cursor=pointer]:
                        - /url: "#R44"
                      - text: –
                      - link "49" [ref=e584] [cursor=pointer]:
                        - /url: "#R49"
                    - text: by the authors of the VDJtools package
                    - superscript [ref=e585]:
                      - link "50" [ref=e586] [cursor=pointer]:
                        - /url: "#R50"
                    - text: as well as the five Atchley factors
                    - superscript [ref=e587]:
                      - link "51" [ref=e588] [cursor=pointer]:
                        - /url: "#R51"
                    - text: ". Seven additional sequence-based scores are calculated: ‘alphadist’, which measures the ordinal distance between the TRAV and TRAJ genes when the full set of gene segments is ordered by genomic position; ‘imhc’, the iMHC score (detailed below); ‘cd8’, a simple CD8-versus-CD4 preference score calculated from the TCR V and J gene usage, CDR3 length, and CDR3 amino acid composition, based on frequency differences between flow-sorted CD8+ and CD4+ TCR sequence repertoires; ‘cdr3len’, total CDR3 length; ‘mait’, which assigns a score of 1 to TCRs with an alpha chain using the TRAV1–2 and TRAJ33/TRAJ20/TRAJ12 segments (TRAV1 and TRAJ33 in mouse) and a CDR3α length of 12, and 0 to all other TCRs; ‘inkt’, which assigns a score of 1 to TCRs with the TRAV10/TRAJ18/TRBV25 gene combination and a CDR3α length of 14, 15, or 16 (TRAV11/TRAJ18 and length 15 for mouse); and ‘nndists_tcr’, which measures the density of TCR sequences nearby the scored clonotype by calculating the average TCR distance to the nearest 1% of clonotypes. The iMHC (for ‘independent of pMHC’) score is a weighted linear combination of TCR sequence features ("
                    - link "Table S4" [ref=e589] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ;
                    - link "Fig. S8" [ref=e590] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). The parameters were fit by using L1-regularized logistic regression to discriminate the TCR sequences of
                    - emphasis [ref=e591]: HOBIT
                    - text: + CoNGA hits (CoNGA score<0.2) in GEX cluster 2 of dataset
                    - emphasis [ref=e592]: 10x_200k_donor1
                    - text: (
                    - link "Fig. 2" [ref=e593] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ) from the TCRs of the clonotypes in the other GEX clusters. We chose to draw the background clonotypes exclusively from the other GEX clusters to avoid inclusion of genuine
                    - emphasis [ref=e594]: HOBIT
                    - text: + TCR sequences in our negative set.
                - generic [ref=e595]:
                  - heading "Gene expression analysis" [level=3] [ref=e596]
                  - paragraph [ref=e597]: Gene expression data in the form of read count matrices are processed according to standard workflows implemented in scanpy to eliminate cells and genes with low counts, high mitochondrial content, etc. Variable genes are identified, and principal components analysis (PCA) is used to project the high-dimensional gene expression data down to a smaller set of components per cell (the default is 40 components). These gene expression PCs are used to select a single representative cell for each clonotype by taking the cell with the smallest average Euclidean distance in PC space to the other cells in the clonotype. Alternatively, the PC vectors of all the cells in each clonotype can be averaged to generate a single pseudo-cell GEX profile (accessible with the --average_clone_gex command line option). Once the dataset has been reduced to a single cell per clonotype, the UMAP and Louvain clustering tools are applied to the PCA matrix to produce a gene expression landscape and a set of gene expression clonotype clusters. DEGs in clonotype groupings (for example the set of CoNGA hits in a cluster) are identified using the sc.tl.rank_genes_groups routine with the ‘wilcoxon’ method.
                  - paragraph [ref=e598]:
                    - text: The large thymus atlas T cell dataset
                    - superscript [ref=e599]:
                      - link "31" [ref=e600] [cursor=pointer]:
                        - /url: "#R31"
                    - text: combined a heterogeneous set of donors and samples; merging these data to generate integrated projections and clusters required the original authors to perform an iterative batch correction scheme. As it was not immediately obvious how to recover the processed gene expression components from the publicly available data, and as a test of CoNGA’s robustness to alternative neighbor graphs, we elected to use the provided 3D UMAP coordinates in lieu of gene expression PCs for the CoNGA GEX neighbor calculations described below. We also directly borrowed the GEX clusters from the original publication rather than reclustering the dataset.
                - generic [ref=e601]:
                  - heading "Graph-vs-graph correlation analysis" [level=3] [ref=e602]
                  - paragraph [ref=e603]:
                    - text: "In CoNGA graph-vs-graph correlation analysis, similarity graphs defined by gene expression and by TCR sequence are compared to identify vertices (clonotypes) whose neighbor sets in the two graphs overlap significantly. The CoNGA score assigned to a clonotype equals the probability of seeing an equal or larger overlap between its GEX and TCR neighborhoods by chance, multiplied by the total number of clonotypes to correct for multiple testing. The hypergeometric distribution, as implemented in the scipy.stats module, is used to estimate this 1sided probability; this probability distribution models the overlap observed when selecting two subsets of specified size independently and at random from a set of interchangeable items. Two types of similarity graphs can be used in CoNGA: K nearest neighbor (KNN) graphs, in which each clonotype is connected to its K nearest neighbors in gene expression or TCR space ("
                    - link "Fig. 1a" [ref=e604] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ); and
                    - emphasis [ref=e605]: cluster graphs
                    - text: ", in which each clonotype is connected to all the clonotypes in the same (GEX or TCR) cluster. The neighbor number K for constructing KNN graphs is specified as a fraction of the total number of clonotypes; for the calculations reported here, neighbor fractions of 0.01 and 0.1 were used. The CoNGA score assigned to a clonotype is the minimum score over all graph comparisons, of which there were 6 combinations in the calculations reported here (GEX_KNN vs TCR_KNN, GEX_KNN vs TCR_cluster, and GEX_cluster vs TCR_KNN, for both the 0.01 and 0.1 KNN neighbor fractions). Since these neighbor graphs are correlated (for example, the neighborhoods in the 0.01 KNN graph are contained in the neighborhoods in the 0.1 KNN graph), estimating the multiple testing burden associated with using multiple graphs is not completely straightforward. Instead, we turned to shuffling experiments to estimate false discovery rates associated with our procedure of selecting CoNGA clusters using CoNGA score and cluster size thresholds. We randomly permuted the TCR sequence assignments relative to the GEX information for each of our 9 datasets and ran the CoNGA graph-vs-graph analysis, tallying the number of CoNGA hits at a score threshold of 1.0 and the number of CoNGA clusters of size exceeding our default threshold (5 or 0.001*num_clonotypes, whichever is larger). This procedure was repeated 5 times for each dataset, yielding 45 shuffled outcomes ("
                    - link "Table S8" [ref=e606] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ), across which we observed a total of 3 CoNGA clusters for a background rate of 3/45 = 0.067 per shuffled run.
                  - paragraph [ref=e607]:
                    - text: To assess the sensitivity of CoNGA graph-vs-graph analysis, we performed sub-sampling experiments in which we varied the frequency of clonotypes belonging to a known “truepositive” population (MAIT cells in the human datasets and iNKT cells in the mouse dataset) and recorded the fraction reported as CoNGA hits as a function of the subsampled frequency (
                    - link "Fig. E10" [ref=e608] [cursor=pointer]:
                      - /url: "#F16"
                    - text: "). This analysis revealed that the recovery rate depended more strongly on the absolute number of subsampled true-positive clonotypes than on the fraction within the dataset: there is better alignment between the recovery curves plotted as a function of subsampled count ("
                    - link "Fig. E10b" [ref=e609] [cursor=pointer]:
                      - /url: "#F16"
                    - text: ) than as a function of subsampled fraction (
                    - link "Fig. E10a" [ref=e610] [cursor=pointer]:
                      - /url: "#F16"
                    - text: ). We see relatively high rates of recovery down to a population size of ~20 true-positive clonotypes.
                  - paragraph [ref=e611]:
                    - text: For annotation purposes, TCRβ sequences in all CoNGA clusters and in the pMHC-positive repertoires in the
                    - emphasis [ref=e612]: 10x_200k
                    - text: dataset were matched to a set of bulk TCRβ repertoires (
                    - link "Figs. E3" [ref=e613] [cursor=pointer]:
                      - /url: "#F9"
                    - text: and
                    - link "E8" [ref=e614] [cursor=pointer]:
                      - /url: "#F14"
                    - text: ). Exact matching at the amino acid level was first used to assign a ‘publicity’ score to each TCRβ chain equal to the fraction of repertoires containing that chain in a large (N=666) dataset of relatively deep (~200,000 median clonotypes) repertoires
                    - superscript [ref=e615]:
                      - link "52" [ref=e616] [cursor=pointer]:
                        - /url: "#R52"
                    - text: . The probability of generation (
                    - emphasis [ref=e617]: P
                    - subscript [ref=e618]:
                      - emphasis [ref=e619]: gen
                    - text: ) was calculated for each chain using the model proposed by Murugan et al
                    - superscript [ref=e620]:
                      - link "53" [ref=e621] [cursor=pointer]:
                        - /url: "#R53"
                    - text: . To quantify overlap between the set of TCR sequences in a CoNGA cluster or pMHC-positive subset and the set of sequences in a repertoire, we developed a modified version of the Morisita-Horn overlap measure
                    - superscript [ref=e622]:
                      - link "54" [ref=e623] [cursor=pointer]:
                        - /url: "#R54"
                    - text: "that accounts for sequence similarity (rather than exact identity) using a Gaussian kernel:"
