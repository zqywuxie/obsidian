                - generic [ref=e374]:
                  - heading "CoNGA graph-vs-feature analysis" [level=3] [ref=e375]
                  - paragraph [ref=e376]:
                    - text: In CoNGA graph-vs-feature analysis (
                    - link "Fig. 4a" [ref=e377] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ), numerical features calculated on the basis of one cellular property, GEX or TCR sequence, are mapped onto a similarity graph defined by the other property, and the feature score distributions for each of the neighborhoods in the graph are compared to their background distributions to identify neighborhoods with skewed scores (as above, a graph neighborhood consists of a single central vertex together with all of its directly connected neighbors). As GEX features, we consider the expression levels of individual genes, and for TCR sequence features, we use a set of CDR3 amino acid property values as well as a handful of additional, sequence-based scores (
                    - link "Table S4" [ref=e378] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: and
                    - link "Fig. S7" [ref=e379] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). We first used graph-vs-feature analysis to identify additional members of the
                    - emphasis [ref=e380]: HOBIT
                    - text: +/
                    - emphasis [ref=e381]: HELIOS
                    - text: + unconventional T cell subset by looking for GEX graph neighborhoods with elevated iMHC scores. Although per-clonotype iMHC scores are highly variable (
                    - link "Fig. 4b" [ref=e382] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ), by computing averages over GEX graph neighborhoods we can identify a subregion of GEX space with enhanced scores (
                    - link "Fig. 4c" [ref=e383] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ), whose significance can be assessed using standard statistical tests (
                    - link "Fig. 4d" [ref=e384] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ). Three of the four
                    - emphasis [ref=e385]: 10x_200k
                    - text: donors show populations of clonotypes with significantly enhanced iMHC scores (
                    - link "Fig. E6a" [ref=e386] [cursor=pointer]:
                      - /url: "#F12"
                    - text: –
                    - link "d" [ref=e387] [cursor=pointer]:
                      - /url: "#F12"
                    - text: ) whose DEGs correlate well with one another and with the key marker genes (
                    - emphasis [ref=e388]: ZNF683, CD7, CD99, DUSP1/2
                    - text: ) for the original
                    - emphasis [ref=e389]: HOBIT
                    - text: + CoNGA clusters (
                    - link "Fig. E6e" [ref=e390] [cursor=pointer]:
                      - /url: "#F12"
                    - text: –
                    - link "g" [ref=e391] [cursor=pointer]:
                      - /url: "#F12"
                    - text: ).
                  - figure [ref=e392]:
                    - heading "Figure 4. Graph-vs-feature analysis highlights TCR:GEX covariation." [level=4] [ref=e393]
                    - paragraph [ref=e394]:
                      - img "Figure 4." [ref=e395]
                    - link "Open in a new tab" [ref=e397] [cursor=pointer]:
                      - /url: figure/F4/
                    - paragraph [ref=e399]:
                      - strong [ref=e400]: (a)
                      - text: In graph-vsfeature analysis, a numerical feature defined by one property (here gene expression) is mapped onto a similarity graph defined by the other property (TCR sequence), and graph neighborhoods with skewed score distributions are identified using statistical tests that compare the scores for each neighborhood (including the center clonotype) with the scores of the remaining clonotypes (left). For example, the gene
                      - emphasis [ref=e401]: KLRB1
                      - text: (
                      - emphasis [ref=e402]: CD161
                      - text: ) shows a non-uniform distribution over the TCR sequence landscape—discrete regions of higher expression (red) against a background of lower expression (blue)—suggesting that a group of homologous clonotypes belongs to a T cell subtype characterized by KLRB1 expression. This is quantified for a single clonotype (green outline) and its TCR sequence neighbors (black outlines) in the violin plot (right), which shows the
                      - emphasis [ref=e403]: KLRB1
                      - text: expression level for the clonotype and its neighbors on the right and for the remainder of the dataset on the left (boxes show quartiles with whiskers extending to 1.5*IQR). The 1-sided Mann-Whitney-Wilcoxon
                      - emphasis [ref=e404]: P
                      - text: value for this expression difference is 1.5e-46 (n=2,427 clonotypes).
                      - strong [ref=e405]: (b)
                      - text: 2D GEX projection of the
                      - emphasis [ref=e406]: 10x_200k_donor1
                      - text: dataset colored by iMHC score (standardized to have mean 0 and standard deviation 1).
                      - strong [ref=e407]: (c)
                      - text: same projection as (b) but each clonotype is colored by the average iMHC score in its GEX graph neighborhood.
                      - strong [ref=e408]: (d)
                      - text: The same projection as in (b and c) but colored by
                      - emphasis [ref=e409]: P
                      - text: values for iMHC enrichment in each clonotype’s graph neighborhood (the set of iMHC scores in each clonotype’s neighborhood are compared to the remainder of the iMHC scores using an unpaired, 1-sided Mann-Whitney-Wilcoxon test).
                      - strong [ref=e410]: (e)
                      - text: Graph-vs-feature correlation analysis highlights TCR:GEX covariation in Flu-specific T cells. Correlation between a score derived from the TCR sequence (left panel), here defined by the surface counts for the multimerized A*02:M1
                      - subscript [ref=e411]: "58"
                      - text: pMHC, and 2 scores derived from the GEX profile (right panels,
                      - emphasis [ref=e412]: ITGB1
                      - text: and
                      - emphasis [ref=e413]: KLRC1
                      - text: ) is illustrated by mapping the scores onto the 2D TCR landscape for the
                      - emphasis [ref=e414]: 10x_200k_donor2 dataset
                      - text: (after Z-score normalization and averaging over graph neighborhoods).
                  - paragraph [ref=e415]:
                    - text: We next applied graph-vs-feature analysis in the reverse direction to identify genes that are differentially expressed in specific TCR graph neighborhoods.
                    - link "Table S5" [ref=e416] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: provides the top hits from this analysis for the datasets analyzed in this study (the top significant gene for each GEX:TCR cluster pair and a maximum of 10 genes per dataset are shown). Notable features include MAIT-associated genes such as
                    - emphasis [ref=e417]: KLRB1
                    - text: (
                    - link "Fig. 4a" [ref=e418] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ", middle panel) and"
                    - emphasis [ref=e419]: SLC4A10
                    - text: ; genes associated with the
                    - emphasis [ref=e420]: HOBIT+
                    - text: population such as
                    - emphasis [ref=e421]: ZNF683
                    - text: and
                    - emphasis [ref=e422]: KLRC3
                    - text: (
                    - link "Fig. 2b" [ref=e423] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ;
                    - link "Fig. E6h" [ref=e424] [cursor=pointer]:
                      - /url: "#F12"
                    - text: ); and genes upregulated in the Flu M1
                    - subscript [ref=e425]: "58"
                    - text: response including
                    - emphasis [ref=e426]: ITGB1
                    - text: and
                    - emphasis [ref=e427]: KLRC1
                    - text: (in donor 2;
                    - link "Fig. 4e" [ref=e428] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ). We also observed TCR neighborhoods with elevated levels of
                    - emphasis [ref=e429]: CD8A
                    - text: and
                    - emphasis [ref=e430]: CD8B
                    - text: ", which appear to overlap with the populations identified in the earlier graph-vs-graph correlation analysis and suggest the presence of TCR sequence features that bias toward the CD8+ compartment. Such TCR sequence biases have been previously reported in analyses of bulk repertoire"
                    - superscript [ref=e431]:
                      - link "32" [ref=e432] [cursor=pointer]:
                        - /url: "#R32"
                      - text: –
                      - link "35" [ref=e433] [cursor=pointer]:
                        - /url: "#R35"
                    - text: .
                  - paragraph [ref=e434]:
                    - text: A recurring feature identified by CoNGA graph-vs-feature analysis was a positive correlation between expression of the gene
                    - emphasis [ref=e435]: EPHB6
                    - text: and usage of the
                    - emphasis [ref=e436]: TRBV30
                    - text: gene segment in humans (
                    - link "Fig. 5a" [ref=e437] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ), and analogously
                    - emphasis [ref=e438]: Ephb6
                    - text: and
                    - emphasis [ref=e439]: Trbv31
                    - text: in mouse (
                    - link "Fig. 5b" [ref=e440] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ","
                    - link "Tables S5" [ref=e441] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: –
                    - link "6" [ref=e442] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). The
                    - emphasis [ref=e443]: TRBV30
                    - text: segment is unique among TRBV genes in being located alone downstream of the TRBJ and TRBC genes at the end of the TRB locus
                    - superscript [ref=e444]:
                      - link "36" [ref=e445] [cursor=pointer]:
                        - /url: "#R36"
                    - text: . Providing a potential clue into the mechanism underlying this covariation,
                    - emphasis [ref=e446]: EPHB6
                    - text: is located adjacent to
                    - emphasis [ref=e447]: TRBV30
                    - text: on Chromosome 7, ~40kb downstream from the TRB locus (
                    - link "Fig. 5c" [ref=e448] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ). A focused search for covariation between TCR gene segment usage and DEGs on ten separate datasets confirmed higher
                    - emphasis [ref=e449]: EPHB6
                    - text: expression in clonotypes that incorporate the
                    - emphasis [ref=e450]: TRBV30
                    - text: gene segment (
                    - link "Fig. 5d" [ref=e451] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ), or
                    - emphasis [ref=e452]: TRBV31
                    - text: in mouse (
                    - link "Fig. 5e" [ref=e453] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ", n=4). Flow cytometric analysis confirmed that these trends extend to cell-surface levels of EPHB6 protein ("
                    - link "Fig. 5f" [ref=e454] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ; gating strategy in
                    - link "Fig. E7" [ref=e455] [cursor=pointer]:
                      - /url: "#F13"
                    - text: ). Given that EPHB6 has been shown to play a role in T cell activation
                    - superscript [ref=e456]:
                      - link "37" [ref=e457] [cursor=pointer]:
                        - /url: "#R37"
                      - text: ","
                      - link "38" [ref=e458] [cursor=pointer]:
                        - /url: "#R38"
                    - text: ","
                    - emphasis [ref=e459]: TRBV30
                    - text: + clonotypes may have distinctive functional properties due to their elevated EPHB6 surface expression.
                  - figure [ref=e460]:
                    - heading "Figure 5. EPHB6 co-expression is a feature of TRBV30+ T cells." [level=4] [ref=e461]
