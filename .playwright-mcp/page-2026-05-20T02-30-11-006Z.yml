                - generic [ref=e652]:
                  - heading "Graph-vs-feature correlation analysis" [level=3] [ref=e653]
                  - paragraph [ref=e654]:
                    - text: In CoNGA graph-vs-feature correlation analysis, numerical features defined on the basis of one property (GEX or TCR) are mapped onto similarity graphs defined by the other property, and graph neighborhoods with biased score distributions are identified. As GEX properties we consider the expression levels of all the individual genes as well as a feature (‘nndists_gex’) that captures the density of nearby clonotypes by calculating the average distance in GEX space to the nearest 1% of the clonotypes. The TCR features were described in an earlier section. As this analysis involves a large number of differential expression calculations (roughly the number of clonotypes times the number of different similarity graphs times the number of features), we use a two-step procedure that combines a pre-filter with the t-test followed by the more timeintensive Mann-Whitney-Wilcoxon (MWW) calculation for the top 100 hits per clonotype and graph that pass a t-test significance threshold ten times higher than the target threshold. The final significance score assigned to a detected association equals the raw MWW
                    - emphasis [ref=e655]: P
                    - text: value multiplied by the product of the number of clonotypes and the number of features, to correct for multiple testing.
                - generic [ref=e656]:
                  - heading "Analysis of pMHC binding" [level=3] [ref=e657]
                  - paragraph [ref=e658]:
                    - text: In the
                    - emphasis [ref=e659]: 10x_200k
                    - text: experiment, T cells were stained with a panel of 50 DNA-barcoded pMHC multimer reagents. Sequence reads for each of the pMHC barcodes were counted along with the reads for intracellular transcripts and included in the raw count matrix provided by 10x Genomics. The first step in our analysis was to assign individual T cells and T cell clonotypes as positive for binding to specific pMHC multimers based on the observed read counts for the pMHC DNA barcodes. A cell was called positive for the pMHC multimer with the highest barcode count if the natural logarithm of that pMHC’s barcode count exceeded the next highest log-count by at least 2.0 (corresponding to a fold-difference in barcode counts of roughly 7.5; all counts were augmented by 1 prior to taking logarithms). To assign clonotypes to pMHCs, we averaged the log-counts for each pMHC over all the cells in the clonotype and again applied a threshold of 2.0 between the top and second-highest averaged log-counts. The results of this pMHC-binding analysis are summarized in
                    - link "Table S7" [ref=e660] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: for all pMHCs with at least 5 positive clonotypes in one of the four samples. We can see that, with the exception of the ‘sticky’ pMHC A03_KLG, the majority of pMHC+ positive cells belong to clonotypes that are also called positive (see the ‘Clone fraction’ column in
                    - link "Table S7" [ref=e661] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Each donor dataset in the
                    - emphasis [ref=e662]: 10x_200k
                    - text: experiment consisted of multiple batches that were combined using the scanpy AnnData.concatenate function. For donors 1 and 2, the individual batches were divided into two experimental meta-batches. We observed a modest enhancement (3–5%) of neighbor connections between cells in the same meta-batch. Additionally, for two of the analyzed pMHCs (A02_GILG9 and A02_ELAG10) we detected a relative bias of pMHC-positive cells toward the first meta-batch. Since the second meta-batch was larger, this actually had the effect of balancing the batch composition for these pMHC-positive subsets and hence, given the slight depletion of inter-batch neighbor connections, making our conclusions regarding GEX similarity of pMHC-positive subsets more conservative.
                - generic [ref=e663]:
                  - heading "Flow Cytometry Analysis" [level=3] [ref=e664]
                  - paragraph [ref=e665]: Flow cytometric analysis was performed using PBMCs collected from apheresis rings of 12 healthy blood donors. Samples were first stained with Ghost510 viability dye (Tonbo Bioscience) then TruStain FcX (Biolegend) to block non-specific staining prior to antibody labeling. For the HOBIT/HELIOs experiments, samples were first stained for CD3 (APC-Fire750, SK7), CD4 (PE-Cy7, OKT4), CCR7 (BrilliantViolet 785, G043H7), CD45RA (BrilliantViolet 421, HI100), CD45RO (BrilliantViolet 605 or AlexaFluor 700, UCHL1) (BioLegend), CD14 (biotin, 61D3), CD19 (biotin, SJ25C1) (Tonbo Bioscience), KIR2D ( FITC, NKVFS1), KLRC2 (PEVio615, REA205) (Miltenyi), CD8B (PerCP-eFluor710, SIDI8BEE, Invitrogen), and CD248 ( AlexaFluor 647, B1/35, BD Biosciences) for 30’ at RT in PBS containing 2% FCS and 1 mM EDTA prior to secondary staining with streptavidin-BrilliantViolet 510 (Biolegend) for 15’ on ice. In the experiment with MR1 and CD1d tetramer labelling, 5-OP-RU loaded MR1 (BrilliantViolet 421), and PBS-57 loaded CD1d (AlexaFluor 647) tetramers (NIH Tetramer Core Facility) were included during the time of surface staining. For the HELIOS experiment, surface-stained cells were fixed and permeabilized using the Transcription Factor Staining Buffer Set (ThermoFisher) prior to staining for HELIOS (PE, D8W4X, Cell Signaling). For the EPHB6/TRBV30 experiments, samples were stained for CD3 (APC-Fire750, SK7), CD4 (PE-Cy7, OKT4), CD8B (PerCPeFluor710, SIDI8BEE), EPHB6 (AlexaFluor 488, 465327, R&D Systems), and TRBV30(Vβ20) (PE, ELL1.4, Beckman Coulter). Samples were analyzed using an Aurora spectral analyzer (Cytek) and data analyzed using FlowJo software (BD Biosciences).
                  - paragraph [ref=e666]: Further information on research design is available in the Nature Research Reporting Summary linked to this article
