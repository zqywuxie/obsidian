                - paragraph [ref=e733]: Comparison of binding data for four ‘specific’ pMHC multimers (A02_GIL, A02_ELA, B08_RAK, A02_GLC) and four ‘sticky’ pMHC multimers (A03_KLG, A03_RLR, A03_RIA, A11_AVF) in the 10x_200k_donor2 dataset. (a) GEX landscapes colored by pMHC binding signal (log(1+ UMI read count)). (b) TCR landscapes colored by pMHC binding signal. The ‘specific’ pMHCs show binding that is focused in certain areas of the landscapes, whereas the binding of the putative ‘sticky’ pMHCs is dispersed across the landscapes. (c) The Pearson correlation between binding profiles for different pMHCs is shown in matrix form according to the indicated color mapping. The specific pMHCs show little correlation whereas the sticky pMHCs are significantly correlated in their binding, suggesting that a shared cellular property (TCR or CD8 surface expression, expression of other HLA-interacting molecules, general level of activation) is jointly influencing their binding. Note that A11_AVF (and A11_IVT) show additional specific binding in donor 1, who is A*11:01 positive; the A*03:01 pMHC multimers appear non-specific regardless of donor HLA type.
