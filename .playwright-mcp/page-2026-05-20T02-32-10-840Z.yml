                - paragraph [ref=e794]: To assess the sensitivity of CoNGA’s graph-vs-graph algorithm in detecting a known GEX/TCR correlation, we created artificial datasets by subsampling the MAIT cell clonotypes (iNKT cell clonotypes in mouse) down to specified levels within the context of five datasets in which those clonotypes could be clearly identified both as a distinct GEX cluster and by virtue of their invariant TCR sequences. (a) The fraction of MAIT or iNKT clonotypes recovered as CoNGA hits (y-axis) is plotted against the frequency to which these clonotypes were downsampled in the dataset. (b) The fraction of recovered clonotypes is plotted against the absolute number of downsampled clonotypes present in the dataset. Recovery rate appears to depend more strongly on the number of downsampled clonotypes than their fraction in the total dataset.
