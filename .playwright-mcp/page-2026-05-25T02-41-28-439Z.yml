                      - paragraph [ref=e896]: (B) Each point represents a TCR-mem decile, plotted according to its association with positive selection in the thymus (dataset 6, x axis) and its association with transitioning from naive to memory in the periphery (dataset 3, y axis). Data are represented as odds ratio ± 95% confidence interval. ORs and 95% CIs are estimated via mixed-effects logistic regression.
                      - paragraph [ref=e897]: (C) Heatmap of SP proportion for each combination of TCR-mem score decile and number of TCR nucleotide insertions in dataset 6.
                      - paragraph [ref=e898]:
                        - text: (D) Dataset 6 (prenatal thymic) T cells with canonical MAIT cell TCRs (colored yellow,
                        - emphasis [ref=e899]: TRAV1–2
                        - text: and select
