                    - paragraph [ref=e764]: List of TCR sequences used in transduction experiments.
                  - paragraph [ref=e765]:
                    - text: Each TCR sequence exhibited greater CD69 upregulation compared to baseline (fold change > 1), confirming specific reactivity to the MART-1 antigen. However, the extent of activation, quantified by the percentage of CD69
                    - superscript [ref=e766]: +
                    - text: cells compared to baseline, clearly tracked with the TCR-mem score (
                    - link "Figure 4C" [ref=e767] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ). Thus, the TCR sequence features that we have observed to differ between memory and naive cells
                    - emphasis [ref=e768]: in vivo
                    - text: appear to causally promote T cell activation
                    - emphasis [ref=e769]: in vitro
                    - text: .
                  - paragraph [ref=e770]:
                    - text: To assess the stability of this finding, we examined the CD69 response at different antigen doses. We titrated the amount of MART-1-expressing antigen-presenting cells (APCs) and repeated the overnight co-culture. These titrations showed the expected dose-response relationship, which indeed escalated with increasing TCR-mem (
                    - link "Figure S6A" [ref=e771] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). At each antigen dose, increased TCR-mem scores corresponded to greater CD69 responses.
                  - paragraph [ref=e772]:
                    - text: We next assessed if altering individual residues to increase or decrease TCR-mem tracked with changes in activation. For this, we examined a different antigen, the “NLV-” peptide from the cytomegalovirus (CMV) antigen pp65 presented on HLA-A*02:01. We repeated the co-culture experiment with four TCR sequences that differ by one to four amino acids in CDR3α but are otherwise identical in sequence (
                    - link "Table 2" [ref=e773] [cursor=pointer]:
                      - /url: "#T2"
                    - text: ). These TCRs were synthetically engineered and previously shown to recognize the “NLV-” antigenic peptide (Schub et al.
                    - superscript [ref=e774]:
                      - link "44" [ref=e775] [cursor=pointer]:
                        - /url: "#R44"
                    - text: and Abdelfattah et al.
                    - superscript [ref=e776]:
                      - link "45" [ref=e777] [cursor=pointer]:
                        - /url: "#R45"
                    - text: ). As in the MART-1 experiments, we saw that each incremental gain in TCR-mem induced a greater fold change in activation (
                    - link "Figures 4D" [ref=e778] [cursor=pointer]:
                      - /url: "#F4"
                    - text: and
                    - link "S6B" [ref=e779] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Thus, our TCR-mem metric identifies replicable differences in immune reactivity between TCR sequences, even when sequence differences are as minor as one CDR3α amino acid.
                  - paragraph [ref=e780]:
                    - text: To extend our analyses beyond these two HLA-A*02:01 antigens, we examined single-cell profiling data
                    - superscript [ref=e781]:
                      - link "23" [ref=e782] [cursor=pointer]:
                        - /url: "#R23"
                    - text: (dataset 5,
                    - link "Table 1" [ref=e783] [cursor=pointer]:
                      - /url: "#T1"
                    - text: ) with 44 Dextramers, including HLA-A*02:01, HLA-B*07:02, and HLA-B*35:01. Briefly, 80 million CD8
                    - superscript [ref=e784]: +
                    - text: T cells from the peripheral blood of four human donors were exposed to 44 pMHC-bar-coded Dextramers. Multimodal sequencing then assayed the αβTCR sequence, transcriptome-wide expression, and pMHC Dextramer counts for each Dextramer-positive cell. Using Symphony and k-nearest neighbors, we assigned T cell states based on our multimodal T cell reference (
                    - link "Figure 4E" [ref=e785] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ).
                  - paragraph [ref=e786]:
                    - text: Following custom normalization of Dextramer Unique Molecular Identifier (UMI) counts (
                    - link "Figures S7A" [ref=e787] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: –
                    - link "S7D" [ref=e788] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ;
                    - link "STAR Methods" [ref=e789] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ), we observed a mixture of transcriptional states within each antigen-specific population (
                    - link "Figure S7E" [ref=e790] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). This transcriptional heterogeneity is consistent with other tetramer-sorted single-cell RNA sequencing (scRNA-seq) studies,
                    - superscript [ref=e791]:
                      - link "46" [ref=e792] [cursor=pointer]:
                        - /url: "#R46"
                      - text: –
                      - link "48" [ref=e793] [cursor=pointer]:
                        - /url: "#R48"
                    - text: demonstrating that T cells with the same antigen specificity vary in transcriptional phenotype. We wondered if TCR-mem helped to explain naive versus memory phenotypes within each antigen-specific population.
                  - paragraph [ref=e794]:
                    - text: Within each antigen-specific population, we tested the association between TCR-mem and memory state using a single cell per TCR clone (
                    - link "STAR Methods" [ref=e795] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). Consistent with our TCR transduction experiments, we observed
                    - emphasis [ref=e796]: β
                    - text: "> 0 for the majority of antigens (19/29), including seven antigen-specific populations with a nominally significant (one-tailed"
                    - emphasis [ref=e797]: p
                    - text: < 0.05) result (
                    - link "Table S7" [ref=e798] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). For example, among T cells recognizing IPSINVHHY presented on HLA-B*35:01, memory T cells bore TCRs with significantly higher TCR-mem scores (logistic regression
                    - emphasis [ref=e799]: β
                    - subscript [ref=e800]:
                      - emphasis [ref=e801]: TCR-mem
                    - text: = 0.36,
                    - emphasis [ref=e802]: p
                    - text: = 0.02).
                  - paragraph [ref=e803]:
                    - text: Given a lack of statistical power within each antigen-specific population (
                    - link "Figure S7F" [ref=e804] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ), we conducted a meta-analysis across antigen-specific populations. We observed a significant effect of TCR-mem on memory state, adjusted for antigen specificity (
                    - link "Figures 4F" [ref=e805] [cursor=pointer]:
                      - /url: "#F4"
                    - text: and
                    - link "S7G" [ref=e806] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ", logistic regression"
                    - emphasis [ref=e807]: β
                    - subscript [ref=e808]:
                      - emphasis [ref=e809]: TCR-mem
                    - text: = 0.11,
                    - emphasis [ref=e810]: p
                    - text: = 0.002;
                    - link "STAR Methods" [ref=e811] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). We observed minimal evidence for a difference in
                    - emphasis [ref=e812]: β
                    - subscript [ref=e813]:
                      - emphasis [ref=e814]: TCR-mem
                    - text: before and after adjusting for antigen specificity (heterogeneity
                    - emphasis [ref=e815]: p
                    - text: = 0.45) and minimal heterogeneity in
                    - emphasis [ref=e816]: β
                    - subscript [ref=e817]:
                      - emphasis [ref=e818]: TCR-mem
                    - text: across antigen-specific populations (
                    - emphasis [ref=e819]: I
                    - superscript [ref=e820]:
                      - emphasis [ref=e821]: "2"
                    - text: = 29.2%,
                    - emphasis [ref=e822]: H
                    - superscript [ref=e823]:
                      - emphasis [ref=e824]: "2"
                    - text: = 1.41
                    - emphasis [ref=e825]: ", Q"
                    - text: = 39.6
                    - emphasis [ref=e826]: ", p"
                    - text: = 0.07). TCR-mem associations hold after adjusting for Dextramer staining intensity (
                    - link "STAR Methods" [ref=e827] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ) as a proxy for TCR-pMHC affinity, which is thought to contribute to memory T cell development.
                    - superscript [ref=e828]:
                      - link "49" [ref=e829] [cursor=pointer]:
                        - /url: "#R49"
                    - text: These results suggest that TCR-mem sequence features predispose pMHC recognition in general, regardless of the cognate antigen.
                - generic [ref=e830]:
                  - heading "TCR-mem is distinct from antigen binding affinity" [level=3] [ref=e831]
                  - paragraph [ref=e832]:
                    - text: While TCR-mem is a property of the TCR sequence alone, binding affinity is a property of a TCR and antigen pair. For a given TCR sequence, binding affinity varies widely with choice of antigen. For example, TCR 1E6
                    - superscript [ref=e833]:
                      - link "50" [ref=e834] [cursor=pointer]:
                        - /url: "#R50"
                    - text: "exhibits approximately eight times greater binding affinity to RQFGPDWIVA-HLA-A*02 compared to ALWGPDPAAA-HLA-A*02 (buried surface area: 32,593.7 compared to 3,956.5 Å"
                    - superscript [ref=e835]: "2"
                    - text: ", PDBePISA). Thus, we did not expect TCR-mem to correspond to binding affinity for any particular antigen."
                  - paragraph [ref=e836]:
                    - text: To assess whether TCR-mem corresponds to TCR-pMHC binding affinity, we (1) conducted tetramer dilution experiments, (2) examined published micropipette adhesion data, and (3) computed buried surface areas in crystal structures. First, we stained each of our four MART-1-specific Jurkat populations with increasing concentrations of MART-1 tetramer (
                    - link "Figure S6C" [ref=e837] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). We approximated each TCR’s affinity to the MART-1 tetramer with EC
                    - subscript [ref=e838]: "5"
                    - text: ", the tetramer concentration at which 5% of Jurkat cells stain positively for tetramer. This 5% threshold allowed us to learn dose-response relationships without inducing tetramer aggregation, extrapolating beyond the observed measurements, or generating false positives from negative control tetramers ("
                    - link "Figure S6D" [ref=e839] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). EC
                    - subscript [ref=e840]: "5"
                    - text: measurements for the MART-reactive TCRs did not reveal a clear relationship between TCR-mem and binding affinity (
                    - link "Figure S6E" [ref=e841] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ).
                  - paragraph [ref=e842]:
                    - text: Given the potential limitations of tetramers,
                    - superscript [ref=e843]:
                      - link "51" [ref=e844] [cursor=pointer]:
                        - /url: "#R51"
                      - text: ","
                      - link "52" [ref=e845] [cursor=pointer]:
                        - /url: "#R52"
                    - text: we next analyzed data from a micropipette adhesion assay that simultaneously measures two-dimensional (2D) TCR affinity and TCR sequence (iTAST).
                    - superscript [ref=e846]:
                      - link "53" [ref=e847] [cursor=pointer]:
                        - /url: "#R53"
                    - text: Compared to tetramers, micropipette adhesion assays are better able to detect low-affinity interactions, and better correspond to gold-standard surface plasmon resonance (SPR) affinity measurements.
                    - superscript [ref=e848]:
                      - link "51" [ref=e849] [cursor=pointer]:
                        - /url: "#R51"
                      - text: ","
                      - link "53" [ref=e850] [cursor=pointer]:
                        - /url: "#R53"
                    - text: Moreover, iTAST enables the study of receptors and ligands in their native cell membrane context, without the possible confound of TCR transduction rate. The published iTAST dataset
                    - superscript [ref=e851]:
                      - link "53" [ref=e852] [cursor=pointer]:
                        - /url: "#R53"
                    - text: includes 33 αβ-paired TCRs that bind the hepatitis C virus (HCV) antigen KLVALGINAV complexed with HLA-A*02. We calculated TCR-mem scores for these 33 TCR sequences and again observed no clear relationship between TCR-mem score and binding affinity (
                    - emphasis [ref=e853]: R
                    - text: = −0.1;
                    - link "Figure S6F" [ref=e854] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ).
                  - paragraph [ref=e855]:
                    - text: Third, we analyzed crystal structures of αβTCRs complexed with class I MHC from the Protein Data Bank (PDB). Following quality control, we obtained 138 structures, corresponding to 86 unique epitopes and 17 unique class I HLA alleles. We used PDBePISA to estimate the amount of surface area buried between the TCR and pMHC, a known proxy for binding affinity.
                    - superscript [ref=e856]:
                      - link "54" [ref=e857] [cursor=pointer]:
                        - /url: "#R54"
                    - text: We observed no significant relationship between TCR-mem and binding affinity (
                    - emphasis [ref=e858]: R
                    - text: = 0.009;
                    - link "Figure S6G" [ref=e859] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Thus, three lines of evidence (
                    - link "Figures S6E" [ref=e860] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: –
                    - link "S6G" [ref=e861] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ) indicate minimal correspondence between TCR-mem and binding affinity. TCR-mem appears to capture a TCR characteristic that is distinct from binding affinity yet reliably promotes T cell activation. Investigators have found the relationship between TCR-pMHC binding and T cell activation to be complex.
                    - superscript [ref=e862]:
                      - link "55" [ref=e863] [cursor=pointer]:
                        - /url: "#R55"
                      - text: ","
                      - link "56" [ref=e864] [cursor=pointer]:
                        - /url: "#R56"
                - generic [ref=e865]:
                  - heading "Thymic selection pressures on the TCR sequence continue in the periphery" [level=3] [ref=e866]
                  - paragraph [ref=e867]:
                    - text: Given the consistent association of TCR-mem to memory state across antigenic peptides, we hypothesized that TCR-mem reflects reactivity to the underlying MHC(-like) molecule. Specifically, to promote recognition of many different pMHCs, such reactivity would be focused on elements of MHC that are conserved across MHC genes and alleles. This TCR property, referred to as “generic MHC reactivity,” has been theorized based on thymic development in TCR-transgenic mice.
                    - superscript [ref=e868]:
                      - link "57" [ref=e869] [cursor=pointer]:
                        - /url: "#R57"
                  - paragraph [ref=e870]:
                    - text: If TCR-mem reflects generic MHC reactivity, then TCR-mem sequence features should also help to explain which T cells survive thymic positive selection. Only T cells with a sufficient signaling response to pMHC survive thymic positive selection, which is marked by progression from a double-positive (DP) phenotype to a single-positive (SP) phenotype. Thus, if TCR-mem reflects generic MHC reactivity, then SP T cells should have higher TCR-mem compared to DP T cells, 90%
                    - superscript [ref=e871]:
                      - link "2" [ref=e872] [cursor=pointer]:
                        - /url: "#R2"
                    - text: of which never progress to the SP stage.
                  - paragraph [ref=e873]:
                    - text: Thus, we compared TCR-mem scores between SP and DP prenatal T cells (14,584 cells, dataset 6,
                    - link "Table 1" [ref=e874] [cursor=pointer]:
                      - /url: "#T1"
                    - text: ;
                    - link "STAR Methods" [ref=e875] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). TCR-mem was designed to describe differences between naive and memory TCRs in the periphery. We observed, however, that the same TCR sequence weighting scheme also described differences between DP and SP TCRs (
                    - link "Figure 5A" [ref=e876] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ","
                    - emphasis [ref=e877]: β
                    - subscript [ref=e878]:
                      - emphasis [ref=e879]: TCR-mem
                    - text: = 0.14,
                    - emphasis [ref=e880]: p
                    - text: = 1.3 × 10
                    - superscript [ref=e881]: −7
                    - text: ;
                    - link "Table S4" [ref=e882] [cursor=pointer]:
                      - /url: "#SD4"
                    - text: ). Strikingly, the TCR-mem difference between SP and DP thymic T cells was statistically indistinguishable from the TCR-mem difference between memory and naive peripheral T cells (heterogeneity
                    - emphasis [ref=e883]: p
                    - text: = 0.86). Thus, TCR differences between peripheral naive and memory T cells appear to echo TCR filtering by thymic positive selection (
                    - link "Figure 5B" [ref=e884] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ). The influence of TCR-mem persists in the absence of foreign and peripheral antigens, suggesting that TCR-mem reflects generic pMHC reactivity. While thymic selection imposes a minimum threshold for pMHC reactivity, TCRs that survive this threshold by a wider margin appear more likely to reach a memory T cell state in the periphery.
                  - figure [ref=e885]:
                    - heading "Figure 5. Thymic selection pressures on the TCR sequence continue in the periphery." [level=4] [ref=e886]
                    - paragraph [ref=e887]:
                      - img "Figure 5." [ref=e888]
