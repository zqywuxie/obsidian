                  - paragraph [ref=e918]:
                    - text: An alternative possibility we considered is that higher TCR-mem T cells had developed earlier in life and therefore accrued more opportunities to transition their transcriptional state. This time-related confound would require systematic shifts in V(D)J recombination with human age. However, we observed no relationship between age and TCR-mem (
                    - link "Figure S6H" [ref=e919] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ).
                  - paragraph [ref=e920]:
                    - text: Prenatal TCR sequences from dataset 6 allowed us to further extend our age-related line of inquiry. Some prenatal T cells lack
                    - emphasis [ref=e921]: DNTT
                    - text: expression, precluding non-templated insertion of TCR nucleotides and resulting in systemically shorter TCR sequences.
                    - superscript [ref=e922]:
                      - link "58" [ref=e923] [cursor=pointer]:
                        - /url: "#R58"
                    - text: To identify these age-related TCRs, we applied IGoR
                    - superscript [ref=e924]:
                      - link "59" [ref=e925] [cursor=pointer]:
                        - /url: "#R59"
                    - text: to infer the number of nucleotide insertions in each thymic TCR. We observed that additional nucleotide insertions corresponded to a decrease in the odds of thymic positive selection, but this effect did not account for the effect of TCR-mem (
                    - link "Figure 5C" [ref=e926] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ). Controlling for the number of nucleotide insertions, TCR-mem actually demonstrated a stronger effect on the odds of positive selection (conditional
                    - emphasis [ref=e927]: β
                    - subscript [ref=e928]:
                      - emphasis [ref=e929]: TCR-mem
                    - text: = 0.22, 95% CI = [0.13–0.30],
                    - emphasis [ref=e930]: p
                    - text: = 3.8 × 10
                    - superscript [ref=e931]: −7
                    - text: ", compared to unconditional"
                    - emphasis [ref=e932]: β
                    - subscript [ref=e933]:
                      - emphasis [ref=e934]: TCR-mem
                    - text: = 0.14, 95% CI = [0.09–0.19],
                    - emphasis [ref=e935]: p
                    - text: = 1.3 × 10
                    - superscript [ref=e936]: −7
                    - text: ;
                    - link "Table S4" [ref=e937] [cursor=pointer]:
                      - /url: "#SD4"
                    - text: ;
                    - link "STAR Methods" [ref=e938] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). Thus, TCR-mem associations are not explained by developmental time points.
                  - paragraph [ref=e939]:
                    - text: In contrast to TCR-mem, TCR-innate was not applicable to thymic data. Thymic T cells expressing canonical TCRs for MAIT cells and NKT cells had not yet reached the innate-like,
                    - emphasis [ref=e940]: PLZF
                    - superscript [ref=e941]: high
                    - text: transcriptional fate (
                    - link "Figure 5D" [ref=e942] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ). This is consistent with previous reports showing that
                    - emphasis [ref=e943]: PLZF
                    - superscript [ref=e944]: high
                    - text: fate acquisition is dependent on peripheral antigen recognition.
                    - superscript [ref=e945]:
                      - link "60" [ref=e946] [cursor=pointer]:
                        - /url: "#R60"
                      - text: –
                      - link "62" [ref=e947] [cursor=pointer]:
                        - /url: "#R62"
                    - text: TCR-reg and TCR-CD8, however, were applicable to thymic data (
                    - link "Figures 5E" [ref=e948] [cursor=pointer]:
                      - /url: "#F5"
                    - text: and
                    - link "5F" [ref=e949] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ","
                    - emphasis [ref=e950]: β
                    - subscript [ref=e951]:
                      - emphasis [ref=e952]: TCR-CD8
                    - text: = 0.78,
                    - emphasis [ref=e953]: p
                    - text: = 4.3 × 10
                    - superscript [ref=e954]: −97
                    - text: ;
                    - emphasis [ref=e955]: β
                    - subscript [ref=e956]:
                      - emphasis [ref=e957]: TCR-reg
                    - text: = 0.14,
                    - emphasis [ref=e958]: p
                    - text: = 2.8 × 10
                    - superscript [ref=e959]: −5
                    - text: ;
                    - link "Table S4" [ref=e960] [cursor=pointer]:
                      - /url: "#SD4"
                    - text: ;
                    - link "STAR Methods" [ref=e961] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ), indicating that these associations between TCR sequence and T cell state are not dependent on peripheral antigen recognition. Evidently, TCR sequence features shape T cell differentiation outcomes in both the thymus and periphery, influencing which T cells are able to generate an effective immune response.
              - generic [ref=e962]:
                - heading "DISCUSSION" [level=2] [ref=e963]: DISCUSSION
                - paragraph [ref=e964]: In this study, we define four TCR scoring functions that estimate the TCR’s contribution to four T cell fates. These scoring functions are robust across numerous genetic and clinical contexts. Even among T cells that recognize the same antigen, these TCR scores help to explain variation in T cell states.
                - paragraph [ref=e965]:
                  - text: Our CCA-based quantitative approach allows us to understand the relative strength of previously observed connection between TCR sequence and T cell state. The most deterministic relationship belongs to MAIT cells. Structural studies have shown that MHC-like molecule MR1 buries small metabolite antigens so that they do not contact TCR.
                  - superscript [ref=e966]:
                    - link "63" [ref=e967] [cursor=pointer]:
                      - /url: "#R63"
                    - text: ","
                    - link "64" [ref=e968] [cursor=pointer]:
                      - /url: "#R64"
                  - text: Consequently, MAIT cell TCRs need only recognize MR1, which marks a highly distinct transcriptional population of
                  - emphasis [ref=e969]: PLZF
                  - superscript [ref=e970]: high
                  - text: ", innate-like T cells. This tight link from αβ TCR sequence to T cell fate is unusual; were there other relationships of similar magnitude, we believe that our model would have identified them."
                - paragraph [ref=e971]:
                  - text: We observe elevated CDR3 hydrophobicity in KIR+
                  - emphasis [ref=e972]: HELIOS
                  - text: +CD8 T cells, consistent with a previous report.
                  - superscript [ref=e973]:
                    - link "18" [ref=e974] [cursor=pointer]:
                      - /url: "#R18"
                  - text: Schattgen et al.
                  - superscript [ref=e975]:
                    - link "18" [ref=e976] [cursor=pointer]:
                      - /url: "#R18"
                  - text: hypothesized that this CD8 population may be “MHC-independent, noncanonical, or self-specific.” Our framework unifies this observation with CD4 investigations
                  - superscript [ref=e977]:
                    - link "10" [ref=e978] [cursor=pointer]:
                      - /url: "#R10"
                    - text: ","
                    - link "16" [ref=e979] [cursor=pointer]:
                      - /url: "#R16"
                  - text: ": KIR"
                  - superscript [ref=e980]: +
                  - text: CD8
                  - superscript [ref=e981]: +
                  - text: T cells, which may functionally represent human CD8 T
                  - subscript [ref=e982]: reg
                  - text: cells,
                  - superscript [ref=e983]:
                    - link "36" [ref=e984] [cursor=pointer]:
                      - /url: "#R36"
                  - text: appear to resemble CD4 T
                  - subscript [ref=e985]: reg
                  - text: cells in terms of TCR sequence. In general, hydrophobic and aromatic (F, L, I, C, Y, W) junctional CDR3 residues (both α and β) may increase a T cell’s likelihood of recognizing self-antigens, driving
                  - emphasis [ref=e986]: FOXP3
                  - text: T
                  - subscript [ref=e987]: reg
                  - text: cell fate in the case of CD4 co-receptors and KIR+
                  - emphasis [ref=e988]: HELIOS
                  - text: + fate in the case of CD8 co-receptors.
                - paragraph [ref=e989]:
                  - text: We take particular interest in TCR-mem because it describes TCR sequence features that are generally advantageous for reaching a memory T cell state. Our own tetramer dilution experiments, external micropipette adhesion data, and buried surface area calculations each indicate that TCR-mem is distinct from antigen binding affinity. Rather, our TCR-mem scoring function can distinguish which TCR sequences recognizing a common antigen are more likely to activate. We have shown this with respect to endogenous TCR sequences recognizing a self-antigen (MART-1) and engineered TCR sequences recognizing a viral antigen (pp65). Increased TCR-mem also corresponds to positive selection in the thymus, extending previous observations that T cells with high self-reactivity (CD5
                  - superscript [ref=e990]: high
                  - text: ) also have higher reactivity to foreign antigens.
                  - superscript [ref=e991]:
                    - link "65" [ref=e992] [cursor=pointer]:
                      - /url: "#R65"
                    - text: –
                    - link "67" [ref=e993] [cursor=pointer]:
                      - /url: "#R67"
                  - text: With TCR-mem, we have identified a common set of TCR sequence features that promote both central and peripheral
                  - superscript [ref=e994]:
                    - link "68" [ref=e995] [cursor=pointer]:
                      - /url: "#R68"
                  - text: selection of the T cell repertoire.
                - paragraph [ref=e996]: "It is now clear that a TCR sequence conveys two types of information: transcriptional fate bias and antigen specificity. Both types of information may be crucial to the immune response in autoimmunity, cancer, and infection. TCR features may play a particularly important role in influencing T cell fate for T cells that recognize autoantigens, which ought to be relatively anergic. The therapeutic design of TCRs may need to consider not only recognition of the antigenic target but also differentiation into an effective T cell state."
                - generic [ref=e997]:
                  - heading "Limitations of the study" [level=3] [ref=e998]
                  - paragraph [ref=e999]:
                    - text: There are several limitations to our study. First, our study is restricted to αβ TCR sequences by virtue of the standard custom primer set for V(D)J amplification. The usage of gamma-delta, rather than αβ, TCR genes, has clear effects on the transcriptional state
                    - superscript [ref=e1000]:
                      - link "69" [ref=e1001] [cursor=pointer]:
                        - /url: "#R69"
                    - text: that merit further study. Second, our approach to defining a standard set of TCR sequence features excluded T cells in which more than one α or one more than one β chain was detected. We expect that dual-α chain T cells follow similar relationships between the TCR sequence and T cell state, but demonstrating this would require separate analysis approaches. Lastly, our TCR scoring functions are consistent across individuals and antigens, but they are insufficient to accurately classify T cell states. After all, the TCR sequence is only one minor influence on the transcriptional state of a given T cell.
