                      - paragraph [ref=e624]: "(B) Schematic of our experimental validation using either MART-1 or NLV-reactive TCRs: TCR-knockout Jurkat cells were transduced with four antigen-reactive TCRs from the Dextramer dataset, co-cultured with antigen-presenting cells (APCs) expressing the antigen of interest, and stained for CD69 to screen for cellular activation."
                      - paragraph [ref=e625]:
                        - text: (C) For each MART-reactive TCR sequence, we compared its TCR-mem score (x axis) to the fold change in the frequency of CD69
                        - superscript [ref=e626]: +
                        - text: Jurkat cells (y axis) following exposure to antigen, compared to background CD69
                        - superscript [ref=e627]: +
                        - text: frequency in the absence of the MART-1 antigen. Measurements are in triplicate.
                      - paragraph [ref=e628]:
                        - text: (D) For each NLV-reactive TCR sequence, we compared its TCR-mem score (x axis) to the fold change in the frequency of CD69
                        - superscript [ref=e629]: +
                        - text: Jurkat cells (y axis) following exposure to antigen, compared to background CD69
                        - superscript [ref=e630]: +
                        - text: frequency in the absence of the NLV- antigen. Each measurement was done in triplicate.
                      - paragraph [ref=e631]: (E) T cells from Dextramer-labeled dataset (dataset 5) projected onto UMAP coordinates of a low-dimensional transcriptional space defined by dataset 1, with strong influence from Total-seq antibody counts for CD4, CD8, CD45RO, and CD45RA. Four T cells, with TCR sequences we refer to as MART-a, MART-b, MART-c, and MART-d, respectively, are labeled.
                      - paragraph [ref=e632]:
                        - text: (F) Histogram of 29
                        - emphasis [ref=e633]: β
                        - subscript [ref=e634]:
