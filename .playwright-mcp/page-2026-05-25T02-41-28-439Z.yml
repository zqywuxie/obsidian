          - region "Article content" [ref=e133]:
            - generic [ref=e134]:
              - generic [ref=e135]:
                - heading "SUMMARY" [level=2] [ref=e136]: SUMMARY
                - paragraph [ref=e137]: The amino acid sequence of the T cell receptor (TCR) varies between T cells of an individual’s immune system. Particular TCR residues nearly guarantee mucosal-associated invariant T (MAIT) and natural killer T (NKT) cell transcriptional fates. To define how the TCR sequence affects T cell fates, we analyze the paired αβTCR sequence and transcriptome of 961,531 single cells. We find that hydrophobic complementarity-determining region (CDR)3 residues promote regulatory T cell fates in both the CD8 and CD4 lineages. Most strikingly, we find a set of TCR sequence features that promote the T cell transition from naive to memory. We quantify the extent of these features through our TCR scoring function “TCR-mem.” Using TCR transduction experiments, we demonstrate that increased TCR-mem promotes T cell activation, even among T cells that recognize the same antigen. Our results reveal a common set of TCR sequence features that enable T cell activation and immunological memory.
              - generic [ref=e138]:
                - heading "Graphical Abstract" [level=2] [ref=e139]: Graphical Abstract
                - paragraph [ref=e140]:
                  - img "graphic file with name nihms-2046529-f0001.jpg" [ref=e141]
              - generic [ref=e142]:
                - heading "In brief" [level=2] [ref=e143]: In brief
                - paragraph [ref=e144]: The human immune system contains a vast repertoire of somatically recombined T cell receptor (TCR) sequences. To connect TCR sequence to T cell function, Lagattuta et al. analyze the paired αβTCR and transcriptome of >960,000 T cells. They identify TCR amino acids that promote T cell activation and immunological memory.
              - generic [ref=e145]:
                - heading "INTRODUCTION" [level=2] [ref=e146]: INTRODUCTION
                - paragraph [ref=e147]:
                  - text: T cells are critical lymphocytes of the adaptive immune system. Early in T cell development, stochastic genome rearrangement on chromosomes 7 and 14 defines each T cell with its own T cell receptor (TCR).
                  - superscript [ref=e148]:
                    - link "1" [ref=e149] [cursor=pointer]:
                      - /url: "#R1"
                  - text: In the thymus and periphery, T cell differentiation depends critically on TCR activation.
                  - superscript [ref=e150]:
                    - link "2" [ref=e151] [cursor=pointer]:
                      - /url: "#R2"
                    - text: –
                    - link "8" [ref=e152] [cursor=pointer]:
                      - /url: "#R8"
                  - text: One prominent example is the
                  - emphasis [ref=e153]: PLZF
                  - superscript [ref=e154]: high
                  - text: ", innate-like transcriptional fate, which is nearly guaranteed when V(D)J recombination selects"
                  - emphasis [ref=e155]: TRAV1–2
                  - text: and
                  - emphasis [ref=e156]: TRAJ33
                  - text: ","
                  - emphasis [ref=e157]: TRAJ20
                  - text: ", or"
                  - emphasis [ref=e158]: TRAJ12
                  - text: .
                  - superscript [ref=e159]:
                    - link "9" [ref=e160] [cursor=pointer]:
                      - /url: "#R9"
                - paragraph [ref=e161]:
                  - text: Given the central role of the TCR in T cell activation and differentiation, we
                  - superscript [ref=e162]:
                    - link "10" [ref=e163] [cursor=pointer]:
                      - /url: "#R10"
                  - text: and others
                  - superscript [ref=e164]:
                    - link "11" [ref=e165] [cursor=pointer]:
                      - /url: "#R11"
                    - text: –
                    - link "16" [ref=e166] [cursor=pointer]:
                      - /url: "#R16"
                  - text: have identified differences in TCR sequences (e.g., hydrophobicity, V gene selection) using bulk sequencing of flow-sorted T cell populations. However, bulk sequencing obscures the pairing of TCR α and β chains. Furthermore, flow sorting requires predefining T cell states for investigation and may miss important transcriptional heterogeneity of T cells.
                - paragraph [ref=e167]:
                  - text: Now, single-cell sequencing assays enable joint profiling of the TCR and transcriptome. In contrast to bulk sequencing methods, single-cell technology anchors α and β TCR reads to individual cells, allowing reconstruction of the full TCR α/β heterodimer. Moreover, genome-wide transcriptional analysis can comprehensively define T cell states. Early methods to jointly analyze TCR and transcriptional data
                  - superscript [ref=e168]:
                    - link "17" [ref=e169] [cursor=pointer]:
                      - /url: "#R17"
                    - text: ","
                    - link "18" [ref=e170] [cursor=pointer]:
                      - /url: "#R18"
                  - text: have suggested that TCR sequence similarity may correspond to similarity in transcriptional state.
                - paragraph [ref=e171]:
                  - text: To statistically define the relationship between the TCR sequence and T cell state, we analyze 961,531 T cells with quality-controlled αβTCR and transcriptional profiling at single-cell resolution from seven published datasets (
                  - link "Table 1" [ref=e172] [cursor=pointer]:
                    - /url: "#T1"
                  - text: ). Rather than pre-specifying transcriptional states, we use paired dimensionality reduction to uncover relevant transcriptional states in an unbiased fashion. Our results define four TCR scoring functions that quantify the transcriptional fate predisposition conferred by the TCR. We apply these scoring functions to better understand thymic selection as well as cell state variation within antigen-specific T cell populations.
