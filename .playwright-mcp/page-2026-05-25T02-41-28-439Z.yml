                        - text: estimates for the 29 Dextramer-specific populations. Data are represented as log odds ratio ± 95% confidence interval.
                        - emphasis [ref=e636]: p
                        - text: value is computed by random effects meta-analysis,
                        - emphasis [ref=e637]: "n"
                        - text: = 29
                        - emphasis [ref=e638]: β
