              - generic [ref=e1022]:
                - heading "STAR★METHODS" [level=2] [ref=e1023]: STAR★METHODS
                - generic [ref=e1024]:
                  - heading "EXPERIMENTAL MODEL AND STUDY PARTICIPANT DETAILS" [level=3] [ref=e1025]
                  - generic [ref=e1026]:
                    - heading "Human samples" [level=4] [ref=e1027]
                    - paragraph [ref=e1028]:
                      - text: All human samples analyzed in this study were downloaded from online repositories from prior publications (
                      - link "Table S1" [ref=e1029] [cursor=pointer]:
                        - /url: "#SD1"
                      - text: ), which list demographic characteristics. Sample sizes are listed in
                      - link "Table 1" [ref=e1030] [cursor=pointer]:
                        - /url: "#T1"
                      - text: . Human samples were not divided into experimental groups. There was minimal influence of sex on the results of the study (
                      - link "Table S4" [ref=e1031] [cursor=pointer]:
                        - /url: "#SD4"
                      - text: ).
                  - generic [ref=e1032]:
                    - heading "Cell lines" [level=4] [ref=e1033]
                    - paragraph [ref=e1034]:
                      - text: TCRβ-null Jurkat (J.RT3-T3.5, male) and HEK-293T (CRL-3216, female) cell lines were obtained from the American Type Culture Collection (ATCC). HEK-293T cells were engineered to express HLA-A2 and authenticated by flow cytometry as described previously.
                      - superscript [ref=e1035]:
                        - link "70" [ref=e1036] [cursor=pointer]:
                          - /url: "#R70"
                      - text: TCRβ-null Jurkat cells were authenticated by flow cytometry, verifying that they do not express TCR at the cell surface. TCRβ-null Jurkat cells were cultured in RPMI (Gibco, A10491-01) with 10% FBS (HyClone) and 1% penicillin-streptomycin (Invitrogen, 15140-122). HEK-293T cells were cultured in DMEM (Gibco, 11995065) with 10% FBS (HyClone) and 1% penicillin-streptomycin (Invitrogen, 15140- 122). Cells were regularly tested for mycoplasma; results were always negative.
                - generic [ref=e1037]:
                  - heading "METHOD DETAILS" [level=3] [ref=e1038]
                  - generic [ref=e1039]:
                    - heading "Generation of antigen-specific Jurkat cell lines" [level=4] [ref=e1040]
                    - paragraph [ref=e1041]: TCRβ-null Jurkat cells were spinfected with lentivirus at varying concentrations to achieve a multiplicity of infection (MOI) < 1 and introduced with TCRs of interest. Each TCR was encoded by a single construct containing the mouse TCR constant region. A total of 1 × 106 cells were spun with 8 μg mL–1 polybrene (Millipore, TR-1003-G) and lentivirus for 30 min at 800g in 12-well plates. Cells were incubated at 37°C and the virus was washed off after 24 h. After spinfection for 48 h, surface expression of TCR constructs was confirmed by flow cytometry.
                  - generic [ref=e1042]:
                    - heading "Tetramer generation" [level=4] [ref=e1043]
                    - paragraph [ref=e1044]: The HLA-A*02:01 MART-1 and pp65 peptides were synthesized by Genscript and loaded onto APC QuickSwitch Quant HLA-A*02:01 tetramers (MBL International). Negative control tetramers were prepared with Tax peptide (LLFGYPVYV) and loaded onto PE QuickSwitch Quant HLA-A*0201 tetramers (MBL International).
                  - generic [ref=e1045]:
                    - heading "Endogenous antigen expression cocultures" [level=4] [ref=e1046]
                    - paragraph [ref=e1047]: Following 8–16-h incubation at 37°C, cells were washed twice with PBS supplemented with 2 mM EDTA (PBE) and 0.5% BSA. For endogenous antigen expression, 56-mer peptide fragments were reverse-translated and synthesized as gBlocks (IDT) with 5′ and 3′ BP recombination sites and cloned into pDONR221. Peptide antigens were subsequently cloned into pHAGE-CMV-Nflag-HA-DEST-IRES-Puro destination vectors using LR clonase (ThermoFisher Scientific Gateway Clonase).
                    - paragraph [ref=e1048]: "pp65 56-mer: RLKAESTVAPEEDTDEDSDNEIHNPAVFTWPPWQAGILARNLVPMVATVQSGARA*"
                    - paragraph [ref=e1049]: "MART-1 56-mer: MPREDAHFIYGYPKKGHGHSYTTAEEAAGIGILTVILGVLLLIGCWYCRRRNGYRA"
                  - generic [ref=e1050]:
                    - heading "Flow cytometry" [level=4] [ref=e1051]
                    - paragraph [ref=e1052]:
                      - text: All antibodies were purchased from BioLegend and were used at 1 μL per million cells. Cells were stained with antibodies for at least 30 min in PBE and then washed in PBE twice. Samples were acquired through the CytoFLEX (Beckman Coulter) flow cytometer and data were analyzed through FlowJo (version 5.0.0) software. When screening for Jurkat activation following coculture with 293T cells, Jurkat cells were sorted from 293T cells based on CD40 expression (APC anti-mouse CD40 clone 3/23), and then stained for CD69 expression (PE anti-human CD69, clone FN50). For tetramer dilution experiments, CD3
                      - superscript [ref=e1053]: high
                      - text: Jurkat cells (BV421 anti-human CD3, 300434) were isolated, and then stained for tetramer positive-control (APC QuickSwitch, MBL International) and tetramer negative-control (PE QuickSwitch, MBL International).
                - generic [ref=e1054]:
                  - heading "QUANTIFICATION AND STATISTICAL ANALYSIS" [level=3] [ref=e1055]
                  - paragraph [ref=e1056]: The details of each statistical test can be found in the corresponding figure legend.
                  - generic [ref=e1057]:
                    - heading "Sequencing read alignment" [level=4] [ref=e1058]
                    - paragraph [ref=e1059]: Sequencing data were deposited and downloaded as aligned sequencing reads (raw UMI counts for genes, ADTs, or TCR contigs) for Datasets 1–4, and Dataset 6. For TCRs in Dataset 4, we downloaded .fastqs from the European Nucleotide Archive (ENA). We used cellranger vdj version 5.0.1 to align reads to reference GRCh38 5.0.0.
                  - generic [ref=e1060]:
                    - heading "Quality control and normalization" [level=4] [ref=e1061]
                    - paragraph [ref=e1062]: For all single-cell datasets, we removed cells with UMIs for less than 500 genes and cells with greater than 10% of UMIs derived from mitochondrial genes. We then normalized UMIs for each gene in each cell to log(UMI counts per 10,000) and normalized UMIs for each surface protein in each cell via the centered-log-ratio (CLR) transformation.
                    - generic [ref=e1063]:
                      - heading "Unimodal dimensionality reduction" [level=5] [ref=e1064]
                      - paragraph [ref=e1065]:
                        - text: To identify clusters A1–A9, we applied a unimodal dimensionality reduction pipeline to Dataset 1, using mRNA information alone. After normalizing gene expression, we used the variance-stabilizing transformation (VST) to select the 200 most variable genes in each sample, excluding TCR genes. The union of variable genes across samples totaled 6358 genes. To conduct principal component analysis (PCA), we used R package “irlba” (v2.3.3) on normalized expression of these 6358 genes, each scaled to mean 0 variance 1. We then used the R package Harmony
                        - superscript [ref=e1066]:
                          - link "71" [ref=e1067] [cursor=pointer]:
                            - /url: "#R71"
                        - text: "(v1.0) to remove batch effects from the per-cell principal component scores. We applied Harmony to three batch variables: ‘scRNASeq_sample_ID’, ‘Institute’, and ‘Pool_ID.’ We used θ values 1, 0.5 and 0.5 for these batch variables, respectively. We used UMAP to visualize the resultant cell embedding in two dimensions, computed through the R package Symphony"
                        - superscript [ref=e1068]:
                          - link "72" [ref=e1069] [cursor=pointer]:
                            - /url: "#R72"
                        - text: "(v1.0). We built a shared-nearest-neighbor (SNN) graph of cells based on the first 20 batch-corrected gene expression PCs, using R package “singlecellmethods” (v0.1.0, parameters: prune_snn = 1/25, nn_k = 10, nn_eps = 0.5). To identify transcriptional clusters, we applied Louvain clustering to the SNN graph at multiple resolutions, through the"
                        - emphasis [ref=e1070]: RunModularityClustering
                        - text: function from the R package Seurat (v3.2.2). Clusters A1–A9 were identified by clustering resolution 0.5.
                    - generic [ref=e1071]:
                      - heading "Multimodal dimensionality reduction" [level=5] [ref=e1072]
                      - paragraph [ref=e1073]:
                        - text: To identify clusters B1–B9, we applied a multimodal dimensionality reduction pipeline
                        - superscript [ref=e1074]:
                          - link "27" [ref=e1075] [cursor=pointer]:
                            - /url: "#R27"
                        - text: "to Dataset 1, incorporating both mRNA and surface protein information. We used the VST to select the 100 most variable genes in each sample, excluding TCR genes. The union of variable genes across samples totaled 4423 genes. We applied Canonical Correlation Analysis (CCA) to paired mRNA and protein measurements, using the expression of these 4423 genes as input matrix 1 and the expression of 10 surface proteins as input matrix 2 (R package “CCA” v1.2.1). To emphasize traditional T cell populations, we selected TotalSeq antibodies for 10 surface proteins critical to distinguish between CD4, CD8, central memory (CM) and effector memory (EM) T cells: CD4, CD8, CD45RO, CD45A, CD197_CCR7, CD62L, CD27, CD11a, CX3CR1, and KLRG1. Input gene expression was log10CPK-normalized and scaled to mean 0 variance 1; input protein expression was CLR-normalized and scaled to mean 0 variance 1. As in our unimodal dimensionality reduction pipeline, we then removed batch effects from the per-cell mRNA-based canonical variate (CV) scores, constructed a UMAP and SNN graph based on the 10 batch-corrected CVs, and identified cell clusters. Clusters B1–B9 were identified through clustering at resolution 4.0, and collapsing clusters with similar marker expression ("
                        - link "Figures S2Q" [ref=e1076] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: and
                        - link "S2R" [ref=e1077] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: ).
                    - generic [ref=e1078]:
                      - heading "Standardizing T cell states across datasets" [level=5] [ref=e1079]
                      - paragraph [ref=e1080]:
                        - text: To annotate T cell states in a consistent manner across datasets, we conducted reference mapping with Symphony
                        - superscript [ref=e1081]:
                          - link "72" [ref=e1082] [cursor=pointer]:
                            - /url: "#R72"
                        - text: (v1.0). Our unimodal T cell state reference (
                        - link "Figure S1" [ref=e1083] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: ) and multimodal T cell state reference (
                        - link "Figure S2" [ref=e1084] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: ) were constructed from Dataset 1 (T cells in peripheral blood). To annotate T cell states in Datasets 2–5, we projected cells into these references. Symphony’s reference mapping includes correction for batch variables, which we specified for each dataset. For all datasets, we corrected for the individual’s donor ID. For Dataset 2, we additionally corrected for batch variables “Sample.type” and “PMID.” For Dataset 3, we additionally corrected for batch variable “Site.” For Dataset 4, we additionally corrected for batch variable “Chemistry,” and conducted Symphony mapping separately for each tissue.
                      - paragraph [ref=e1085]: For each projected cell, we used the R package “class” (v7.3.17) to identify the five nearest neighbor cells from Dataset 1. We transferred the majority cell state label among these five to the projected cell.
                      - paragraph [ref=e1086]:
                        - text: We did not transfer cell state annotations for Dataset 6, because prenatal thymic tissue includes progenitor T cell states not observed in peripheral blood. Instead, we used T cell state annotations provided by the authors.
                        - superscript [ref=e1087]:
                          - link "24" [ref=e1088] [cursor=pointer]:
                            - /url: "#R24"
                  - generic [ref=e1089]:
                    - heading "Quality control for TCR sequence data" [level=4] [ref=e1090]
                    - paragraph [ref=e1091]:
                      - text: TCR sequence data deposited for Dataset 2 included only cells with exactly one TCRα chain and exactly one TCRβ chain, with Vα, Jα, Vβ, and Jβ gene names resolved. In keeping with this quality control by Ren et al.,
                      - superscript [ref=e1092]:
                        - link "20" [ref=e1093] [cursor=pointer]:
                          - /url: "#R20"
                      - text: we filtered all other scRNAseq-TCR datasets to include only TCRs with exactly one TCRα chain, exactly one TCRβ chain, and Vα, Jα, Vβ, and Jβ gene names resolved. For analyses purely focused on cell state, such as dimensionality reduction and clustering, we did not apply TCR-based filtering.
                  - generic [ref=e1094]:
                    - heading "Defining TCR clonotypes" [level=4] [ref=e1095]
                    - paragraph [ref=e1096]:
                      - text: To define the TCR clonotype for each cell, we concatenated the IMGT Vα, Jα, Vβ, and Jβ gene names with the CDR3ɑ amino acid sequence and CDR3β amino acid sequence. To be considered a “TCR-twin,” TCRs from two different individuals were required to match exactly for each of these TCR components. To be considered part of the same expanded clone, TCRs had to match exactly for each of these TCR components, and be sampled from the same individual. We recognize that it is optimal to identify expanded clones by nucleotide rather than amino acid sequence, because different ancestral V(D)J nucleotide recombinations can converge to the same amino acid sequence. However, only amino acid sequences were made publicly available for the TCRα chain for Dataset 1. In practice, because amino acid convergence is rare, TCR clones are often identified via amino acid sequence.
                      - superscript [ref=e1097]:
                        - link "19" [ref=e1098] [cursor=pointer]:
                          - /url: "#R19"
                    - generic [ref=e1099]:
                      - heading "TCR twin analysis" [level=5] [ref=e1100]
                      - paragraph [ref=e1101]: To identify “TCR twins” in Dataset 1, we counted the number of individuals observed for each TCR clonotype. The vast majority of TCR clonotypes (234131/234265, 99.9%) were observed in only one individual from Dataset 1, and would be considered “private TCRs.” 134 TCR clonotypes were observed in more than one individual (“public TCRs”), and we analyzed the 115 TCR clonotypes that were observed in exactly two individuals.
                      - paragraph [ref=e1102]:
                        - text: We next assigned a transcriptional state to each TCR twin member. 115 TCR clonotypes, each observed in two individuals, implies 230 twin members. For 163/230 twin members (70%), we observed no evidence of clonal expansion (there was only one cell sampled from the individual with the TCR clonotype of interest), and we used the cluster identity of its single cell. For 37 twin members (16%), we observed clonal expansion within a single transcriptional cluster (resolution 0.5,
                        - link "Figure 1A" [ref=e1103] [cursor=pointer]:
                          - /url: "#F1"
                        - text: ), and we used this cluster to annotate the TCR twin member. For 30 twin members (13%), we observed clonal expansion across multiple clusters, and we used the transcriptional cluster that contained the greatest number of constituent cells.
                      - paragraph [ref=e1104]:
                        - text: We then counted how many of the 115 TCR twins were assigned the same transcriptional cluster in both individuals. To assess statistical significance, we conducted a binomial test with
                        - emphasis [ref=e1105]: "N"
                        - text: = 115 trials and
                        - emphasis [ref=e1106]: P
                        - subscript [ref=e1107]:
                          - emphasis [ref=e1108]: "null"
                        - text: = the probability of concordant transcriptional clusters by chance. To calculate
                        - emphasis [ref=e1109]: P
                        - subscript [ref=e1110]:
                          - emphasis [ref=e1111]: "null"
                        - text: ", we summed the probabilities of randomly drawing two observations with the same cluster assignment for each of the nine transcriptional clusters (A1–A9,"
                        - link "Figure 1A" [ref=e1112] [cursor=pointer]:
                          - /url: "#F1"
                        - text: ). For transcriptional cluster
                        - emphasis [ref=e1113]: j
                        - text: including
                        - emphasis [ref=e1114]: "n"
                        - subscript [ref=e1115]:
                          - emphasis [ref=e1116]: j
                        - text: "of the 230 T cells with twinned TCRs, this probability can be computed as:"
                      - table [ref=e1117]:
                        - rowgroup [ref=e1118]:
                          - row "(Equation 1)" [ref=e1119]:
                            - cell [ref=e1120]
                            - cell "(Equation 1)" [ref=e1121]
                      - paragraph [ref=e1122]:
                        - emphasis [ref=e1123]: P
                        - subscript [ref=e1124]:
                          - emphasis [ref=e1125]: "null"
                        - text: "can then be found by summation:"
                      - table [ref=e1126]:
                        - rowgroup [ref=e1127]:
                          - row "(Equation 2)" [ref=e1128]:
                            - cell [ref=e1129]
                            - cell "(Equation 2)" [ref=e1130]
                    - generic [ref=e1131]:
                      - heading "TCR featurization" [level=5] [ref=e1132]
                      - paragraph [ref=e1133]:
                        - text: Cellranger vdj output provides amino acid sequence for CDR3 regions, but IMGT gene names only for other regions of the TCR. To translate IMGT gene names into CDR1 and CDR2 amino acids, we downloaded amino acid sequences for each gene from
                        - link "External, opens in a new tab. https://www.imgt.org" [ref=e1134] [cursor=pointer]:
                          - /url: https://www.imgt.org
                        - text: .
                      - paragraph [ref=e1135]: We removed all TCR sequences for which the V gene is unresolved. To focus on functional TCRs, we removed V genes listed as pseudogenes in IMGT. We used TCR position numbers from IMGT to describe the location of each TCR amino acid. To maintain a tractable number of TCR positions, we consider only TCR sequences with CDR3a length ranging from 10 to 17 amino acids and CDR3b length ranging from 11 to 18 amino acids.
                      - paragraph [ref=e1136]:
                        - text: To convert each TCR amino acid into a vector of quantitative features, we translated each TCR amino acid into its five Atchley factors.
                        - superscript [ref=e1137]:
                          - link "30" [ref=e1138] [cursor=pointer]:
                            - /url: "#R30"
                        - text: This process results in 290 TCR features, extracted from the 58 TCR amino acid positions that comprise CDR1a, CDR2a, CDR3α, CDR1b, CDR2b, and CDR3b. We also computed the percentage of each CDR loop occupied by 19 of the 20 amino acids, excluding Glycine as a reference. We also included six TCR features corresponding to the length (in amino acids) of each of the CDR loops. Finally, for each pair of adjacent residues within a TCR chain, we multiplied each possible combination of the five Atchley factors, resulting in 25 interactive TCR features per pair of adjacent residues. The resultant list of 1250 TCR sequence features is listed in
                        - link "Table S2" [ref=e1139] [cursor=pointer]:
                          - /url: "#SD2"
                        - text: . For all analyses, we scaled each TCR feature such that it would have mean 0 and variance 1 in the training dataset. Because the number of amino acids in a TCR sequence varies from cell to cell, shorter TCR sequences contain gaps at some IMGT positions. We fill these entries with the value 0, following the scaling transformation.
                    - generic [ref=e1140]:
                      - heading "Developing TCR scoring functions" [level=5] [ref=e1141]
                      - paragraph [ref=e1142]: For our purposes, a TCR scoring function takes an amino acid TCR sequence as input and returns a numeric value proportional to the odds of that TCR being observed in the T cell state of interest. This transformation is accomplished by a set of TCR sequence feature weights, which can be learned from our training observations (70% of clones in Dataset 1 and Dataset 2). After training, the TCR sequence feature weights were fixed, and the resultant TCR scoring function can be applied to external data (e.g., Datasets 3–6).
                      - paragraph [ref=e1143]: "We considered three methods to construct TCR scoring functions:"
                      - paragraph [ref=e1144]: "Method 1: Regularized Canonical Correlation Analysis (rCCA)"
                      - paragraph [ref=e1145]: By identifying axes of covariation between TCR sequence features and T cell state features across cells, rCCA produces a series of correlated TCR and T cell state scoring functions. rCCA does not require the analyst to pre-specify T cell states of interest. Instead, it identifies continuous T cell states, which may not exactly align with preexisting T cell state definitions. We applied rCCA via R package “mixOmics” (v6.19.1), tuning ridge penalties via 5-fold cross-validation. For ease of interpretation, we reversed the sign of CV1 scores and CV3 scores.
                      - paragraph [ref=e1146]: "Method 2: Logistic Regression with Ridge Penalty"
                      - paragraph [ref=e1147]:
                        - text: "Results from rCCA clearly pointed to four recognizable T cell states. rCCA-based TCR scoring functions are optimized to predict the continuous-valued T cell states identified by rCCA, rather than recognizable and reproducible T cell state distinctions. Thus, to enhance biological interpretability, we translated the continuous T cell state values identified by rCCA into binary contrasts: 1) whether the cell belonged to transcriptional cluster A9 (innate-like T), 2) whether the cell belonged to transcriptional clusters B1–B3 (CD8T), 3) whether the cell belonged to the union of transcriptional cluster A5 or transcriptional cluster C15 (CD4"
                        - superscript [ref=e1148]: +
                        - text: T
                        - subscript [ref=e1149]: reg
                        - text: and CD8
                        - superscript [ref=e1150]: +
                        - text: T
                        - subscript [ref=e1151]: reg
                        - text: ", respectively,"
                        - link "Figure S3K" [ref=e1152] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: "), and 4) whether the cell did not belong to transcriptional clusters B3 or B9 (memory T). We fit a logistic regression to each of these four binary T cell state contrasts:"
                      - table [ref=e1153]:
                        - rowgroup [ref=e1154]:
                          - row "(Equation 3)" [ref=e1155]:
                            - cell [ref=e1156]
                            - cell "(Equation 3)" [ref=e1157]
                      - paragraph [ref=e1158]:
                        - text: Each observation
                        - emphasis [ref=e1159]: i
                        - text: represents one T cell. Consistent with our input to rCCA, we used one cell selected at random to represent each expanded clone.
                        - emphasis [ref=e1160]: TCS
                        - subscript [ref=e1161]:
                          - emphasis [ref=e1162]: i
                        - text: equals 1 if cell
                        - emphasis [ref=e1163]: i
                        - text: is observed in the T cell state of interest; 0 otherwise.
                      - paragraph [ref=e1164]:
                        - text: We used the same 1250 TCR sequence features as predictors, and the same set of training observations as in Method 1. To handle collinearity between these TCR sequence features, we implemented ridge regularization via R package “glmnet” (v4.0.2), using 5-fold cross-validation within the training set to select the optimal penalty weight. We removed innate-like cells (transcriptional cluster A9) from regressions focused on CD8T, T
                        - subscript [ref=e1165]: reg
                        - text: ", or memory T cell fate."
                      - paragraph [ref=e1166]: "Method 3: Convolutional Neural Network (CNN) Binary Classifier."
                      - paragraph [ref=e1167]:
                        - text: Methods 1 and 2 only consider linear effects of TCR sequence features and interactive effects limited to adjacent TCR residues. To assess whether nonlinear and/or motif-based TCR sequence feature effects would improve T cell state predictions, we implemented a Convolutional Neural Network (CNN) binary classifier for each of the four T cell state contrasts described above. In the CNN framework, each TCR sequence is represented by a 5 × 58 matrix, corresponding to 5 Atchley factors at each of the 58 residues comprising CDR1a, CDR2a, CDR3a, CDR1b, CDR2b, and CDR3b. After applying convolution and average pooling to this matrix, we concatenate the resultant hidden layer to the TCR score learned through logistic regression. This ensures that the CNN does not have to re-learn linear effects, and can instead focus on potential nonlinear and motif-based effects. We implemented these CNN binary classifiers via python package “torch” (v1.4.0), using the same training and testing split (within Dataset 1 and Dataset 2) as in Method 1 and 2. We used the Adam optimizer and the binary cross-entropy with logits loss function (“BCEWithLogitsLoss” from python package torch), and iterated over a grid of hyperparameters corresponding to batch size, learning rate, and size of hidden layers. For each of these hyperparameter combinations for each of the four cell state contrasts (3 × 2 × 3 × 4 = 72 models), we trained a CNN on Datasets 1 and 2, and applied the resultant classifier to Dataset 3. We observed minimal impact of hyperparameters on AUC, and therefore selected the least complex model (10 nodes in hidden layer, learning rate 0.0003, and batch size of 256). We used early stopping
                        - superscript [ref=e1168]:
                          - link "73" [ref=e1169] [cursor=pointer]:
                            - /url: "#R73"
                        - text: to mitigate overfitting, training only until classification performance stopped improving in the held-out testing data (
                        - link "Figures S5A" [ref=e1170] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: –
                        - link "S5D" [ref=e1171] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: ).
                      - paragraph [ref=e1172]:
                        - emphasis [ref=e1173]: "Benchmarking:"
                        - text: To benchmark these different TCR scoring functions methods, we applied them to a dataset external to training (Dataset 3), and scaled each type of TCR score to have mean 0 variance 1 prior to association testing via
                        - link "Equation 4" [ref=e1174] [cursor=pointer]:
                          - /url: "#FD4"
                        - text: .
                    - generic [ref=e1175]:
                      - heading "Applying TCR scoring functions to data outside of the training set" [level=5] [ref=e1176]
                      - paragraph [ref=e1177]: To apply the TCR scoring functions to data outside of the training set, we extracted the same 1250 TCR sequence features, multiplied each TCR feature value by its respective weight learned in from Dataset 1 and 2, and took the sum of these 1250 products. For each TCR feature value, we subtracted its mean value in Datasets 1–2 and divided the result by its standard deviation in Datasets 1–2. Similarly, for each summation over TCR feature value-weight products, we subtracted the Dataset 1–2 mean and divided the result by the Dataset 1–2 standard deviation. Thus, one unit of TCR-mem in any dataset corresponds to one standard deviation of TCR-mem in Datasets 1–2.
                    - generic [ref=e1178]:
                      - heading "TCR sequence feature dependence analysis" [level=5] [ref=e1179]
                      - paragraph [ref=e1180]: Given the correlation structure of TCR sequence features, we iteratively masked out correlated blocks of features using the Partition Explainer of the python package “shap”. To estimate the relative contribution of each CDR loop, we took the absolute value of Shapley scores and summed over examples in the positive class for each TCR scoring function.
                    - generic [ref=e1181]:
                      - heading "Association testing between TCR and T cell state" [level=5] [ref=e1182]
                      - paragraph [ref=e1183]: "To test for an association between a TCR score and T cell state (TCS) contrast of interest, we used mixed-effects logistic regression. Using R package “lme4” (v1.1.23), we fit the following regression:"
                      - table [ref=e1184]:
                        - rowgroup [ref=e1185]:
                          - row "(Equation 4)" [ref=e1186]:
                            - cell [ref=e1187]
                            - cell "(Equation 4)" [ref=e1188]
                      - paragraph [ref=e1189]:
                        - text: Each observation
                        - emphasis [ref=e1190]: i
                        - text: represents one T cell from individual
                        - emphasis [ref=e1191]: j
                        - text: . Consistent with our input to rCCA, we used one cell selected at random to represent each expanded clone.
                        - emphasis [ref=e1192]: TCS
                        - subscript [ref=e1193]:
                          - emphasis [ref=e1194]: i
                        - text: equals 1 if cell
                        - emphasis [ref=e1195]: i
                        - text: is observed in the T cell state of interest; 0 otherwise.
                        - emphasis [ref=e1196]: β
                        - subscript [ref=e1197]:
                          - emphasis [ref=e1198]: "0"
                        - text: is the global intercept;
                        - emphasis [ref=e1199]: β
                        - subscript [ref=e1200]:
                          - emphasis [ref=e1201]: 0j
                        - text: is a modification to the global intercept fit for each individual
                        - emphasis [ref=e1202]: j
                        - text: .
                        - emphasis [ref=e1203]: TCRscore
                        - subscript [ref=e1204]:
                          - emphasis [ref=e1205]: i
                        - text: represents TCR score values, which are standardized to have mean 0 and variance 1 in the training observations from Dataset 1 and Dataset 2.
                      - paragraph [ref=e1206]:
                        - text: To estimate
                        - emphasis [ref=e1207]: β
                        - subscript [ref=e1208]:
                          - emphasis [ref=e1209]: TCR-innate
                        - emphasis [ref=e1210]: ", β"
                        - subscript [ref=e1211]:
                          - emphasis [ref=e1212]: TCR-CD8
                        - emphasis [ref=e1213]: ", β"
                        - subscript [ref=e1214]:
                          - emphasis [ref=e1215]: TCR-reg
                        - emphasis [ref=e1216]: ", and β"
                        - subscript [ref=e1217]:
                          - emphasis [ref=e1218]: TCR-mem
                        - text: separately for each individual from Dataset 1 and Dataset 2 (
                        - link "Figures S4I" [ref=e1219] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: –
                        - link "S4L" [ref=e1220] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: ), we followed the same procedure with the removal of the
                        - emphasis [ref=e1221]: β
                        - subscript [ref=e1222]:
                          - emphasis [ref=e1223]: 0j
                        - text: term. Removing
                        - emphasis [ref=e1224]: β
                        - subscript [ref=e1225]:
                          - emphasis [ref=e1226]: 0j
                        - text: reduces the mixed-effects logistic regression to a logistic regression, requiring R package “stats” (v3.6.3) rather than “lme4” for parameter estimation. We included only individuals with at least 100 cells including at least 10 cells that matched the cell state of interest and at least 10 cells that did not match the cell state of interest in the regression. Then, to estimate the distribution of
                        - emphasis [ref=e1227]: β
                        - subscript [ref=e1228]:
                          - emphasis [ref=e1229]: TCR-innate
                        - text: across individuals, we used to these per-individual estimates as input to R function “rma” (from R package “metafor”, v4.0.0), using the maximum likelihood estimator of heterogeneity (method = “ML”).
                    - generic [ref=e1230]:
                      - heading "Analysis of nonproductive TCRs" [level=5] [ref=e1231]
                      - paragraph [ref=e1232]:
                        - text: To test whether our TCR scoring functions explained T cell state only when applied to the surface-expressed TCR, we analyzed nonproductive TCRs from blood and secondary lymphoid tissue (Dataset 4). We collected all contigs annotated as high confidence, full length, and nonproductive by cellranger vdj (v5.0.1). Many nonproductive TCRs are short in length due to a stop codon; accordingly, we lifted our minimum CDR3 amino acid requirement. Because nonproductive TCRs are lowly expressed, it is uncommon for both a nonproductive alpha chain and a nonproductive beta chain to be detected in the same cell. Thus, to attain statistical power, we did not require cells to have both a nonproductive alpha and a nonproductive beta chain. Instead, for each of our TCR scoring functions, we created a version that used only TCR alpha chain information and a version that used only TCR beta chain information (4 × 2 = 8 single-chain TCR scoring functions). As before, we used productive TCRs from Dataset 1 and Dataset 2 to train TCR feature weights. We then applied these single-chain TCR scoring functions to nonproductive TCRs from Dataset 4. We removed clonal expansion from Dataset 4 as before, using productive TCR sequences to define T cell clones and selecting one cell at random to represent each expanded clone. We then tested for associations to T cell state as outlined by
                        - link "Equation 4" [ref=e1233] [cursor=pointer]:
                          - /url: "#FD4"
                        - text: . To confirm that lack of association for nonproductive TCRs was not due to statistical power or dataset, we down-sampled productive TCRs from Dataset 4 to match the sample size of nonproductive TCRs and repeated association testing (
                        - link "Table S4" [ref=e1234] [cursor=pointer]:
                          - /url: "#SD4"
                        - text: ).
                    - generic [ref=e1235]:
                      - heading "TCR-mem within antigen-specific populations" [level=5] [ref=e1236]
                      - paragraph [ref=e1237]: "To stringently remove background Dextramer counts, we fit a negative binomial regression for each of the 44 Dextramers, estimating contributions from technical factors:"
                      - table [ref=e1238]:
                        - rowgroup [ref=e1239]:
                          - row "(Equation 5)" [ref=e1240]:
                            - cell [ref=e1241]
                            - cell "(Equation 5)" [ref=e1242]
                      - paragraph [ref=e1243]:
                        - emphasis [ref=e1244]: dUMI
                        - subscript [ref=e1245]:
                          - emphasis [ref=e1246]: i
                        - text: denotes the count of UMIs for cell
                        - emphasis [ref=e1247]: i
                        - text: for the Dextramer of interest.
                        - emphasis [ref=e1248]: ncUMI
                        - subscript [ref=e1249]:
                          - emphasis [ref=e1250]: k
                          - text: ;
                          - emphasis [ref=e1251]: i
                        - text: denotes the count of UMIs for negative control Dextramer
                        - emphasis [ref=e1252]: k
                        - text: collected for cell
                        - emphasis [ref=e1253]: i
                        - text: . We include
                        - emphasis [ref=e1254]: β
                        - subscript [ref=e1255]:
                          - emphasis [ref=e1256]: TCRexp
                        - emphasis [ref=e1257]: TCRexp
                        - subscript [ref=e1258]:
                          - emphasis [ref=e1259]: i
                        - text: and
                        - emphasis [ref=e1260]: β
                        - subscript [ref=e1261]:
                          - emphasis [ref=e1262]: CD
                          - text: "3"
                        - emphasis [ref=e1263]: expCD
                        - text: "3"
                        - emphasis [ref=e1264]: exp
                        - subscript [ref=e1265]:
                          - emphasis [ref=e1266]: i
                        - text: to correct for TCR expression level, as more TCRs expressed at the cell surface should render more opportunities to bind Dextramer.
                        - emphasis [ref=e1267]: TCRexp
                        - subscript [ref=e1268]:
                          - emphasis [ref=e1269]: i
                        - text: equals the log(CP10K + 1) normalized expression for CDR3 UMIs (alpha and beta summed) for cell i;
                        - emphasis [ref=e1270]: CD
                        - text: "3"
                        - emphasis [ref=e1271]: exp
                        - subscript [ref=e1272]:
                          - emphasis [ref=e1273]: i
                        - text: equals the CLR-normalized expression of the CD3 protein for cell i. We include
                        - emphasis [ref=e1274]: CD
                        - text: "8"
                        - emphasis [ref=e1275]: exp
                        - subscript [ref=e1276]:
                          - emphasis [ref=e1277]: i
                        - text: (CLR-normalized expression of the CD8 protein for cell i) to adjust for the possibility that greater co-receptor expression renders more opportunities to bind Dextramer. We used R package “MASS” (v7.3.54) to fit the negative binomial regressions.
                      - paragraph [ref=e1278]: "To normalize Dextramer staining values, we replaced each cell’s raw Dextramer UMI count with an expression of its negative binomial regression residual:"
                      - table [ref=e1279]:
                        - rowgroup [ref=e1280]:
                          - row "(Equation 6)" [ref=e1281]:
                            - cell [ref=e1282]
                            - cell "(Equation 6)" [ref=e1283]
                      - paragraph [ref=e1284]:
                        - emphasis [ref=e1285]: Dnorm
                        - subscript [ref=e1286]:
                          - emphasis [ref=e1287]: i
                        - text: equals the normalized Dextramer staining value for cell
                        - emphasis [ref=e1288]: i
                        - text: .
                        - emphasis [ref=e1289]: expected UMI
                        - subscript [ref=e1290]:
                          - emphasis [ref=e1291]: i
                        - text: equals the negative binomial prediction based on technical factors for cell
                        - emphasis [ref=e1292]: i
                        - text: . For most Dextramers, we observed a bimodal distribution of normalized Dextramer staining values, distinguishing a background population from an antigen-binding population with Dextramer UMI counts than could be attributed to technical factors. T cells in this putative antigen-specific population were less likely to have other Dextramers with non-zero UMI counts (
                        - link "Figures S7A" [ref=e1293] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: and
                        - link "S7B" [ref=e1294] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: ). By careful visual inspection, we set a normalized Dextramer staining threshold for each antigen-specific population to distinguish binders from non-binders (
                        - link "Figures S7A" [ref=e1295] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: –
                        - link "S7B" [ref=e1296] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: ).
                      - paragraph [ref=e1297]:
                        - text: If T cells assigned to the same antigen specificity based on Dextramer UMI counts really do share antigen specifiity, they should have similar TCR sequences. Thus, we turned to TCR sequences to validate our inferences about antigen specificity. We observed significant TCR sequence conservation within our inferred antigen-specific populations (
                        - link "Figures S7C" [ref=e1298] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: and
                        - link "S7D" [ref=e1299] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: ).
                      - paragraph [ref=e1300]: "Within each group of T cells assigned the same antigen specificity, we fit the following logistic regression (R package stats v3.6.3):"
                      - table [ref=e1301]:
                        - rowgroup [ref=e1302]:
                          - row "(Equation 7)" [ref=e1303]:
                            - cell [ref=e1304]
                            - cell "(Equation 7)" [ref=e1305]
                      - paragraph [ref=e1306]:
                        - text: memory
                        - subscript [ref=e1307]:
                          - emphasis [ref=e1308]: i
                        - text: takes the value 1 if T cell
                        - emphasis [ref=e1309]: i
                        - text: is observed in a memory state (clusters B1, B2, B4) and value 0 if T cell
                        - emphasis [ref=e1310]: i
                        - text: is observed in a naive state (cluster B3). As in previous analyses, we chose one cell at random to represent each expanded clone. To adjust for affinity between the TCR and Dextramer in question, we include
                        - emphasis [ref=e1311]: Dnorm
                        - subscript [ref=e1312]:
                          - emphasis [ref=e1313]: i
                        - text: as a covariate, equal to the extent of Dextramer staining following our custom normalization for cell i (see
                        - link "Equation 6" [ref=e1314] [cursor=pointer]:
                          - /url: "#FD6"
                        - text: ). For antigen-specific populations that span more than one of the four donors in Dataset 5, we include donor covariate terms to adjust for donor-specific effects. We required that the antigen-specific population have at least 10 distinct TCR clones. Altogether, this process yielded 29 estimates of
                        - emphasis [ref=e1315]: β
                        - subscript [ref=e1316]:
                          - emphasis [ref=e1317]: TCR – mem
                        - text: for 29 groups of T cells, each specific to a different Dextramer.
                      - paragraph [ref=e1318]:
                        - text: We next wanted to understand the typical value of
                        - emphasis [ref=e1319]: β
                        - subscript [ref=e1320]:
                          - emphasis [ref=e1321]: TCR – mem
                        - text: in any antigen-specific T cell population. With the 29 antigen-specific
                        - emphasis [ref=e1322]: β
                        - subscript [ref=e1323]:
                          - emphasis [ref=e1324]: TCR – mem
                        - text: estimates and their standard errors, we conducted a random-effects meta-analysis (R package “metafor”, v4.0.0). We used the maximum likelihood estimator of heterogeneity (method = “ML”).
