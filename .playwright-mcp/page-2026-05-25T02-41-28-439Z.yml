                        - text: estimates for the 29 Dextramer-specific populations.
                  - paragraph [ref=e641]:
                    - text: First, we tested whether higher TCR-mem led to greater cellular activation in Jurkat cells. We selected four naturally occurring TCR sequences found in human data
                    - superscript [ref=e642]:
                      - link "23" [ref=e643] [cursor=pointer]:
                        - /url: "#R23"
                    - text: that spanned the range of our TCR-mem metric and transduced each TCR into Jurkat cells (
                    - link "Figure 4B" [ref=e644] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ). All four TCR sequences recognize the same “ELA-” antigenic peptide from melanoma-associated antigen recognized by T cells (MART-1), presented on HLA-A*02:01.
                    - superscript [ref=e645]:
                      - link "23" [ref=e646] [cursor=pointer]:
                        - /url: "#R23"
                    - text: Thus, this array of TCR sequences allows us to examine whether changes in amino acid composition that increase TCR-mem indeed causally promote T cell memory formation while controlling for cognate antigen and HLA (
                    - link "Table 2" [ref=e647] [cursor=pointer]:
                      - /url: "#T2"
                    - text: ).
