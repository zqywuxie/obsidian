              - generic [ref=e254]:
                - heading "RESULTS" [level=2] [ref=e255]: RESULTS
                - generic [ref=e256]:
                  - heading "T cell transcriptional state annotation" [level=3] [ref=e257]
                  - paragraph [ref=e258]:
                    - text: To construct an accurately annotated reference of T cells, we used dataset 1 (from the COMBAT consortium
                    - superscript [ref=e259]:
                      - link "19" [ref=e260] [cursor=pointer]:
                        - /url: "#R19"
                    - text: ;
                    - link "Table 1" [ref=e261] [cursor=pointer]:
                      - /url: "#T1"
                    - text: ") with 371,621 T cells from 122 individuals with multimodal TotalSeq profiling of mRNA and surface proteins. We clustered the cells in two ways: first, agnostic to protein expression (clusters A1–A9;"
                    - link "Figures 1A" [ref=e262] [cursor=pointer]:
                      - /url: "#F1"
                    - text: and
                    - link "S1" [ref=e263] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ), and second, incorporating traditional surface markers via a linear multimodal strategy
                    - superscript [ref=e264]:
                      - link "26" [ref=e265] [cursor=pointer]:
                        - /url: "#R26"
                      - text: ","
                      - link "27" [ref=e266] [cursor=pointer]:
                        - /url: "#R27"
                    - text: (clusters B1–B9;
                    - link "Figure S2" [ref=e267] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Cluster A9, representing the
                    - emphasis [ref=e268]: PLZF
                    - superscript [ref=e269]: high
                    - text: innate-like T cell state, accounted for nearly all canonical mucosal-associated invariant T (MAIT) or natural killer T (NKT) TCRs (
                    - link "Figures 1B" [ref=e270] [cursor=pointer]:
                      - /url: "#F1"
                    - text: and
                    - link "1C" [ref=e271] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ). Clusters B1–B9 delineated CD4, CD8, central memory (CM), and effector memory (EM) states based on a curated list of 10 surface proteins, including CD45RO and CD45RA (
                    - link "Figure S2" [ref=e272] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ;
                    - link "STAR Methods" [ref=e273] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). To standardize cell state definitions across datasets, we projected all additional datasets (
                    - link "Table 1" [ref=e274] [cursor=pointer]:
                      - /url: "#T1"
                    - text: ) into these two embeddings and transferred annotations via k-nearest-neighbors classification (k = 5;
                    - link "STAR Methods" [ref=e275] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ).
                  - figure [ref=e276]:
                    - heading "Figure 1. T cells with matching TCR sequences reach similar transcriptional fates in different individuals." [level=4] [ref=e277]
                    - paragraph [ref=e278]:
                      - img "Figure 1." [ref=e279]
                    - link "Open in a new tab" [ref=e281] [cursor=pointer]:
                      - /url: figure/F1/
                    - generic [ref=e282]:
                      - paragraph [ref=e283]:
                        - text: (A) Uniform manifold approximation and projection (UMAP) of T cells from dataset 1 based on the first 20 batch-corrected principal components (PCs) of gene expression. Cells are colored by transcriptional cluster, named according to expression of marker genes and proteins (see
                        - link "Figure S1" [ref=e284] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: ).
                      - paragraph [ref=e285]:
                        - text: (B and C) T cells from dataset 1, colored yellow (B) if their paired TCR sequence includes the canonical genes for MAIT cells (
                        - emphasis [ref=e286]: TRAV*1–2
                        - text: with
                        - emphasis [ref=e287]: TRAJ*20
                        - text: ", -"
                        - emphasis [ref=e288]: "*33"
                        - text: ", or -"
                        - emphasis [ref=e289]: "*12"
                        - text: and
                        - emphasis [ref=e290]: TRBV*6
                        - text: or -
                        - emphasis [ref=e291]: "*20"
                        - text: ) or colored red (C) if their paired TCR sequence includes the canonical genes for NKT cells (
                        - emphasis [ref=e292]: TRAV10
                        - text: with
                        - emphasis [ref=e293]: TRAJ18
                        - text: and
                        - emphasis [ref=e294]: TRBV25–1
                        - text: ) or gray otherwise.
                      - paragraph [ref=e295]: (D) Seven example TCR-twin cell pairs from dataset 1 are highlighted in distinct colors. Within a twin pair, TCRs with matching sequences were observed in two different individuals.
                      - paragraph [ref=e296]:
                        - text: (E) Number of transcriptional cluster matches for TCR-twin cell pairs in each cluster. Real observed counts are compared to expected counts based on random sampling of T cells without regard for TCR sequence.
                        - emphasis [ref=e297]: p
                        - text: value is computed by binomial exact test with
                        - emphasis [ref=e298]: "n"
                        - text: = 115 TCR-twin pairs.
                - generic [ref=e299]:
                  - heading "Transcriptional fate matching between T cells with the same TCR sequence from different individuals" [level=3] [ref=e300]
                  - paragraph [ref=e301]:
                    - text: We first used dataset 1 (
                    - link "Table 1" [ref=e302] [cursor=pointer]:
                      - /url: "#T1"
                    - text: ") to assess whether perfect TCR sequence matching raised the likelihood of T cell state matching. Within an individual, identical TCR sequences likely reflect an expanded T cell clone, comprised of cells that tend to be transcriptionally similar. To avoid clonally related cells, we focused on identical TCR sequences sampled from two different individuals. We identified 115 pairs of “TCR twins”: two T cells from two different individuals with the same TCR α and β amino acid sequences ("
                    - link "Figure 1D" [ref=e303] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ;
                    - link "STAR Methods" [ref=e304] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). To test the general relationship between the TCR sequence and T cell state, we asked whether the transcriptional states of TCR twins were concordant more often than expected by chance. For statistical power in this analysis, we used relatively coarse clusters to define transcriptional states (A1–A9;
                    - link "Figure 1A" [ref=e305] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ).
                  - paragraph [ref=e306]:
                    - text: Under the null, we would expect 25 (of 115) transcriptionally concordant TCR-twin pairs (see
                    - link "STAR Methods" [ref=e307] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). Instead, we observed 80 (
                    - emphasis [ref=e308]: p
                    - text: = 6.1 × 10
                    - superscript [ref=e309]: −28
                    - text: ", exact binomial test,"
                    - link "Figure 1E" [ref=e310] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ;
                    - link "STAR Methods" [ref=e311] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). To assess if this enrichment was explained by major histocompatibility complex (MHC)(-like) restriction, we repeated our analysis with MAIT cell and NKT cell TCRs removed and observed an enrichment in concordant states (
                    - emphasis [ref=e312]: p
                    - text: = 2.3 × 10
                    - superscript [ref=e313]: −21
                    - text: ", exact binomial test). Partitioning into CD4"
                    - superscript [ref=e314]: +
                    - text: and CD8
                    - superscript [ref=e315]: +
                    - text: populations did not obviate enrichment either (
                    - emphasis [ref=e316]: p
                    - text: = 4.0 × 10
                    - superscript [ref=e317]: −9
                    - text: ","
                    - emphasis [ref=e318]: p
                    - text: = 0.00018, exact binomial test). Recognizing that SARS-CoV-2 infection is a potential confound, we filtered to individuals that were PCR negative for SARS-CoV-2 but continued to observe enrichment in both dataset 1 and dataset 2 (13 matches versus 6 expected by chance,
                    - emphasis [ref=e319]: p
                    - text: = 0.00048, exact binomial test; 11 matches versus 6 expected by chance,
                    - emphasis [ref=e320]: p
                    - text: = 0.00138, exact binomial test). To account for shared human leukocyte antigen (HLA) alleles, we repeated this analysis in an HLA-genotyped dataset
                    - superscript [ref=e321]:
                      - link "25" [ref=e322] [cursor=pointer]:
                        - /url: "#R25"
                    - text: and continued to observe enrichment regardless of whether the TCR twins were sampled from individuals with a shared HLA allele (
                    - emphasis [ref=e323]: p
                    - text: = 2.9 × 10
                    - superscript [ref=e324]: −101
                    - text: ", exact binomial test). Indeed, neither matched SARS-CoV-2 status nor matched HLA allele(s) significantly increased TCR twinning or similarity. These results suggest a consistent influence of TCR sequence on T cell fate in unrelated individuals."
                  - paragraph [ref=e325]:
                    - text: This analysis is limited to TCRs found in more than one individual (“public TCRs”), which comprise <0.01% of the TCRs in this cohort. Public TCRs have distinct structural features
                    - superscript [ref=e326]:
                      - link "28" [ref=e327] [cursor=pointer]:
                        - /url: "#R28"
                    - text: and could demonstrate transcriptional state matching due to recognition of common antigens. We hypothesized, however, that these results were driven to some extent by the distinct biophysical features of the TCR sequences. If so, similar, but not identical, TCR sequences would also promote similar T cell fates.
                - generic [ref=e328]:
                  - heading "A multidimensional approach to uncover TCR sequence features that guide T cell fate" [level=3] [ref=e329]
                  - paragraph [ref=e330]:
                    - text: To extend our study to private TCRs, we converted each TCR sequence into a vector of biophysical features. Consistent with other numerical representations of the TCR,
                    - superscript [ref=e331]:
                      - link "17" [ref=e332] [cursor=pointer]:
                        - /url: "#R17"
                      - text: ","
                      - link "29" [ref=e333] [cursor=pointer]:
                        - /url: "#R29"
                    - text: we translated each amino acid residue in both the α and β chains of the TCR into five Atchley factors.
                    - superscript [ref=e334]:
                      - link "30" [ref=e335] [cursor=pointer]:
                        - /url: "#R30"
                    - text: These factors correspond to hydrophobicity, size, charge, secondary structure, and heat capacity. Applying this to α and β complementarity-determining and framework regions of the TCR yielded 1190 biophysical features. Excluding invariant positions and framework regions and adding interaction terms between adjacent residues yielded 1,250 TCR features (
                    - link "Figures 2A" [ref=e336] [cursor=pointer]:
                      - /url: "#F2"
                    - text: and
                    - link "2B" [ref=e337] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ;
                    - link "Table S2" [ref=e338] [cursor=pointer]:
                      - /url: "#SD2"
                    - text: ;
                    - link "STAR Methods" [ref=e339] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ).
                  - figure [ref=e340]:
                    - heading "Figure 2. A quantitative approach to uncover TCR sequence features that influence T cell fate." [level=4] [ref=e341]
                    - paragraph [ref=e342]:
                      - img "Figure 2." [ref=e343]
                    - link "Open in a new tab" [ref=e345] [cursor=pointer]:
                      - /url: figure/F2/
                    - generic [ref=e346]:
                      - paragraph [ref=e347]: "Schematic of a T cell recognizing antigen through the T cell receptor (TCR), an αβ heterodimeric surface protein encoded by V, D, and J genes that are stochastically rearranged in each T cell. Black regions in between V, D, and J genes represent non-templated nucleotide insertions. The TCR surface protein contains six complementarity-determining regions (CDRs) that protrude toward the presented antigen: CDR1α, CDR2α, CDR3α, CDR1β, CDR2β, and CDR3β."
                      - paragraph [ref=e348]: (B) Our quantitative representation of TCR sequence data. We extract 1,250 sequence features from each TCR sequence, representing hydrophobicity, size, charge, secondary structure, and heat capacity of the amino acids in the six CDRs.
                      - paragraph [ref=e349]: (C) Canonical correlations between TCR and T cell state detected in training and held-out testing observations. Error bars denote the minimum and maximum canonical correlations observed in 1,000 permutations of the data.
                      - paragraph [ref=e350]: (D) Heatmap depicting Pearson correlation between genes and proteins in dataset 1 and the continuous T cell state identified by each canonical variate (CV).
                      - paragraph [ref=e351]: (E–H) UMAP of dataset 1 T cells, colored by T cell state scores for CV1, CV2, CV3, and CV4, respectively.
                      - paragraph [ref=e352]: (I–L) Percentage of contribution from each TCR region toward the TCR scoring function.
                      - paragraph [ref=e353]:
                        - text: (M–P) CDR3 amino acid contributions to each TCR scoring function, visualized as marginal correlations to the TCR score. Contributions from other TCR regions are displayed in
                        - link "Figure S4" [ref=e354] [cursor=pointer]:
                          - /url: "#SD1"
                        - text: .
                  - paragraph [ref=e355]:
                    - text: We aimed to identify TCR sequence effects on T cell state in an unbiased fashion, without restricting to preselected cell states. To find generalizable associations, we combined dataset 1 with a second published dataset (dataset 2,
                    - link "Table 1" [ref=e356] [cursor=pointer]:
                      - /url: "#T1"
                    - text: ;
                    - link "STAR Methods" [ref=e357] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ), resulting in 494,419 quality-controlled T cells from 256 individuals. We applied regularized canonical correlation analysis (rCCA) (
                    - link "STAR Methods" [ref=e358] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). Each axis identified by rCCA denotes a weighted sum of gene expression principal component (PC) scores (a transcriptional state) that correlates with a weighted sum of TCR sequence features.
                  - paragraph [ref=e359]:
                    - text: We mitigated technical confounding in our rCCA implementation. First, to prevent confounding by variable clone size, we selected one cell at random to represent each clone. We confirmed that results were invariant to the specific set of cells sampled (
                    - link "STAR Methods" [ref=e360] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). To mitigate overfitting, we added a ridge regularization to the covariance matrix for each of the inputs to rCCA, using 5-fold cross-validation to tune both lambda penalty values. To assess overfitting, we randomly assigned 68 donors to a validation test set, such that ~30% of clones (29.3%) were held out from training.
                - generic [ref=e361]:
                  - heading "rCCA identifies four T cell fates informed by TCR sequence" [level=3] [ref=e362]
                  - paragraph [ref=e363]:
                    - text: We observed canonical correlations between the TCR sequence and T cell state descending from
                    - emphasis [ref=e364]: R
                    - text: = 0.54. To assess the statistical significance of each canonical correlation, we permuted our data 1,000 times and re-applied rCCA (
                    - link "STAR Methods" [ref=e365] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). We observed empirical
                    - emphasis [ref=e366]: p
                    - text: values <0.001 for both training and held-out testing data for the first four canonical variates (CVs) (
                    - link "Figure 2C" [ref=e367] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ).
                  - paragraph [ref=e368]:
                    - text: To interpret the four continuous T cell states identified by rCCA, we examined CVs 1–4 in terms of cell scores and expression correlates (
                    - link "Figures 2D" [ref=e369] [cursor=pointer]:
                      - /url: "#F2"
                    - text: –
                    - link "2H" [ref=e370] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ;
                    - link "Table S3" [ref=e371] [cursor=pointer]:
                      - /url: "#SD3"
                    - text: ;
                    - link "STAR Methods" [ref=e372] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). Cells scoring the highest on CV1 localized to transcriptional cluster A9 (
                    - link "Figures 2E" [ref=e373] [cursor=pointer]:
                      - /url: "#F2"
                    - text: and
                    - link "S3A" [ref=e374] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ), the innate-like,
                    - emphasis [ref=e375]: PLZF
                    - superscript [ref=e376]: high
                    - text: transcriptional fate for canonical MAIT and NKT cell TCRs (
                    - link "Figures 1B" [ref=e377] [cursor=pointer]:
                      - /url: "#F1"
                    - text: and
                    - link "1C" [ref=e378] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ). CV2 tracked closely with CD8 versus CD4 surface expression, delineating CD4
                    - superscript [ref=e379]: +
                    - text: T versus CD8
                    - superscript [ref=e380]: +
                    - text: T populations (
                    - link "Figures 2F" [ref=e381] [cursor=pointer]:
                      - /url: "#F2"
                    - text: and
                    - link "S3B" [ref=e382] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: –
                    - link "S3D" [ref=e383] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). These results point to families of peptide presentation molecules as the primary source of covariation between the TCR sequence and T cell state. Indeed, it is well established that unconventional (MR1, CD1d), MHC class I, and MHC class II families each prefer biophysically distinct αβTCR sequences.
                    - superscript [ref=e384]:
                      - link "9" [ref=e385] [cursor=pointer]:
                        - /url: "#R9"
                      - text: ","
                      - link "13" [ref=e386] [cursor=pointer]:
                        - /url: "#R13"
                      - text: ","
                      - link "14" [ref=e387] [cursor=pointer]:
                        - /url: "#R14"
                      - text: ","
                      - link "31" [ref=e388] [cursor=pointer]:
                        - /url: "#R31"
                      - text: –
                      - link "35" [ref=e389] [cursor=pointer]:
                        - /url: "#R35"
                  - paragraph [ref=e390]:
                    - text: In addition to these known relationships, rCCA proposed previously unknown connections between the TCR sequence and T cell state. CV3 highlighted TCR sequence similarity between
                    - emphasis [ref=e391]: FOXP3
                    - text: "-expressing CD4"
                    - superscript [ref=e392]: +
                    - text: regulatory T (T
                    - subscript [ref=e393]: reg
                    - text: ) cells and KIR+
                    - emphasis [ref=e394]: HELIOS
                    - text: + CD8 T cells (
                    - link "Figures 2G" [ref=e395] [cursor=pointer]:
                      - /url: "#F2"
                    - text: and
                    - link "S3E" [ref=e396] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: –
                    - link "S3K" [ref=e397] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ), which have recently been described as human CD8
                    - superscript [ref=e398]: +
                    - text: T
                    - subscript [ref=e399]: reg
                    - text: cells.
                    - superscript [ref=e400]:
                      - link "36" [ref=e401] [cursor=pointer]:
                        - /url: "#R36"
                    - text: This suggests that the same TCR sequence features may promote suppressive functional states in both the CD4 and CD8 compartments. Most strikingly, CV4 appeared to capture TCR sequence differences between naive and memory T cells (
                    - link "Figures 2H" [ref=e402] [cursor=pointer]:
                      - /url: "#F2"
                    - text: and
                    - link "S3L" [ref=e403] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Surface protein measurements indicated that both EM and CM CD4
                    - superscript [ref=e404]: +
                    - text: and CD8
                    - superscript [ref=e405]: +
                    - text: T cells scored highly on CV4 (
                    - link "Figures S3M" [ref=e406] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: and
                    - link "S3N" [ref=e407] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). This raises the intriguing possibility that some sequence features render the TCR more generally prone to activation.
                - generic [ref=e408]:
                  - heading "TCR scoring functions quantify TCR sequence features that inform T cell fate" [level=3] [ref=e409]
                  - paragraph [ref=e410]:
                    - text: "The continuous T cell states defined by rCCA nominated four contrasts in T cell state for further study:"
                    - emphasis [ref=e411]: PLZF
                    - superscript [ref=e412]: high
                    - text: versus other, CD8T versus CD4T, regulatory T (T
                    - subscript [ref=e413]: reg
                    - text: ) versus conventional T (T
                    - subscript [ref=e414]: conv
                    - text: ), and memory versus naive. For each of these recognizable T cell fate decisions, we used logistic regression on the same observations from datasets 1 and 2 to learn a more precise predictive weighting scheme on the 1,250 TCR sequence features (
                    - link "Table S2" [ref=e415] [cursor=pointer]:
                      - /url: "#SD2"
                    - text: ;
                    - link "STAR Methods" [ref=e416] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). As a secondary analysis, we trained separately on COVID-positive and COVID-negative samples and verified that these predictive weighting schemes were robust to infection status (
                    - link "Figures S4A" [ref=e417] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: and
                    - link "S4B" [ref=e418] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: "). We named each predictive weighting scheme, or TCR scoring function, by the T cell state of interest: “TCR-innate”’ to predict the innate-like,"
                    - emphasis [ref=e419]: PLZF
                    - superscript [ref=e420]: high
                    - text: state, “TCR-CD8” to predict the CD8
                    - superscript [ref=e421]: +
                    - text: state, “TCR-reg” to predict the T
                    - subscript [ref=e422]: reg
                    - text: cell state, and “TCR-mem” to predict the memory state.
                  - paragraph [ref=e423]:
                    - text: To interpret each of these TCR scoring functions, we examined relative contributions from each complementarity-determining region (CDR) and amino acid residue (
                    - link "Figures 2I" [ref=e424] [cursor=pointer]:
                      - /url: "#F2"
                    - text: –
                    - link "2P" [ref=e425] [cursor=pointer]:
                      - /url: "#F2"
                    - text: and
                    - link "S4C" [ref=e426] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: –
                    - link "S4F" [ref=e427] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ;
                    - link "STAR Methods" [ref=e428] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). TCR-innate was characterized by critical amino acids in CDR2α, reflecting
                    - emphasis [ref=e429]: TRAV
                    - text: gene selection (
                    - link "Figure S4C" [ref=e430] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). As expected from previous studies,
                    - superscript [ref=e431]:
                      - link "13" [ref=e432] [cursor=pointer]:
                        - /url: "#R13"
                      - text: ","
                      - link "14" [ref=e433] [cursor=pointer]:
                        - /url: "#R14"
                    - text: TCR-CD8-high sequences were depleted for positive charge in the junctional mid-region of CDR3 (
                    - link "Figure 2N" [ref=e434] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ). TCR-reg reflected increased hydrophobic CDR3β residues in CD4 T
                    - subscript [ref=e435]: reg
                    - text: cells, consistent with previous reports.
                    - superscript [ref=e436]:
                      - link "10" [ref=e437] [cursor=pointer]:
                        - /url: "#R10"
                      - text: ","
                      - link "12" [ref=e438] [cursor=pointer]:
                        - /url: "#R12"
                    - text: Paired αβ TCR sequencing data revealed that enrichment for hydrophobic amino acids extended to CDR3α (
                    - link "Figure 2O" [ref=e439] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ). For TCR-mem, feature dependence analysis highlighted the importance of CDR3α and CDR3β (
                    - link "Figure 2L" [ref=e440] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ). We assessed TCR-reg and TCR-mem separately in CD4
                    - superscript [ref=e441]: +
                    - text: and CD8
                    - superscript [ref=e442]: +
                    - text: T cells and observed that these TCR scoring functions were equally applicable to both lineages (
                    - link "Figures S4G" [ref=e443] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: and
                    - link "S4H" [ref=e444] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ;
                    - link "STAR Methods" [ref=e445] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ).
                - generic [ref=e446]:
                  - heading "TCR scoring functions generalize across individuals" [level=3] [ref=e447]
                  - paragraph [ref=e448]:
                    - text: We considered the possibility that the associations between the TCR sequence and T cell state were driven by a subset of individuals. We first stratified each dataset by clinical status (COVID, sepsis, influenza, none of the above) and used mixed-effects logistic regression to calculate
                    - emphasis [ref=e449]: β
                    - subscript [ref=e450]:
                      - emphasis [ref=e451]: TCRscore,
                    - text: the association between the TCR score calculated based on both α and β chains, and the target T cell state (
                    - emphasis [ref=e452]: β
                    - subscript [ref=e453]:
                      - emphasis [ref=e454]: TCRscore
                    - text: = log odds ratio [OR] per standard deviation increase in TCR score; see
                    - link "STAR Methods" [ref=e455] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). In each clinical stratum, we observed a statistically significant positive association for each TCR scoring function (24 tests, maximum
                    - emphasis [ref=e456]: p
                    - text: = 0.001;
                    - link "Figures 3A" [ref=e457] [cursor=pointer]:
                      - /url: "#F3"
                    - text: –
                    - link "3D" [ref=e458] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ;
                    - link "Table S4" [ref=e459] [cursor=pointer]:
                      - /url: "#SD4"
                    - text: ). Reassured that our TCR scoring functions were not driven by the clinical subset, we considered the possibility of an unknown individual-level mediator, such as HLA genotype. We computed
                    - emphasis [ref=e460]: β
                    - subscript [ref=e461]:
                      - emphasis [ref=e462]: TCR-innate
                    - text: ","
                    - emphasis [ref=e463]: β
                    - subscript [ref=e464]:
                      - emphasis [ref=e465]: TCR-CD8
                    - text: ","
                    - emphasis [ref=e466]: β
                    - subscript [ref=e467]:
                      - emphasis [ref=e468]: TCR-reg,
                    - text: and
                    - emphasis [ref=e469]: β
                    - subscript [ref=e470]:
                      - emphasis [ref=e471]: TCR-mem
                    - text: within each individual’s T cells separately and estimated the proportion of individuals for whom our TCR score does not raise the odds of its target T cell state(the local false sign rate
                    - superscript [ref=e472]:
                      - link "37" [ref=e473] [cursor=pointer]:
                        - /url: "#R37"
                    - text: ). Random effects meta-analysis indicated a near-zero proportion for each of our four TCR scoring functions (<1 × 10
                    - superscript [ref=e474]: −6
                    - text: ;
                    - link "Figures S4I" [ref=e475] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: –
                    - link "S4L" [ref=e476] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ;
                    - link "STAR Methods" [ref=e477] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). We concluded that since our TCR scoring functions were robust to inter-individual variation, they should generalize to unseen samples.
                  - figure [ref=e478]:
                    - heading "Figure 3. TCR scoring functions generalize across individuals." [level=4] [ref=e479]
                    - paragraph [ref=e480]:
                      - img "Figure 3." [ref=e481]
                    - link "Open in a new tab" [ref=e483] [cursor=pointer]:
                      - /url: figure/F3/
                    - generic [ref=e484]:
                      - paragraph [ref=e485]:
                        - text: (A) Forest plot depicting the association between TCR-innate and
                        - emphasis [ref=e486]: PLZF
                        - superscript [ref=e487]: high
                        - text: T cell state for T cells from each subset of individuals.
                        - emphasis [ref=e488]: β
                        - subscript [ref=e489]:
                          - emphasis [ref=e490]: TCR-innate
                        - text: is computed via mixed-effects logistic regression, with TCR-innate scaled to mean 0, variance 1. Error bars denote 95% confidence intervals. Meta-analytic
                        - emphasis [ref=e491]: β
                        - subscript [ref=e492]:
                          - emphasis [ref=e493]: TCR-innate
                        - text: is estimated by fixed-effects inverse-variance-weighted meta-analysis.
                      - paragraph [ref=e494]:
                        - text: (B–D) Remaining forest plots depict the same association tests for (B) TCR-CD8 and CD8T cell state, (C) TCR-reg and T
                        - subscript [ref=e495]: reg
                        - text: cell state, and (D) TCR-mem and memory T cell state.
                      - paragraph [ref=e496]:
                        - text: (E–H) 95% confidence intervals for
                        - emphasis [ref=e497]: β
                        - subscript [ref=e498]:
                          - emphasis [ref=e499]: TCR-innate
                        - text: ","
                        - emphasis [ref=e500]: β
                        - subscript [ref=e501]:
                          - emphasis [ref=e502]: TCR-innate
                        - text: ","
                        - emphasis [ref=e503]: β
                        - subscript [ref=e504]:
                          - emphasis [ref=e505]: TCR-innate
                        - text: ", and"
                        - emphasis [ref=e506]: β
                        - subscript [ref=e507]:
                          - emphasis [ref=e508]: TCR-innate
                        - text: ", respectively, in the individuals from dataset 1 and dataset 2 held out from TCR score training."
                      - paragraph [ref=e509]: (I–L) Proportion of T cell clones from an external validation dataset (dataset 3) observed in each T cell state of interest within each decile of its corresponding TCR score.
                      - paragraph [ref=e510]:
                        - text: (M) Each point represents a decile of the TCR-innate score in dataset 3, with a horizontal bar spanning from its minimum to maximum value. We compute the odds ratio (OR; y axis) for the
                        - emphasis [ref=e511]: PLZF
                        - superscript [ref=e512]: high
                        - text: T cell state for T cells in each decile compared to T cells in the fifth decile. 95% CIs (error bars) and
                        - emphasis [ref=e513]: p
                        - text: values were computed via mixed-effects logistic regression.
                      - paragraph [ref=e514]:
                        - text: (N–P) Dataset 3 T cells as in (M) but for CD8T, T
                        - subscript [ref=e515]: reg
                        - text: ", and memory T cell states and their corresponding TCR scores."
                      - paragraph [ref=e516]:
                        - text: For (A)–(H), data are represented as log OR ± 95% confidence interval. For (M)–(P), data are represented as OR ± 95% confidence interval.
                        - emphasis [ref=e517]: p
                        - text: values were computed by the Wald test through mixed-effects logistic regression,
                        - emphasis [ref=e518]: "n"
                        - text: = 106,129 T cells.
                  - paragraph [ref=e519]:
                    - text: We next applied our TCR scoring functions to data outside of our training set. In the 30% of dataset 1 and dataset 2 T cell clones held out from training, we observed replication of each TCR scoring function (
                    - link "Figures 3E" [ref=e520] [cursor=pointer]:
                      - /url: "#F3"
                    - text: –
                    - link "3H" [ref=e521] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ;
                    - link "STAR Methods" [ref=e522] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). In an external dataset of peripheral blood T cells (dataset 3,
                    - link "Table 1" [ref=e523] [cursor=pointer]:
                      - /url: "#T1"
                    - text: ), we observed a consistent and statistically significant increase in the odds of the T cell state of interest for each TCR scoring function (
                    - link "Figures 3I" [ref=e524] [cursor=pointer]:
                      - /url: "#F3"
                    - text: –
                    - link "3P" [ref=e525] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ;
                    - link "Table S4" [ref=e526] [cursor=pointer]:
                      - /url: "#SD4"
                    - text: ). Compared to T cells in the lowest TCR-mem decile, T cells in the highest TCR-mem decile had a 66% greater odds of being observed in a memory state (OR = 1.66, 95% confidence interval [CI] = [1.57–1.76],
                    - emphasis [ref=e527]: p
                    - text: = 3.5 × 10
                    - superscript [ref=e528]: −68
                    - text: ;
                    - link "Table S4" [ref=e529] [cursor=pointer]:
                      - /url: "#SD4"
                    - text: ). These results indicate a substantial role for TCR-mem in shaping the odds of T cell memory formation.
                - generic [ref=e530]:
                  - heading "Alternative TCR scoring schemes" [level=3] [ref=e531]
                  - paragraph [ref=e532]:
                    - text: We next benchmarked our TCR scoring functions against existing TCR metrics. We previously developed a T
                    - subscript [ref=e533]: reg
                    - text: cell TCR scoring function, “TiRP,” using the TCR β chain alone.
                    - superscript [ref=e534]:
                      - link "10" [ref=e535] [cursor=pointer]:
                        - /url: "#R10"
                    - text: With the additional information of the α chain, TCR-reg clearly outperformed TiRP (
                    - emphasis [ref=e536]: β
                    - subscript [ref=e537]:
                      - emphasis [ref=e538]: TiRP
                    - text: = 0.14, 95% CI = [0.10–0.18];
                    - emphasis [ref=e539]: β
                    - subscript [ref=e540]:
                      - emphasis [ref=e541]: TCR-reg
                    - text: = 0.29, 95% CI = [0.25–0.32]; dataset 3 CD4T cells). Amino acid interaction strength
                    - superscript [ref=e542]:
                      - link "38" [ref=e543] [cursor=pointer]:
                        - /url: "#R38"
                    - text: (AAIS) has been postulated to estimate a TCR’s average affinity to peptide-MHC (pMHC),
                    - superscript [ref=e544]:
                      - link "39" [ref=e545] [cursor=pointer]:
                        - /url: "#R39"
                    - text: but this has not been directly tested. In dataset 3, increasing AAIS corresponded to an increase in the odds of memory state only when applied to CDR3 amino acids (
                    - emphasis [ref=e546]: β
                    - subscript [ref=e547]:
                      - emphasis [ref=e548]: AAIS
                    - text: = 0.02, 95% CI = [0.003–0.03],
                    - emphasis [ref=e549]: p
                    - text: = 0.008). The effect size for AAIS was minimal compared to TCR-mem (
                    - emphasis [ref=e550]: β
                    - subscript [ref=e551]:
                      - emphasis [ref=e552]: TCR-mem
                    - text: = 0.14, 95% CI = [0.12–0.15]), however. Including AAIS as a covariate did not substantially change the estimated effect size of TCR-mem (conditional
                    - emphasis [ref=e553]: β
                    - subscript [ref=e554]:
                      - emphasis [ref=e555]: TCR-mem
                    - text: = 0.14, 95% CI = [0.12–0.15], heterogeneity
                    - emphasis [ref=e556]: p
                    - text: = 0.92). TCR-reg and TCR-mem clearly outperform these alternative TCR scoring functions by capturing both α and β TCR sequence features that promote recognition in the context of the TCR-pMHC interface.
                  - paragraph [ref=e557]:
                    - text: We next wanted to assess if more complex models would provide better TCR scoring functions. For each of the four T cell states of interest, we trained a convolutional neural network (CNN) to detect possibly nonlinear associations between TCR amino acid motifs and T cell fate (
                    - link "STAR Methods" [ref=e558] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). However, this deep learning approach provided no substantial benefit in discovery or external validation data (
                    - link "Figure S5" [ref=e559] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ;
                    - link "Table S6" [ref=e560] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ).
                - generic [ref=e561]:
                  - heading "Untranslated products of V(D)J recombination do not affect T cell fate" [level=3] [ref=e562]
                  - paragraph [ref=e563]: "Because stochastic V(D)J recombination precedes T cell fate decisions, TCR sequence associations to T cell state likely reflect causal effects of V(D)J recombination. However, a causal pathway that begins with V(D)J recombination and ends with the T cell state likely includes several important biological mediators. To better understand these mediators, we decomposed V(D)J recombination into three products: (1) DNA-level excisions and insertions, (2) amino acid changes in the surface TCR, and (3) antigen recognition. To isolate (1) from (2), we analyzed nonproductive V(D)J recombination sequences that are not translated into surface TCR proteins. Then, to distinguish (3) from (2), we examined the TCR sequences and T cell states of antigen-labeled single cells."
                  - paragraph [ref=e564]:
                    - text: Nonproductive TCR sequence transcripts can be detected when an out-of-frame V(D)J recombination event on one chromosome is followed by an in-frame V(D)J recombination event on the other.
                    - superscript [ref=e565]:
                      - link "40" [ref=e566] [cursor=pointer]:
                        - /url: "#R40"
                    - text: Due to stop codons and frameshift errors, these nonproductive TCRs represent V(D)J genome rearrangements that are not translated into surface antigen receptors.
                    - superscript [ref=e567]:
                      - link "41" [ref=e568] [cursor=pointer]:
                        - /url: "#R41"
                    - text: To assess whether these DNA-level changes are sufficient to produce the observed effects on T cell state, we applied our TCR scoring functions to nonproductive TCR sequences (dataset 4,
                    - link "Table 1" [ref=e569] [cursor=pointer]:
                      - /url: "#T1"
                    - text: ). We observed no evidence of association for any of the four TCR scoring functions (
                    - emphasis [ref=e570]: p
                    - text: "> 0.05). Down-sampling did not obviate associations for productive TCRs, confirming that the lack of association was not due to reduced statistical power ("
                    - link "Table S4" [ref=e571] [cursor=pointer]:
                      - /url: "#SD4"
                    - text: ;
                    - link "STAR Methods" [ref=e572] [cursor=pointer]:
                      - /url: "#S20"
                    - text: ). We concluded that the DNA-level excisions and insertions from V(D)J recombination are, in general, not sufficient to affect T cell state; recombination products must be expressed at the protein level.
                - generic [ref=e573]:
                  - heading "TCR-mem predicts increased T cell activation within antigen-specific populations" [level=3] [ref=e574]
                  - paragraph [ref=e575]:
                    - text: T cell activation, marked by CD69 upregulation, is a critical first step in T cell memory formation.
                    - superscript [ref=e576]:
                      - link "42" [ref=e577] [cursor=pointer]:
                        - /url: "#R42"
                      - text: ","
                      - link "43" [ref=e578] [cursor=pointer]:
                        - /url: "#R43"
                    - text: If TCR-mem increases the odds of memory formation by promoting early activation, then (1) recently activated T cells (
                    - emphasis [ref=e579]: CD69
                    - superscript [ref=e580]: high
                    - text: ","
                    - emphasis [ref=e581]: MK67
                    - superscript [ref=e582]: high
                    - text: ", CD38"
                    - superscript [ref=e583]: +
                    - text: ", HLA-DR"
                    - superscript [ref=e584]: +
                    - text: ) should exhibit high TCR-mem, and (2) this phenomenon should be apparent in Jurkat cells, which biologically resemble T cells in activation but not the subsequent steps of memory formation. We identified recently activated T cells (
                    - emphasis [ref=e585]: CD69
                    - superscript [ref=e586]: high
                    - text: ","
                    - emphasis [ref=e587]: MK67
                    - superscript [ref=e588]: high
                    - text: ", CD38"
                    - superscript [ref=e589]: +
                    - text: ", HLA-DR"
                    - superscript [ref=e590]: +
                    - text: ) in dataset 1 and observed that TCR-mem in this subset was just as high as TCR-mem in other memory subsets (
                    - link "Figure 4A" [ref=e591] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ). Thus, we hypothesized that TCR-mem sequence features promote T cell activation.
                  - figure [ref=e592]:
                    - heading "Figure 4. TCR sequences that recognize the same antigen can be poised for different fates." [level=4] [ref=e593]
